<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地理模型教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1EE; --panel:#FFFFFF; --ink:#1D2B28; --muted:#586864; --line:#C9D3CF;
  --contour:#AFC3BA; --contour-strong:#7F9C90;
  --t-hydro:#1D6E93; --t-climate:#B06E12; --t-landform:#7A5638; --t-human:#6B4E8C;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","PMingLiU","MingLiU",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111917; --panel:#18221F; --ink:#E3EBE7; --muted:#9AADA6; --line:#2C3A36;
    --contour:#26352F; --contour-strong:#3E5A50;
    --t-hydro:#5CB2D9; --t-climate:#E0A04A; --t-landform:#C49A74; --t-human:#A98BD0;
  }
}
:root[data-theme="dark"]{
  --paper:#111917; --panel:#18221F; --ink:#E3EBE7; --muted:#9AADA6; --line:#2C3A36;
  --contour:#26352F; --contour-strong:#3E5A50;
  --t-hydro:#5CB2D9; --t-climate:#E0A04A; --t-landform:#C49A74; --t-human:#A98BD0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--t-hydro);outline-offset:3px;border-radius:4px}

/* ---------- 首頁 ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero svg path{fill:none;stroke:var(--contour);stroke-width:1.2}
.hero svg path.idx{stroke:var(--contour-strong);stroke-width:1.8}
.hero-inner{position:relative;max-width:1120px;margin:0 auto;padding:clamp(48px,9vw,112px) clamp(20px,5vw,48px) clamp(36px,6vw,64px)}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(44px,8vw,96px);line-height:1.05;letter-spacing:.04em;margin:0}
.lede{margin:18px 0 0;max-width:30em;color:var(--muted);font-size:clamp(16px,1.6vw,19px)}

.wrap{max-width:1120px;margin:0 auto;padding:28px clamp(20px,5vw,48px) 72px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab .n{color:var(--muted);font-size:14px}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.7}

.group{margin-top:36px}
.group h2{font-family:var(--serif);font-weight:700;font-size:26px;margin:0 0 4px;display:flex;align-items:baseline;gap:12px}
.group h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);align-self:center}
.group h2 small{font-family:var(--sans);font-weight:400;font-size:15px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--c)}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:4px 20px;align-items:center;padding:20px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--c) 6%,transparent)}
.item .ico{font-size:34px;line-height:1;text-align:center}
.item h3{margin:0;font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.35}
.item p{margin:4px 0 0;color:var(--muted);max-width:40em}
.item .keys{margin-top:6px;font-size:14px;color:var(--muted)}
kbd{font-family:inherit;font-size:13px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--panel);color:var(--ink)}
.open{border:0;background:var(--c);color:#fff;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .open{color:#0E1614}}
:root[data-theme="dark"] .open{color:#0E1614}
@media (max-width:640px){
  .item{grid-template-columns:40px 1fr}
  .item .ico{font-size:28px;align-self:start;padding-top:4px}
  .item .open{grid-column:2;justify-self:start;margin-top:8px}
  .item .keys{display:none}
}
footer{max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,48px) 40px;color:var(--muted);font-size:14px}

/* ---------- 模型播放畫面 ---------- */
.viewer{position:fixed;inset:0;z-index:10;background:var(--paper);display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer.on{display:flex}
.bar{flex:none;display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 14px;cursor:pointer;white-space:nowrap}
.bar .ttl{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ttl i{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.bar .hint{color:var(--muted);font-size:13px}
@media (max-width:640px){.bar .hint{display:none}}
.viewer iframe{flex:1;width:100%;border:0;background:var(--paper)}
body.viewing{overflow:hidden}
@media (prefers-reduced-motion:no-preference){
  .hero svg path{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.4s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
</style>
</head>
<body>
<header class="hero">
  <svg id="contours" aria-hidden="true"></svg>
  <div class="hero-inner">
    <h1>地理模型教室</h1>
    <p class="lede">國中、高中地理課堂用的互動模型與動畫。選一個主題，點開就能直接投影講解。</p>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" id="tabs" aria-label="依主題篩選"></nav>
  <div id="groups"></div>
</main>
<footer id="foot"></footer>

<section class="viewer" id="viewer" aria-label="模型">
  <div class="bar">
    <button id="back" type="button">← 回首頁</button>
    <div class="ttl" id="vtitle"></div>
    <span class="hint"><kbd>Esc</kbd> 回首頁</span>
    <button id="fs" type="button">全螢幕</button>
  </div>
  <iframe id="frame" title="模型內容" allow="fullscreen" allowfullscreen></iframe>
</section>

<!-- 主題與模型清單：新增模型時只要在這裡加一筆 -->

:clamp(14px,1.3vw,20px); text-align:center; min-height:1.4em}\n.gauge .state.hi{color:var(--danger)}\n\n.water{fill:var(--water)} .land{fill:var(--land)} .land2{fill:var(--land-2)}\n.levee{stroke:var(--levee); stroke-width:5; stroke-linecap:round}\n.flowline{fill:none; stroke:var(--water-2); stroke-width:3; stroke-dasharray:18 26; animation:flow 1.6s linear infinite}\n@keyframes flow{to{stroke-dashoffset:-44}}\n.cover{fill:var(--ice); stroke:var(--ice-edge); stroke-width:2}\n.floe{fill:var(--ice); stroke:var(--ice-edge); stroke-width:1.6}\n.floe.piled{stroke:var(--cold); stroke-width:2}\n.flood{fill:var(--water); opacity:.88}\n.tag text{font-size:22px; font-weight:700; fill:var(--ink); paint-order:stroke; stroke:var(--panel); stroke-width:6px; stroke-linejoin:round}\n.tag line{stroke:var(--ink); stroke-width:2}\n.tag.danger text{fill:var(--danger)}\n.tband text{font-size:19px; font-weight:700; fill:#fff}\n.axis text{font-size:20px; fill:var(--muted); font-weight:700}\n.axis line{stroke:var(--muted); stroke-width:2}\n\n/* map */\n#map svg{width:100%; height:100%}\n.m-lat{stroke:var(--line); stroke-width:1.5; stroke-dasharray:6 6}\n.m-latlbl{fill:var(--muted); font-size:15px}\n.m-river{fill:none; stroke:var(--water); stroke-width:6; stroke-linejoin:round; stroke-linecap:round}\n.m-seg{fill:none; stroke-width:12; stroke-linejoin:round; stroke-linecap:round; opacity:.9}\n.m-flow{fill:none; stroke:#fff; stroke-width:3; stroke-dasharray:10 16; animation:flow 1.2s linear infinite}\n.m-city{fill:var(--ink)} .m-citylbl{font-size:16px; fill:var(--ink)}\n.m-seglbl{font-size:21px; font-weight:700}\n.m-note{font-size:17px; fill:var(--muted)}\n.m-sea{fill:var(--cold); opacity:.18}\n\n.m2ice-e{fill:none; stroke:var(--ice-edge); stroke-width:13; stroke-linejoin:round}\n.m2ice{fill:none; stroke:var(--ice); stroke-width:9; stroke-linejoin:round}\n.m2floe{fill:var(--ice); stroke:var(--ice-edge); stroke-width:1.2}\n.m2floe.piled{stroke:var(--cold)}\n#m2flood circle{fill:var(--water); opacity:.45}\n.m2tags text{font-size:18px; font-weight:700; fill:var(--ink); paint-order:stroke; stroke:var(--paper); stroke-width:5px; stroke-linejoin:round}\n.m2tags text.danger{fill:var(--danger)}\n#map2 svg{width:100%; height:100%}\n/* panels */\n.panel{flex:1; overflow:auto; align-self:stretch; display:flex; align-items:center; justify-content:center}\n.panel-inner{width:100%; max-width:1180px}\ntable{width:100%; border-collapse:collapse; font-size:clamp(15px,1.45vw,23px); line-height:1.5}\nth,td{padding:.55em .7em; text-align:left; vertical-align:top; border-bottom:1.5px solid var(--line)}\nthead th{font-family:\"Noto Serif TC\",serif; font-size:1.15em; border-bottom:3px solid var(--ink)}\nthead th.nm{color:var(--cold)} thead th.sd{color:var(--warm)}\ntbody th{color:var(--muted); font-weight:700; white-space:nowrap; width:7em}\ntr.common td{font-weight:700}\n.impacts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(14px,2vw,34px) clamp(20px,3vw,50px)}\n.impacts div{border-left:5px solid var(--water); padding:.2em 0 .2em .9em; font-size:clamp(15px,1.45vw,23px); line-height:1.55}\n.impacts div.case{border-left-color:var(--danger); grid-column:1/-1}\n.impacts b{display:block; font-size:1.15em; margin-bottom:.15em}\n.summary{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:clamp(16px,3vw,56px); font-size:clamp(15px,1.45vw,23px); line-height:1.55}\n.summary h2{font-family:\"Noto Serif TC\",serif; font-size:1.3em; margin:0 0 .5em}\n.summary ol{margin:0; padding-left:1.4em} .summary li{margin-bottom:.55em}\n.periods div{border-left:5px solid; padding:.1em 0 .1em .8em; margin-bottom:.8em}\n.periods .w{border-color:var(--cold)} .periods .s{border-color:var(--warm)}\n.ext{color:var(--muted); font-size:.9em; margin-top:1em}\n\n.caption{\n  font-size:clamp(17px,1.85vw,29px); line-height:1.6; max-width:62em; margin:0; min-height:3.2em;\n}\n.caption b{color:var(--cold)}\nnav{display:flex; align-items:center; gap:12px}\nnav button{\n  font:inherit; font-size:clamp(15px,1.3vw,20px); font-weight:700; cursor:pointer;\n  padding:.45em 1.1em; border-radius:6px; border:2px solid var(--ink); background:transparent; color:var(--ink);\n}\nnav button.primary{background:var(--ink); color:var(--paper)}\nnav button:disabled{opacity:.3; cursor:default}\nnav button:focus-visible,.dots button:focus-visible{outline:3px solid var(--cold); outline-offset:3px}\n.dots{display:flex; gap:6px; flex:1; justify-content:center; flex-wrap:wrap}\n.dots button{width:14px; height:14px; padding:0; border-radius:50%; border:2px solid var(--muted); background:transparent; cursor:pointer}\n.dots button.on{background:var(--ink); border-color:var(--ink)}\n.hint{color:var(--muted); font-size:13px}\n\n@media (max-width:700px){\n  #strip{flex-direction:column}\n  .gauge{width:100%; flex-direction:row; height:54px; padding:0}\n  .tube{height:26px; min-height:0; width:auto; flex:1; border:3px solid var(--ink); border-radius:0 10px 10px 0; border-left:none}\n  .tube .fill{top:0; bottom:0; left:0; right:auto; height:auto!important; border-radius:0}\n  .tube .warn{top:-6px; bottom:-6px; left:auto; right:auto; border-top:none; border-left:3px dashed var(--danger)}\n  .tube .warn span{display:none}\n  .impacts,.summary{grid-template-columns:1fr}\n  .hint{display:none}\n  tbody th{white-space:normal; width:auto}\n}\n@media (prefers-reduced-motion: reduce){.flowline,.m-flow{animation:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n  <header>\n    <div class=\"hgroup\"><h1 id=\"title\"><\/h1><span id=\"season\" class=\"season\"><\/span><\/div>\n    <span class=\"counter\" id=\"counter\"><\/span>\n  <\/header>\n\n  <main class=\"stage\" id=\"stage\">\n    <!-- 河道動畫 -->\n    <section class=\"view\" id=\"strip\">\n      <svg viewBox=\"0 0 1000 420\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"河道示意動畫\">\n        <defs>\n          <linearGradient id=\"gWC\" x1=\"0\" x2=\"1\"><stop offset=\"0\" style=\"stop-color:var(--warm)\"/><stop offset=\"1\" style=\"stop-color:var(--cold)\"/><\/linearGradient>\n          <linearGradient id=\"gCW\" x1=\"0\" x2=\"1\"><stop offset=\"0\" style=\"stop-color:var(--cold)\"/><stop offset=\"1\" style=\"stop-color:var(--warm)\"/><\/linearGradient>\n          <pattern id=\"crack\" width=\"60\" height=\"40\" patternUnits=\"userSpaceOnUse\">\n            <path d=\"M0 12 L18 16 L30 8 L60 14 M10 40 L22 26 L40 30 L52 22\" stroke=\"var(--ice-crack)\" stroke-width=\"1.5\" fill=\"none\"/>\n          <\/pattern>\n          <clipPath id=\"clipCh\"><rect x=\"40\" y=\"150\" width=\"920\" height=\"120\"/><\/clipPath>\n          <clipPath id=\"clipAll\"><rect x=\"40\" y=\"56\" width=\"920\" height=\"310\"/><\/clipPath>\n        <\/defs>\n        <g class=\"tband\" id=\"tband\">\n          <rect id=\"tbar\" x=\"40\" y=\"10\" width=\"920\" height=\"36\" rx=\"4\" fill=\"url(#gWC)\"/>\n          <text id=\"tL\" x=\"54\" y=\"35\"><\/text>\n          <text id=\"tR\" x=\"946\" y=\"35\" text-anchor=\"end\"><\/text>\n        <\/g>\n        <rect class=\"land\" x=\"40\" y=\"56\" width=\"920\" height=\"94\"/>\n        <rect class=\"land2\" x=\"40\" y=\"270\" width=\"920\" height=\"96\"/>\n        <line class=\"levee\" x1=\"40\" y1=\"140\" x2=\"960\" y2=\"140\"/>\n        <line class=\"levee\" x1=\"40\" y1=\"280\" x2=\"960\" y2=\"280\"/>\n        <rect class=\"water\" x=\"40\" y=\"150\" width=\"920\" height=\"120\"/>\n        <g clip-path=\"url(#clipCh)\">\n          <path class=\"flowline\" d=\"M40 175 H960\"/><path class=\"flowline\" d=\"M40 205 H960\" style=\"animation-delay:-.5s\"/>\n          <path class=\"flowline\" d=\"M40 235 H960\" style=\"animation-delay:-1s\"/><path class=\"flowline\" d=\"M40 258 H960\" style=\"animation-delay:-.3s\"/>\n        <\/g>\n        <g clip-path=\"url(#clipAll)\"><path id=\"floodT\" class=\"flood\"/><path id=\"floodB\" class=\"flood\"/><\/g>\n        <g clip-path=\"url(#clipCh)\">\n          <rect id=\"cover\" class=\"cover\" x=\"960\" y=\"150\" width=\"0\" height=\"120\"/>\n          <rect id=\"coverTex\" x=\"960\" y=\"150\" width=\"0\" height=\"120\" fill=\"url(#crack)\"/>\n          <g id=\"floes\"><\/g>\n        <\/g>\n        <g id=\"tags\"><\/g>\n        <g class=\"axis\">\n          <text x=\"40\" y=\"402\" id=\"aL\">上游<\/text>\n          <text x=\"960\" y=\"402\" text-anchor=\"end\" id=\"aR\">下游<\/text>\n          <line x1=\"410\" y1=\"396\" x2=\"600\" y2=\"396\"/><path d=\"M600 396 l-14 -8 v16z\" fill=\"var(--muted)\"/>\n          <text x=\"505\" y=\"386\" text-anchor=\"middle\">水流方向<\/text>\n        <\/g>\n      <\/svg>\n      <div class=\"gauge\" aria-live=\"polite\">\n        <div class=\"lbl\">水位<\/div>\n        <div class=\"tube\"><div class=\"fill\" id=\"gFill\"><\/div><div class=\"warn\" style=\"bottom:70%\"><span>警戒<\/span><\/div><\/div>\n        <div class=\"state\" id=\"gState\">正常<\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 地圖 -->\n    <section class=\"view\" id=\"map\">\n      <svg viewBox=\"0 0 860 360\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"黃河凌汛河段位置圖\">\n        <path class=\"m-sea\" d=\"M790 120 Q840 110 860 130 L860 220 Q820 215 792 190 Q780 160 790 120Z\"/>\n        <text class=\"m-note\" x=\"812\" y=\"172\" text-anchor=\"middle\">渤海<\/text>\n        <line class=\"m-lat\" x1=\"20\" y1=\"80\" x2=\"860\" y2=\"80\"/><text class=\"m-latlbl\" x=\"24\" y=\"72\">40°N<\/text>\n        <line class=\"m-lat\" x1=\"20\" y1=\"280\" x2=\"860\" y2=\"280\"/><text class=\"m-latlbl\" x=\"24\" y=\"272\">35°N<\/text>\n        <path class=\"m-river\" d=\"M110 250 L152 236 L208 180 L252 140 L272 112 L280 68 L296 48 L350 50 L400 56 L448 68 L444 104 L430 170 L416 236 L412 296 L448 288 L496 284 L544 282 L572 284 L604 268 L680 212 L720 184 L768 168 L792 160\"/>\n        <path class=\"m-seg\" style=\"stroke:var(--cold)\" d=\"M208 180 L252 140 L272 112 L280 68 L296 48 L350 50 L400 56 L448 68\"/>\n        <path class=\"m-flow\" d=\"M208 180 L252 140 L272 112 L280 68 L296 48 L350 50 L400 56 L448 68\"/>\n        <path class=\"m-seg\" style=\"stroke:var(--warm)\" d=\"M604 268 L680 212 L720 184 L768 168\"/>\n        <path class=\"m-flow\" d=\"M604 268 L680 212 L720 184 L768 168\"/>\n        <g>\n          <circle class=\"m-city\" cx=\"152\" cy=\"236\" r=\"5\"/><text class=\"m-citylbl\" x=\"140\" y=\"262\" text-anchor=\"middle\">蘭州<\/text>\n          <circle class=\"m-city\" cx=\"252\" cy=\"140\" r=\"5\"/><text class=\"m-citylbl\" x=\"240\" y=\"130\" text-anchor=\"end\">銀川<\/text>\n          <circle class=\"m-city\" cx=\"400\" cy=\"56\" r=\"5\"/><text class=\"m-citylbl\" x=\"400\" y=\"36\" text-anchor=\"middle\">包頭<\/text>\n          <circle class=\"m-city\" cx=\"544\" cy=\"282\" r=\"5\"/><text class=\"m-citylbl\" x=\"544\" y=\"308\" text-anchor=\"middle\">鄭州<\/text>\n          <circle class=\"m-city\" cx=\"680\" cy=\"212\" r=\"5\"/><text class=\"m-citylbl\" x=\"668\" y=\"200\" text-anchor=\"end\">濟南<\/text>\n        <\/g>\n        <text class=\"m-seglbl\" x=\"300\" y=\"150\" style=\"fill:var(--cold)\">寧蒙河段<\/text>\n        <text class=\"m-note\" x=\"300\" y=\"174\">寧夏、內蒙古｜由南往北<\/text>\n        <text class=\"m-seglbl\" x=\"640\" y=\"310\" style=\"fill:var(--warm)\">山東河段<\/text>\n        <text class=\"m-note\" x=\"640\" y=\"334\">由西南往東北<\/text>\n        <g transform=\"translate(520 110)\">\n          <line x1=\"0\" y1=\"80\" x2=\"0\" y2=\"0\" stroke=\"var(--muted)\" stroke-width=\"3\"/><path d=\"M0 -4 l-9 16 h18z\" fill=\"var(--muted)\"/>\n          <text class=\"m-note\" x=\"16\" y=\"30\">緯度愈高<\/text><text class=\"m-note\" x=\"16\" y=\"54\">氣溫愈低<\/text>\n        <\/g>\n      <\/svg>\n    <\/section>\n\n    <section class=\"view\" id=\"map2\">\n      <svg viewBox=\"0 0 860 360\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"黃河凌汛動畫\">\n        <path class=\"m-sea\" d=\"M790 120 Q840 110 860 130 L860 220 Q820 215 792 190 Q780 160 790 120Z\"/>\n        <text class=\"m-note\" x=\"812\" y=\"172\" text-anchor=\"middle\">渤海<\/text>\n        <line class=\"m-lat\" x1=\"20\" y1=\"80\" x2=\"860\" y2=\"80\"/><text class=\"m-latlbl\" x=\"24\" y=\"72\">40°N<\/text>\n        <line class=\"m-lat\" x1=\"20\" y1=\"280\" x2=\"860\" y2=\"280\"/><text class=\"m-latlbl\" x=\"24\" y=\"272\">35°N<\/text>\n        <path class=\"m-river\" d=\"M110 250 L152 236 L208 180 L252 140 L272 112 L280 68 L296 48 L350 50 L400 56 L448 68 L444 104 L430 170 L416 236 L412 296 L448 288 L496 284 L544 282 L572 284 L604 268 L680 212 L720 184 L768 168 L792 160\"/>\n        <g id=\"m2flood\"><\/g>\n        <path id=\"m2e_nm\" class=\"m2ice-e\" d=\"M152 236 L208 180 L252 140 L272 112 L280 68 L296 48 L350 50 L400 56 L448 68\"/><path id=\"m2i_nm\" class=\"m2ice\" d=\"M152 236 L208 180 L252 140 L272 112 L280 68 L296 48 L350 50 L400 56 L448 68\"/>\n        <path id=\"m2e_sd\" class=\"m2ice-e\" d=\"M544 282 L572 284 L604 268 L680 212 L720 184 L768 168\"/><path id=\"m2i_sd\" class=\"m2ice\" d=\"M544 282 L572 284 L604 268 L680 212 L720 184 L768 168\"/>\n        <g id=\"m2floes\"><\/g>\n        <g>\n          <circle class=\"m-city\" cx=\"152\" cy=\"236\" r=\"5\"/><text class=\"m-citylbl\" x=\"140\" y=\"262\" text-anchor=\"middle\">蘭州<\/text>\n          <circle class=\"m-city\" cx=\"252\" cy=\"140\" r=\"5\"/><text class=\"m-citylbl\" x=\"240\" y=\"130\" text-anchor=\"end\">銀川<\/text>\n          <circle class=\"m-city\" cx=\"400\" cy=\"56\" r=\"5\"/><text class=\"m-citylbl\" x=\"400\" y=\"36\" text-anchor=\"middle\">包頭<\/text>\n          <circle class=\"m-city\" cx=\"544\" cy=\"282\" r=\"5\"/><text class=\"m-citylbl\" x=\"544\" y=\"308\" text-anchor=\"middle\">鄭州<\/text>\n          <circle class=\"m-city\" cx=\"680\" cy=\"212\" r=\"5\"/><text class=\"m-citylbl\" x=\"668\" y=\"200\" text-anchor=\"end\">濟南<\/text>\n        <\/g>\n        <text class=\"m-seglbl\" x=\"300\" y=\"150\" style=\"fill:var(--cold)\">寧蒙河段<\/text>\n        <text class=\"m-note\" x=\"300\" y=\"174\">寧夏、內蒙古｜由南往北<\/text>\n        <text class=\"m-seglbl\" x=\"640\" y=\"310\" style=\"fill:var(--warm)\">山東河段<\/text>\n        <text class=\"m-note\" x=\"640\" y=\"334\">由西南往東北<\/text>\n        <g transform=\"translate(520 110)\">\n          <line x1=\"0\" y1=\"80\" x2=\"0\" y2=\"0\" stroke=\"var(--muted)\" stroke-width=\"3\"/><path d=\"M0 -4 l-9 16 h18z\" fill=\"var(--muted)\"/>\n          <text class=\"m-note\" x=\"16\" y=\"30\">緯度愈高<\/text><text class=\"m-note\" x=\"16\" y=\"54\">氣溫愈低<\/text>\n        <\/g>\n        <g id=\"m2tags\" class=\"m2tags\"><\/g>\n      <\/svg>\n    <\/section>\n\n    <!-- 比較 -->\n    <section class=\"view panel\" id=\"compare\"><div class=\"panel-inner\">\n      <table>\n        <thead><tr><th><\/th><th class=\"nm\">寧蒙河段<\/th><th class=\"sd\">山東河段<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><th>位置<\/th><td>寧夏、內蒙古<\/td><td>河南東部到山東入海口<\/td><\/tr>\n          <tr><th>流向<\/th><td>由南往北<\/td><td>由西南往東北<\/td><\/tr>\n          <tr><th>緯度<\/th><td>約 37°N → 40°N 以上<\/td><td>約 35°N → 37.7°N<\/td><\/tr>\n          <tr><th>冬季氣候<\/th><td>緯度高、深居內陸，冬季嚴寒，封凍期長<\/td><td>緯度較低，冬季氣溫常在 0°C 上下，封河、開河可能反覆<\/td><\/tr>\n          <tr><th>河道特色<\/th><td>河道寬淺彎曲、坡度平緩，冰塊容易卡住<\/td><td>地上河（懸河），河道上寬下窄，冰塊容易在窄處卡住<\/td><\/tr>\n          <tr><th>凌汛特點<\/th><td>發生頻繁、規模較大，開河期常形成冰壩<\/td><td>不一定每年都嚴重，但兩岸人口密集，一旦潰堤損失很大<\/td><\/tr>\n          <tr class=\"common\"><th>共同點<\/th><td colspan=\"2\">都由低緯流向高緯 → 上下游結冰、解凍不同步<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div><\/section>\n\n    <!-- 災害 -->\n    <section class=\"view panel\" id=\"impact\"><div class=\"panel-inner impacts\">\n      <div><b>淹沒農田與村莊<\/b>冰壩把水位抬高，河水漫過堤防，甚至沖垮堤防（潰堤）。<\/div>\n      <div><b>冰塊撞擊<\/b>大塊冰凌順流衝撞，損壞堤防、橋墩、碼頭與水利設施。<\/div>\n      <div><b>取水、灌溉中斷<\/b>取水口與灌溉渠道被冰堵住，影響農業和民生用水。<\/div>\n      <div><b>交通受阻<\/b>河面封凍與流凌期間，渡口、航運無法正常運作。<\/div>\n      <div class=\"case\"><b>案例：2008 年春・內蒙古杭錦旗<\/b>黃河內蒙古河段在開河期發生凌汛，堤防決口，周邊村莊與農田被淹，大批居民緊急撤離。<\/div>\n    <\/div><\/section>\n\n    <!-- 重點整理 -->\n    <section class=\"view panel\" id=\"summary\"><div class=\"panel-inner summary\">\n      <div>\n        <h2>凌汛形成的條件<\/h2>\n        <ol>\n          <li><b>冬季有結冰期<\/b>：氣溫降到 0°C 以下，河面會結冰。<\/li>\n          <li><b>河流由低緯流向高緯<\/b>：上游、下游結冰和解凍的時間不同步。<\/li>\n          <li><b>河道彎曲、狹窄或坡度平緩<\/b>：冰塊容易卡住堆積。<\/li>\n        <\/ol>\n        <p class=\"ext\">延伸：俄羅斯西伯利亞的鄂畢河、葉尼塞河、勒拿河也是由南往北流，春季同樣常有凌汛。<\/p>\n      <\/div>\n      <div class=\"periods\">\n        <h2>兩個發生時期<\/h2>\n        <div class=\"w\"><b>初冬・封河期<\/b><br>下游先結冰 → 冰塞 → 上游水位升高<\/div>\n        <div class=\"s\"><b>初春・開河期<\/b><br>上游先解凍 → 冰壩 → 水位暴漲、可能潰堤<br><span style=\"color:var(--danger);font-weight:700\">通常比封河期更危險<\/span><\/div>\n      <\/div>\n    <\/div><\/section>\n  <\/main>\n\n  <p class=\"caption\" id=\"caption\"><\/p>\n\n  <nav>\n    <button id=\"prev\">上一步<\/button>\n    <button id=\"replay\">重播<\/button>\n    <div class=\"dots\" id=\"dots\"><\/div>\n    <span class=\"hint\">← → 或空白鍵切換<\/span>\n    <button id=\"next\" class=\"primary\">下一步<\/button>\n  <\/nav>\n<\/div>\n\n<script>\n(function(){\nconst NS='http://www.w3.org/2000/svg';\nconst X0=40, X1=960, CT=150, CB=270, LANES=5, LH=(CB-CT)/LANES;\nconst $=id=>document.getElementById(id);\nconst reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\nconst WARM_L='上游・南方・緯度低・較暖', COLD_R='下游・北方・緯度高・較冷';\n\nconst steps=[\n {view:'strip', title:'凌汛是什麼？', season:'',\n  cap:'冬春之際，河裡的冰塊（<b>冰凌<\/b>）堵住河道，把上游的水擋住，水位跟著升高，甚至溢出河岸，這就是<b>凌汛<\/b>。',\n  temps:null, setup:s=>{s.spawnRate=1.4; s.slope=0;}, tags:{drift:'漂流的冰塊（冰凌）'}},\n {view:'map', title:'黃河的兩個凌汛河段', season:'',\n  cap:'黃河凌汛最常發生在<b>寧蒙河段<\/b>與<b>山東河段<\/b>。看流向：兩段都是從<b>緯度較低<\/b>的地方，流向<b>緯度較高<\/b>的地方。'},\n {view:'strip', title:'關鍵：從低緯流向高緯', season:'',\n  cap:'上游在南、較暖；下游在北、較冷。所以上游和下游<b>結冰、解凍的時間不一樣<\/b>，凌汛就是從這個時間差開始的。',\n  temps:'wc', setup:s=>{}, tags:{}},\n {view:'strip', title:'初冬：下游先結冰', season:'winter',\n  cap:'天氣轉冷，北邊的下游先降到 0°C 以下，河面結成一整片<b>冰蓋<\/b>；南邊的上游還沒結冰，河水照樣往下流。',\n  temps:'wc', setup:s=>{s.cover={a:X1,b:X1}; s.grow={to:640,speed:110};}, tags:{cover:'冰蓋（已封凍）'}},\n {view:'strip', title:'初冬：冰塞抬高水位', season:'winter',\n  cap:'上游漂下來的冰塊和冰花，被下游的冰蓋擋住，愈堆愈多、塞住河道，形成<b>冰塞<\/b>。水流不過去，上游水位就升高。',\n  temps:'wc', setup:s=>{s.cover={a:640,b:X1}; s.spawnRate=3.2; seed(s,14); s.maxPile=150; s.slope=0.5/150;},\n  tags:{cover:'冰蓋', pile:'冰塞', drift:'上游漂來的冰'}},\n {view:'strip', title:'初春：上游先解凍', season:'spring',\n  cap:'春天回暖，南邊的上游先融化，冰蓋裂成冰塊順流而下（<b>流凌<\/b>）；北邊的下游卻還凍著。',\n  temps:'wc', setup:s=>{s.cover={a:X0,b:X1}; s.thaw={dir:'ltr',pos:X0,to:560,speed:230,acc:0}; s.spawnRate=1.2; s.maxPile=110; s.slope=0.8/300;},\n  tags:{cover:'下游仍封凍', drift:'流凌'}},\n {view:'strip', title:'初春：冰壩潰堤', season:'spring',\n  cap:'大量冰塊撞上下游冰蓋，層層堆疊成<b>冰壩<\/b>，再加上融冰增加的水量，水位暴漲、漫過堤防，甚至<b>潰堤<\/b>。開河期的凌汛通常比封河期更危險。',\n  temps:'wc', setup:s=>{s.cover={a:560,b:X1}; prefill(s,90); seed(s,18); s.spawnRate=5; s.maxPile=330; s.slope=0.8/300; s.breakLabel=true;},\n  tags:{cover:'下游仍封凍', pile:'冰壩', drift:'流凌'}},\n {view:'map2', mode:'winter', title:'回到黃河：初冬封河期', season:'winter',\n  cap:'寧蒙河段和山東河段都是北端（下游）先結冰。上游漂來的冰塊卡在冰蓋前面，形成<b>冰塞<\/b>，水位開始升高。'},\n {view:'map2', mode:'spring', title:'回到黃河：初春開河期', season:'spring',\n  cap:'上游先解凍，大量流凌衝向還凍著的下游，在寧蒙河段<b>北緯 40° 附近<\/b>卡住、堆成<b>冰壩<\/b>。寧蒙河段緯度高、封凍久，最常在這時發生嚴重凌汛，甚至<b>潰堤<\/b>。'},\n {view:'strip', title:'如果河流反過來流呢？', season:'spring',\n  cap:'假設河流由北往南流：下游在南，會<b>先解凍<\/b>；上游的冰塊漂下來時，前方已經暢通，可以順利流走，就不容易發生凌汛。',\n  temps:'cw', setup:s=>{s.cover={a:X0,b:X1}; s.thaw={dir:'rtl',pos:X1,to:430,speed:200,acc:0}; s.spawnRate=0; s.slope=0;},\n  tags:{cover:'上游仍封凍', drift:'冰塊順利流走'}},\n {view:'compare', title:'寧蒙河段 vs. 山東河段', season:'',\n  cap:'兩段都是「低緯流向高緯」。寧蒙河段更冷、封凍更久，凌汛較頻繁；山東河段是地上河，一旦潰堤影響很大。'},\n {view:'impact', title:'凌汛帶來的災害', season:'',\n  cap:'凌汛的威脅不只是水淹，冰塊本身的撞擊力也很可怕。'},\n {view:'summary', title:'重點整理', season:'',\n  cap:'記住一句話：<b>低緯流向高緯<\/b>的河流，冬天下游先凍、春天上游先融，冰塊就會卡在中間。'}\n];\n\nlet sim, idx=0, last=0, t=0;\nconst floesG=$('floes'), tagsG=$('tags');\n\nfunction newSim(){return {floes:[], cover:null, grow:null, thaw:null, lane:Array(LANES).fill(0),\n  spawnRate:0, acc:0, maxPile:0, slope:0, level:0.25, shown:0.25, breakLabel:false};}\n\nfunction makeFloe(s,x,lane,opts={}){\n  const r=9+Math.random()*8, n=6+(Math.random()*2|0), pts=[];\n  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.random()*0.5, rr=r*(0.72+Math.random()*0.38);pts.push((Math.cos(a)*rr).toFixed(1)+','+(Math.sin(a)*rr).toFixed(1));}\n  const el=document.createElementNS(NS,'polygon'); el.setAttribute('points',pts.join(' ')); el.setAttribute('class','floe');\n  floesG.appendChild(el);\n  const f={x,lane,y:CT+LH*(lane+0.5)+(Math.random()-0.5)*8,r,rot:Math.random()*360,vr:(Math.random()-0.5)*30,vx:95+Math.random()*30,stopped:false,el};\n  s.floes.push(f); if(opts.stop) stopFloe(s,f); return f;\n}\nfunction stopFloe(s,f){\n  const stopAt=s.cover.a-s.lane[f.lane];\n  f.x=stopAt-f.r; f.stopped=true; f.y+= (Math.random()-0.5)*6;\n  s.lane[f.lane]+=f.r*2*0.7; f.el.classList.add('piled');\n}\nfunction prefill(s,depth){\n  for(let l=0;l<LANES;l++) while(s.lane[l]<depth+(Math.random()*20-10)) makeFloe(s,0,l,{stop:true});\n}\nfunction seed(s,n){for(let k=0;k<n;k++) makeFloe(s,X0+Math.random()*(s.cover.a-X0-120),Math.random()*LANES|0);}\nfunction avgPile(s){return s.lane.reduce((a,b)=>a+b,0)/LANES;}\n\nfunction update(s,dt){\n  if(s.grow){s.cover.a=Math.max(s.grow.to,s.cover.a-s.grow.speed*dt); if(s.cover.a===s.grow.to) s.grow=null;}\n  if(s.thaw){\n    const th=s.thaw, d=th.speed*dt;\n    if(th.dir==='ltr'){const np=Math.min(th.to,th.pos+d); th.acc+=np-th.pos; th.pos=np; s.cover.a=np;\n      while(th.acc>16){th.acc-=16; makeFloe(s,th.pos-32-Math.random()*40,Math.random()*LANES|0);} if(np>=th.to) s.thaw=null;}\n    else{const np=Math.max(th.to,th.pos-d); th.acc+=th.pos-np; th.pos=np; s.cover.b=np;\n      while(th.acc>16){th.acc-=16; makeFloe(s,th.pos+20+Math.random()*30,Math.random()*LANES|0);}\n      if(np<=th.to){s.thaw=null; s.spawnRate=0.9; s.spawnX=th.pos+20;}}\n  }\n  if(s.spawnRate>0 && (s.maxPile===0 || avgPile(s)<s.maxPile)){\n    s.acc+=s.spawnRate*dt;\n    while(s.acc>=1){s.acc-=1; makeFloe(s,s.spawnX!=null?s.spawnX:X0-20,Math.random()*LANES|0);}\n  }\n  for(let i=s.floes.length-1;i>=0;i--){\n    const f=s.floes[i]; if(f.stopped) continue;\n    f.x+=f.vx*dt; f.rot+=f.vr*dt;\n    if(s.cover && f.x < s.cover.a && s.cover.b>s.cover.a){\n      const stopAt=s.cover.a-s.lane[f.lane];\n      if(f.x+f.r>=stopAt) stopFloe(s,f);\n    }\n    if(f.x-f.r>X1+10){f.el.remove(); s.floes.splice(i,1);}\n  }\n  s.level=Math.min(1,0.25+avgPile(s)*s.slope);\n  s.shown+=(s.level-s.shown)*Math.min(1,dt*1.8);\n}\n\n\n/* ---------- 黃河地圖凌汛 ---------- */\nconst RV={\n  nm:{pts:[[152,236],[208,180],[252,140],[272,112],[280,68],[296,48],[350,50],[400,56],[448,68]],seg:1},\n  sd:{pts:[[544,282],[572,284],[604,268],[680,212],[720,184],[768,168]],seg:2}\n};\nfor(const r of Object.values(RV)){r.cum=[0]; for(let i=1;i<r.pts.length;i++){const[a,b]=[r.pts[i-1],r.pts[i]]; r.cum.push(r.cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]));} r.L=r.cum[r.cum.length-1]; r.segS=r.cum[r.seg];}\nfunction ptAt(r,s){\n  s=Math.max(0,Math.min(r.L,s)); let i=1; while(i<r.cum.length-1&&r.cum[i]<s) i++;\n  const a=r.pts[i-1], b=r.pts[i], len=r.cum[i]-r.cum[i-1], t=(s-r.cum[i-1])/len, dx=(b[0]-a[0])/len, dy=(b[1]-a[1])/len;\n  return {x:a[0]+(b[0]-a[0])*t, y:a[1]+(b[1]-a[1])*t, nx:-dy, ny:dx};\n}\n/* 寧蒙河段跨過北緯40度的位置（地圖上 y=80） */\nconst NM40=(()=>{const r=RV.nm; for(let i=1;i<r.pts.length;i++){const a=r.pts[i-1],b=r.pts[i]; if(a[1]>=80&&b[1]<80) return r.cum[i-1]+(r.cum[i]-r.cum[i-1])*(a[1]-80)/(a[1]-b[1]);} return 200;})();\nconst m2floesG=$('m2floes'), m2tagsG=$('m2tags'), m2floodG=$('m2flood');\nlet m2=null;\nfunction m2river(key,cfg){\n  const r=RV[key], st={key,r,floes:[],lane:[0,0,0],acc:0,shown:0,...cfg};\n  st.circles=[]; for(let k=0;k<6;k++){const c=document.createElementNS(NS,'circle'); c.setAttribute('r',0); m2floodG.appendChild(c); st.circles.push(c);}\n  return st;\n}\nfunction m2setup(mode){\n  m2floesG.innerHTML=''; m2floodG.innerHTML='';\n  const nm=RV.nm, sd=RV.sd;\n  if(mode==='winter') m2={mode, rivers:[\n    m2river('nm',{cover:{a:nm.L,b:nm.L},grow:{to:NM40,speed:70},rate:2.4,pmax:26,rad:18,pile:'冰塞'}),\n    m2river('sd',{cover:{a:sd.L,b:sd.L},grow:{to:170,speed:35},rate:1.4,pmax:24,rad:12,pile:'冰塞'})]};\n  else m2={mode, rivers:[\n    m2river('nm',{cover:{a:nm.segS,b:nm.L},thaw:{to:NM40,speed:35,acc:0},rate:0,pmax:24,rad:24,pile:'冰壩',brk:true}),\n    m2river('sd',{cover:{a:sd.segS,b:sd.L},thaw:{to:195,speed:32,acc:0},rate:0,pmax:30,rad:13,pile:'冰壩'})]};\n  for(const R of m2.rivers) if(mode==='winter') for(let k=0;k<5;k++) m2floe(R,Math.random()*40);\n}\nfunction m2floe(R,s){\n  const r=3.2+Math.random()*2.2, n=6, pts=[];\n  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.random()*0.5, rr=r*(0.7+Math.random()*0.4); pts.push((Math.cos(a)*rr).toFixed(1)+','+(Math.sin(a)*rr).toFixed(1));}\n  const el=document.createElementNS(NS,'polygon'); el.setAttribute('points',pts.join(' ')); el.setAttribute('class','m2floe'); m2floesG.appendChild(el);\n  R.floes.push({s,lane:Math.random()*3|0,r,rot:Math.random()*360,v:26+Math.random()*10,stopped:false,el});\n}\nconst m2avg=R=>(R.lane[0]+R.lane[1]+R.lane[2])/3;\nfunction m2update(dt){\n  for(const R of m2.rivers){\n    if(R.grow){R.cover.a=Math.max(R.grow.to,R.cover.a-R.grow.speed*dt); if(R.cover.a<=R.grow.to) R.grow=null;}\n    if(R.thaw){const np=Math.min(R.thaw.to,R.cover.a+R.thaw.speed*dt); R.thaw.acc+=np-R.cover.a; R.cover.a=np;\n      while(R.thaw.acc>11){R.thaw.acc-=7; m2floe(R,np-14-Math.random()*16);}\n      if(np>=R.thaw.to){R.thaw=null; R.rate=R.brk?2.6:1.2;}}\n    if(!R.grow && R.rate>0 && m2avg(R)<R.pmax){R.acc+=R.rate*dt; while(R.acc>=1){R.acc-=1; m2floe(R,0);}}\n    for(const f of R.floes){ if(f.stopped) continue;\n      f.s+=f.v*dt; f.rot+=40*dt;\n      if(!R.grow && f.s<R.cover.a){const stop=R.cover.a-R.lane[f.lane]; if(f.s+f.r>=stop){f.s=stop-f.r; f.stopped=true; R.lane[f.lane]+=f.r*1.0; f.el.classList.add('piled');}}\n    }\n    const lvl=Math.min(1,m2avg(R)/R.pmax); R.shown+=(lvl-R.shown)*Math.min(1,dt*1.5);\n  }\n}\nfunction m2tag(x,y,txt,cls){const e=document.createElementNS(NS,'text'); e.setAttribute('x',x); e.setAttribute('y',y); e.setAttribute('text-anchor','middle'); if(cls) e.setAttribute('class',cls); e.textContent=txt; m2tagsG.appendChild(e);}\nfunction m2render(){\n  m2tagsG.innerHTML='';\n  for(const R of m2.rivers){\n    const r=R.r, a=R.cover.a, b=R.cover.b, da=`0 ${a.toFixed(1)} ${Math.max(0,b-a).toFixed(1)} ${r.L*2}`;\n    $('m2i_'+R.key).setAttribute('stroke-dasharray',da); $('m2e_'+R.key).setAttribute('stroke-dasharray',da);\n    for(const f of R.floes){const p=ptAt(r,f.s), off=(f.lane-1)*3.2; f.el.setAttribute('transform',`translate(${(p.x+p.nx*off).toFixed(1)} ${(p.y+p.ny*off).toFixed(1)}) rotate(${f.rot.toFixed(0)})`);}\n    const fl=Math.max(0,(R.shown-0.45)/0.55), jam=a-m2avg(R);\n    R.circles.forEach((c,k)=>{const p=ptAt(r,jam-k*5); c.setAttribute('cx',p.x.toFixed(1)); c.setAttribute('cy',p.y.toFixed(1)); c.setAttribute('r',(R.rad*fl*(1-k*0.12)).toFixed(1));});\n    if(b-a>30){const p=ptAt(r,(a+b)/2); if(R.key==='nm') m2tag(p.x,m2.mode==='spring'?p.y+30:p.y-20,'冰蓋'); else m2tag(p.x+18,p.y+32,'冰蓋');}\n    if(m2avg(R)>4){const p=ptAt(r,jam); const danger=fl>0.5?'danger':'';\n      if(R.key==='nm') m2tag(p.x-(R.rad*fl+44),p.y-4,R.pile,danger); else m2tag(p.x-6,p.y+34+R.rad*fl*0.6,R.pile,danger);}\n    if(R.brk && fl>0.65){const p=ptAt(r,jam); m2tag(p.x+R.rad*fl+34,p.y+2,'潰堤！','danger');}\n  }\n}\n\nfunction tag(x,y,text,cls){\n  const g=document.createElementNS(NS,'g'); g.setAttribute('class','tag'+(cls?' '+cls:''));\n  g.innerHTML=`<text x=\"${x}\" y=\"${y}\" text-anchor=\"middle\">${text}<\/text>`; tagsG.appendChild(g);\n}\nfunction render(s){\n  const cv=s.cover, cover=$('cover'), tex=$('coverTex');\n  if(cv && cv.b>cv.a){for(const el of [cover,tex]){el.setAttribute('x',cv.a); el.setAttribute('width',cv.b-cv.a);}}\n  else for(const el of [cover,tex]) el.setAttribute('width',0);\n  for(const f of s.floes) f.el.setAttribute('transform',`translate(${f.x.toFixed(1)} ${f.y.toFixed(1)}) rotate(${f.rot.toFixed(0)})`);\n  // flood\n  const fl=Math.max(0,(s.shown-0.7)/0.3), front=cv?cv.a-avgPile(s):X1;\n  if(fl>0.01 && front>X0){\n    let top=`M${X0} ${CT}`, bot=`M${X0} ${CB}`;\n    for(let x=X0;x<=front;x+=20){const w=0.82+0.18*Math.sin(x*0.045+t*2); top+=` L${x} ${CT-fl*86*w}`; bot+=` L${x} ${CB+fl*88*w}`;}\n    top+=` L${front} ${CT} Z`; bot+=` L${front} ${CB} Z`;\n    $('floodT').setAttribute('d',top); $('floodB').setAttribute('d',bot);\n  } else {$('floodT').setAttribute('d',''); $('floodB').setAttribute('d','');}\n  // tags\n  tagsG.innerHTML=''; const tg=steps[idx].tags||{}, ap=avgPile(s);\n  if(tg.cover && cv && cv.b-cv.a>80) tag((cv.a+cv.b)/2,217,tg.cover);\n  if(tg.pile && ap>18) tag(cv.a-ap/2,fl>0.3?340:128,tg.pile,fl>0.3?'danger':'');\n  if(tg.drift && !(s.breakLabel&&fl>0.55)){const moving=s.floes.filter(f=>!f.stopped); if(moving.length){\n    const x=steps[idx].temps==='cw'?Math.min(880,Math.max(640,(s.cover?s.cover.b:500)+160)):(ap>0?Math.max(180,(cv.a-ap)/2):260);\n    tag(x,cv&&steps[idx].temps!=='cw'?128:128,tg.drift);}}\n  if(s.breakLabel && fl>0.55) tag(Math.max(140,front-80),108,'潰堤！','danger');\n  // gauge\n  const g=$('gFill'), mobile=window.matchMedia('(max-width:700px)').matches;\n  if(mobile){g.style.width=(s.shown*100)+'%'; g.style.height='';} else {g.style.height=(s.shown*100)+'%'; g.style.width='';}\n  const st=$('gState'); const txt=s.shown>0.72?'超過警戒':s.shown>0.4?'升高中':'正常';\n  if(st.textContent!==txt){st.textContent=txt; st.classList.toggle('hi',s.shown>0.72);}\n}\n\nfunction setTemps(mode){\n  const band=$('tband');\n  if(!mode){band.style.display='none'; $('aL').textContent='上游'; $('aR').textContent='下游'; return;}\n  band.style.display='';\n  if(mode==='wc'){$('tbar').setAttribute('fill','url(#gWC)'); $('tL').textContent=WARM_L; $('tR').textContent=COLD_R;\n    $('aL').textContent='上游（南）'; $('aR').textContent='下游（北）';}\n  else{$('tbar').setAttribute('fill','url(#gCW)'); $('tL').textContent='上游・北方・較冷'; $('tR').textContent='下游・南方・較暖';\n    $('aL').textContent='上游（北）'; $('aR').textContent='下游（南）';}\n}\n\nfunction go(i){\n  idx=Math.max(0,Math.min(steps.length-1,i)); const st=steps[idx];\n  $('title').textContent=st.title; $('caption').innerHTML=st.cap;\n  const se=$('season'); se.className='season '+st.season; se.textContent=st.season==='winter'?'初冬・封河期':st.season==='spring'?'初春・開河期':'';\n  $('counter').textContent=(idx+1)+' / '+steps.length;\n  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===st.view));\n  document.querySelectorAll('#dots button').forEach((b,k)=>{b.classList.toggle('on',k===idx); b.setAttribute('aria-current',k===idx?'step':'false');});\n  $('prev').disabled=idx===0; $('next').disabled=idx===steps.length-1;\n  if(st.view==='map2'){m2setup(st.mode); m2render();}\n  if(st.view==='strip'){\n    floesG.innerHTML=''; sim=newSim(); setTemps(st.temps); st.setup(sim);\n    if(reduce) for(let k=0;k<500;k++){t+=0.04; update(sim,0.04);} \n    render(sim);\n  }\n}\n\nconst dots=$('dots');\nsteps.forEach((s,k)=>{const b=document.createElement('button'); b.setAttribute('aria-label','第'+(k+1)+'步：'+s.title); b.onclick=()=>go(k); dots.appendChild(b);});\n$('prev').onclick=()=>go(idx-1); $('next').onclick=()=>go(idx+1); $('replay').onclick=()=>go(idx);\n$('stage').addEventListener('click',()=>{ if(idx<steps.length-1) go(idx+1); });\ndocument.addEventListener('keydown',e=>{\n  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key) && !(e.key==='Enter'&&e.target.tagName==='BUTTON') && !(e.key===' '&&e.target.tagName==='BUTTON')){e.preventDefault(); go(idx+1);}\n  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault(); go(idx-1);}\n  else if(e.key==='r'||e.key==='R') go(idx);\n  else if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(_){}}\n});\n\nfunction loop(ts){\n  const dt=Math.min(0.05,(ts-(last||ts))/1 low);outline-offset:3px}\n.tile-body{display:flex;flex-direction:column;flex:1;min-width:0}\n.tile-name{font-size:1.25rem;font-weight:700;line-height:1.3}\n.tile-desc{font-size:.95rem;color:var(--muted)}\nkbd{font-family:inherit;font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 7px}\n.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}\n.row label{display:inline-flex;align-items:center;gap:8px;font-size:1rem;cursor:pointer}\n.row input{width:20px;height:20px;accent-color:var(--flow)}\nbutton{font:inherit;font-size:1rem;color:var(--ink);background:transparent;border:1px solid var(--line);\n  border-radius:6px;padding:6px 16px;cursor:pointer}\nbutton:hover{border-color:var(--ink)}\nbutton:focus-visible{outline:3px solid var(--flow);outline-offset:2px}\ntable{width:100%;border-collapse:collapse;font-size:1rem;font-variant-numeric:tabular-nums}\nth,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}\nth:first-child,td:first-child{text-align:left}\nthead th{font-weight:500;color:var(--muted);font-size:.9rem}\ntd.now{font-weight:700}\ntd.chg{color:var(--muted)}\ntd.chg.up{color:var(--peak);font-weight:700}\ntd.chg.down{color:var(--flow);font-weight:700}\n.explain ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}\n.explain li{border-left:5px solid var(--c);padding:2px 0 2px 12px}\n.explain b{display:block;font-size:1.05rem}\n.explain p{margin:0;font-size:.98rem}\n.explain .res{color:var(--ink);font-weight:500}\n.explain .why{color:var(--muted)}\n.empty{color:var(--muted);margin:0}\n.hint{font-size:.85rem;color:var(--muted);margin:0}\nsvg text{font-family:inherit}\n.tick{fill:var(--muted);font-size:17px}\n.axlabel{fill:var(--ink);font-size:18px;font-weight:500}\n.gridl{stroke:var(--grid);stroke-width:1}\n.axis{stroke:var(--axis);stroke-width:1.5}\n.rainbar{fill:var(--rain);stroke:var(--rainstroke);stroke-width:1}\n.qline{fill:none;stroke:var(--flow);stroke-width:4;stroke-linejoin:round}\n.qfill{fill:var(--flowfill)}\n.bfill{fill:var(--basefill)}\n.oline{fill:none;stroke:var(--orig);stroke-width:3;stroke-dasharray:10 7}\n.bline{fill:none;stroke:var(--flow);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round}\n.guide{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5}\n.lag{stroke:var(--peak);stroke-width:2.5}\n.peakdot{fill:var(--peak);stroke:var(--paper);stroke-width:3}\n.anno{fill:var(--ink);font-size:19px;font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}\n.anno.pk,.anno.lg{fill:var(--peak)}\n@media (max-width:960px){\n  .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:\"head\" \"chart\" \"side\";padding:14px}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <h1>水文歷線：土地利用如何改變河川流量<\/h1>\n    <p class=\"sub\">同一場降雨，比較不同地表條件下的流量。虛線是原始情況，實線是勾選後的情境。<\/p>\n  <\/header>\n\n  <section class=\"panel chart\" aria-label=\"水文歷線圖\">\n    <svg id=\"svg\" viewBox=\"0 0 1000 600\" role=\"img\" aria-label=\"水文歷線圖\"><\/svg>\n    <div class=\"legend\">\n      <span><i class=\"sw bar\"><\/i>降雨量<\/span>\n      <span><i class=\"sw dash\"><\/i>原始情況<\/span>\n      <span><i class=\"sw\"><\/i>目前情境<\/span>\n      <span><i class=\"sw base\"><\/i>基流<\/span>\n    <\/div>\n  <\/section>\n\n  <aside class=\"side\">\n    <div class=\"panel\">\n      <h2>勾選情境（可複選）<\/h2>\n      <div class=\"tiles\">\n        <label class=\"tile\" style=\"--c:var(--urban)\"><input type=\"checkbox\" data-s=\"urban\">\n          <span class=\"tile-body\"><span class=\"tile-name\">都市化<\/span><span class=\"tile-desc\">不透水面增加、下水道排水<\/span><\/span><kbd>1<\/kbd><\/label>\n        <label class=\"tile\" style=\"--c:var(--forest)\"><input type=\"checkbox\" data-s=\"forest\">\n          <span class=\"tile-body\"><span class=\"tile-name\">森林砍伐<\/span><span class=\"tile-desc\">植被截留與土壤入滲減少<\/span><\/span><kbd>2<\/kbd><\/label>\n        <label class=\"tile\" style=\"--c:var(--pond)\"><input type=\"checkbox\" data-s=\"pond\">\n          <span class=\"tile-body\"><span class=\"tile-name\">設置滯洪池<\/span><span class=\"tile-desc\">暫存洪水、再緩慢排放<\/span><\/span><kbd>3<\/kbd><\/label>\n      <\/div>\n      <div class=\"row\">\n        <label><input type=\"checkbox\" id=\"labels\" checked>顯示圖說<\/label>\n        <button id=\"reset\" type=\"button\">全部取消<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\">\n      <h2>數值比較<\/h2>\n      <table>\n        <thead><tr><th>項目<\/th><th>原始<\/th><th>目前<\/th><th>變化<\/th><\/tr><\/thead>\n        <tbody id=\"metrics\"><\/tbody>\n      <\/table>\n    <\/div>\n\n    <div class=\"panel explain\">\n      <h2>為什麼會這樣？<\/h2>\n      <div id=\"explain\"><\/div>\n    <\/div>\n    <p class=\"hint\">快捷鍵：1、2、3 切換情境，L 切換圖說，R 全部取消<\/p>\n  <\/aside>\n<\/div>\n\n<script>\n(function(){\n  // ---------- 模型 ----------\n  const DT=0.25, T=48, N=Math.round(T/DT)+1;\n  const tt=Array.from({length:N},(_,i)=>i*DT);\n  const RAIN=[0,0,0,6,14,28,20,9,3];          // 每小時降雨 mm/h\n  const RAIN_PEAK_T=5.5, RAIN_PEAK=28;\n  const rain=tt.map(x=>RAIN[Math.floor(x)]||0);\n\n  function conv(x,k){const y=new Array(x.length).fill(0);\n    for(let i=0;i<x.length;i++){if(!x[i])continue;for(let j=0;j<k.length&&i+j<x.length;j++)y[i+j]+=x[i]*k[j];}return y;}\n  function norm(k){const s=k.reduce((a,b)=>a+b,0);return k.map(v=>v/s);}\n  function gammaUH(tp){const th=tp/2;const k=[];for(let i=0;i*DT<T;i++){const s=i*DT;k.push(s*s*Math.exp(-s/th));}return norm(k);}\n  function expK(tau){const k=[];for(let i=0;i*DT<T;i++)k.push(Math.exp(-i*DT/tau));return norm(k);}\n\n  function raw(s){\n    let C=0.35,tp=6,bf=1;\n    if(s.urban){C+=0.22;tp*=0.6;bf*=0.65;}\n    if(s.forest){C+=0.13;tp*=0.8;bf*=0.85;}\n    C=Math.min(C,0.9);\n    let quick=conv(rain.map(r=>r*C),gammaUH(tp));\n    if(s.pond)quick=conv(quick,expK(5));\n    const slow=conv(rain.map(r=>r*(1-C)*0.4*bf),expK(16));\n    return {quick,slow,bf};\n  }\n  const r0=raw({});\n  const SCALE=140/Math.max(...r0.quick.map((q,i)=>q+r0.slow[i]));\n  const B0=22;\n  function build(s){\n    const r=raw(s);\n    const base=r.slow.map(v=>B0*r.bf+SCALE*v);\n    const Q=r.quick.map((q,i)=>base[i]+SCALE*q);\n    const vol=r.quick.reduce((a,b)=>a+b,0)*SCALE*DT*3600/1e4; // 萬 m³\n    return {Q,base,vol,b0:B0*r.bf};\n  }\n  function peakOf(Q){let i=0;for(let j=1;j<Q.length;j++)if(Q[j]>Q[i])i=j;return {i,t:tt[i],q:Q[i]};}\n\n  const ORIG=build({});\n  let maxQ=0;\n  for(let m=0;m<8;m++){const b=build({urban:!!(m&1),forest:!!(m&2),pond:!!(m&4)});maxQ=Math.max(maxQ,...b.Q);}\n  const YMAX=Math.ceil(maxQ/0.62/50)*50;\n\n  // ---------- 座標 ----------\n  const W=1000,H=600,M={l:82,r:82,t:52,b:70};\n  const PW=W-M.l-M.r, PH=H-M.t-M.b;\n  const xS=v=>M.l+v/T*PW;\n  const yS=v=>M.t+PH*(1-v/YMAX);\n  const RAIN_MAX=40, RAIN_H=PH*0.25;\n  const rS=v=>M.t+v/RAIN_MAX*RAIN_H;\n  const f=v=>v.toFixed(1);\n\n  const svg=document.getElementById('svg');\n  let st='<defs><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--peak)\"/><\/marker><\/defs>';\n  for(let v=0;v<=T;v+=6){const x=xS(v);\n    st+=`<line class=\"gridl\" x1=\"${f(x)}\" y1=\"${M.t}\" x2=\"${f(x)}\" y2=\"${M.t+PH}\"/>`;\n    st+=`<text class=\"tick\" x=\"${f(x)}\" y=\"${M.t+PH+26}\" text-anchor=\"middle\">${v}<\/text>`;}\n  for(let v=0;v<=YMAX;v+=50){const y=yS(v);\n    st+=`<line class=\"gridl\" x1=\"${M.l}\" y1=\"${f(y)}\" x2=\"${M.l+PW}\" y2=\"${f(y)}\"/>`;\n    st+=`<text class=\"tick\" x=\"${M.l-12}\" y=\"${f(y+6)}\" text-anchor=\"end\">${v}<\/text>`;}\n  RAIN.forEach((v,h)=>{if(!v)return;\n    st+=`<rect class=\"rainbar\" x=\"${f(xS(h))}\" y=\"${M.t}\" width=\"${f(xS(h+1)-xS(h))}\" height=\"${f(rS(v)-M.t)}\"/>`;});\n  for(let v=0;v<=RAIN_MAX;v+=20){const y=rS(v);\n    st+=`<line class=\"axis\" x1=\"${M.l+PW}\" y1=\"${f(y)}\" x2=\"${M.l+PW+7}\" y2=\"${f(y)}\"/>`;\n    st+=`<text class=\"tick\" x=\"${M.l+PW+12}\" y=\"${f(y+6)}\">${v}<\/text>`;}\n  st+=`<line class=\"axis\" x1=\"${M.l}\" y1=\"${M.t}\" x2=\"${M.l}\" y2=\"${M.t+PH}\"/>`;\n  st+=`<line class=\"axis\" x1=\"${M.l}\" y1=\"${M.t+PH}\" x2=\"${M.l+PW}\" y2=\"${M.t+PH}\"/>`;\n  st+=`<line class=\"axis\" x1=\"${M.l+PW}\" y1=\"${M.t}\" x2=\"${M.l+PW}\" y2=\"${f(rS(RAIN_MAX))}\"/>`;\n  st+=`<text class=\"axlabel\" x=\"${M.l+PW/2}\" y=\"${H-12}\" text-anchor=\"middle\">時間（小時）<\/text>`;\n  st+=`<text class=\"axlabel\" x=\"12\" y=\"24\">流量（m³/s）<\/text>`;\n  st+=`<text class=\"axlabel\" x=\"${W-12}\" y=\"24\" text-anchor=\"end\">降雨量（mm/h）<\/text>`;\n  svg.innerHTML=st+'<g id=\"dyn\"><\/g>';\n  const dyn=document.getElementById('dyn');\n\n  const line=a=>a.map((v,i)=>(i?'L':'M')+f(xS(tt[i]))+' '+f(yS(v))).join('');\n  function band(up,lo){let p=line(up);for(let i=lo.length-1;i>=0;i--)p+='L'+f(xS(tt[i]))+' '+f(yS(lo[i]));return p+'Z';}\n\n  // ---------- 狀態 ----------\n  const boxes=[...document.querySelectorAll('input[data-s]')];\n  const lbl=document.getElementById('labels');\n  const state=()=>{const s={};boxes.forEach(b=>s[b.dataset.s]=b.checked);return s;};\n  const any=()=>boxes.some(b=>b.checked);\n\n  function draw(c){\n    let s='';\n    const zero=c.base.map(()=>0);\n    s+=`<path class=\"bfill\" d=\"${band(c.base,zero)}\"/>`;\n    s+=`<path class=\"qfill\" d=\"${band(c.Q,c.base)}\"/>`;\n    if(any())s+=`<path class=\"oline\" d=\"${line(ORIG.Q)}\"/>`;\n    if(lbl.checked)s+=`<path class=\"bline\" d=\"${line(c.base)}\"/>`;\n    s+=`<path class=\"qline\" d=\"${line(c.Q)}\"/>`;\n    if(lbl.checked)s+=annos(c);\n    dyn.innerHTML=s;\n  }\n  function annos(c){\n    const Q=c.Q,B=c.base,p=peakOf(Q),px=xS(p.t),py=yS(p.q);\n    let s='';\n    const ay=M.t+RAIN_H+PH*0.07, rx=xS(RAIN_PEAK_T);\n    s+=`<line class=\"guide\" x1=\"${f(rx)}\" y1=\"${f(rS(RAIN_PEAK))}\" x2=\"${f(rx)}\" y2=\"${f(ay)}\"/>`;\n    s+=`<line class=\"guide\" x1=\"${f(px)}\" y1=\"${f(ay)}\" x2=\"${f(px)}\" y2=\"${f(py)}\"/>`;\n    s+=`<line class=\"lag\" x1=\"${f(rx)}\" y1=\"${f(ay)}\" x2=\"${f(px)}\" y2=\"${f(ay)}\" marker-start=\"url(#arr)\" marker-end=\"url(#arr)\"/>`;\n    s+=`<text class=\"anno lg\" x=\"${f(px+10)}\" y=\"${f(ay-10)}\">滯後時間 ${(p.t-RAIN_PEAK_T).toFixed(1)} 小時<\/text>`;\n    s+=`<circle class=\"peakdot\" cx=\"${f(px)}\" cy=\"${f(py)}\" r=\"8\"/>`;\n    s+=`<text class=\"anno pk\" x=\"${f(px+16)}\" y=\"${f(py+22)}\">洪峰 ${Math.round(p.q)} m³/s<\/text>`;\n    let ri=0;for(let i=0;i<p.i;i++){if(Q[i]>=B[i]+0.5*(p.q-B[i])){ri=i;break;}}\n    s+=`<text class=\"anno\" x=\"${f(xS(tt[ri])-14)}\" y=\"${f(yS(Q[ri])+6)}\" text-anchor=\"end\">漲水段<\/text>`;\n    let fi=Q.length-1;for(let i=p.i;i<Q.length;i++){if(Q[i]<=B[i]+0.3*(p.q-B[i])){fi=i;break;}}\n    s+=`<text class=\"anno\" x=\"${f(xS(tt[fi])+14)}\" y=\"${f(yS(Q[fi])-6)}\">退水段<\/text>`;\n    const bi=Math.round(42/DT);\n    s+=`<text class=\"anno\" x=\"${f(xS(42))}\" y=\"${f(yS(B[bi])-12)}\" text-anchor=\"middle\">基流<\/text>`;\n    return s;\n  }\n\n  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n  let cur=null,raf=0;\n  function render(target,animate){\n    cancelAnimationFrame(raf);\n    if(!cur||!animate||reduce){cur={Q:target.Q,base:target.base};draw(cur);return;}\n    const from=cur,t0=performance.now(),D=550;\n    const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);\n      cur={Q:from.Q.map((v,i)=>v+(target.Q[i]-v)*e),base:from.base.map((v,i)=>v+(target.base[i]-v)*e)};\n      draw(cur);if(k<1)raf=requestAnimationFrame(step);};\n    raf=requestAnimationFrame(step);\n  }\n\n  const INFO={\n    urban:{name:'都市化',why:'柏油、水泥讓雨水難以入滲，下水道又把雨水快速送進河道。',res:'洪峰變高、提早出現，滯後時間縮短；入滲減少使基流偏低。'},\n    forest:{name:'森林砍伐',why:'少了樹冠截留和根系，雨水直接打在地表，入滲減少。',res:'逕流量增加，洪峰升高、略為提前。'},\n    pond:{name:'設置滯洪池',why:'暴雨時先把水暫存在池中，雨停後再慢慢排回河道。',res:'洪峰降低、延後，退水段拉長；總水量大致不變，只是被攤平。'}\n  };\n  const COLOR={urban:'var(--urban)',forest:'var(--forest)',pond:'var(--pond)'};\n\n  function pct(a,b){const d=(b-a)/a*100;if(Math.abs(d)<0.5)return {t:'—',c:''};return {t:(d>0?'+':'−')+Math.abs(d).toFixed(0)+'%',c:d>0?'up':'down'};}\n  function diff(a,b,u){const d=b-a;if(Math.abs(d)<0.05)return {t:'—',c:''};return {t:(d>0?'+':'−')+Math.abs(d).toFixed(1)+u,c:d>0?'up':'down'};}\n\n  function update(animate){\n    const s=state(),b=build(s),po=peakOf(ORIG.Q),pn=peakOf(b.Q);\n    render(b,animate);\n    const rows=[\n      ['洪峰流量（m³/s）',Math.round(po.q),Math.round(pn.q),pct(po.q,pn.q)],\n      ['滯後時間（小時）',(po.t-RAIN_PEAK_T).toFixed(1),(pn.t-RAIN_PEAK_T).toFixed(1),diff(po.t,pn.t,'')],\n      ['直接逕流量（萬 m³）',Math.round(ORIG.vol),Math.round(b.vol),pct(ORIG.vol,b.vol)],\n      ['降雨前基流（m³/s）',Math.round(ORIG.b0),Math.round(b.b0),pct(ORIG.b0,b.b0)]\n    ];\n    document.getElementById('metrics').innerHTML=rows.map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}<\/td><td class=\"now\">${r[2]}<\/td><td class=\"chg ${r[3].c}\">${r[3].t}<\/td><\/tr>`).join('');\n    const on=Object.keys(INFO).filter(k=>s[k]);\n    document.getElementById('explain').innerHTML=on.length\n      ?'<ul>'+on.map(k=>`<li style=\"--c:${COLOR[k]}\"><b>${INFO[k].name}<\/b><p class=\"why\">${INFO[k].why}<\/p><p class=\"res\">${INFO[k].res}<\/p><\/li>`).join('')+'<\/ul>'\n      :'<p class=\"empty\">從上方勾選一個或多個情境，實線會跟著改變，虛線保留原始情況供對照。<\/p>';\n    svg.setAttribute('aria-label',`水文歷線圖。洪峰流量 ${Math.round(pn.q)} m³/s，滯後時間 ${(pn.t-RAIN_PEAK_T).toFixed(1)} 小時。`);\n  }\n\n  boxes.forEach(b=>b.addEventListener('change',()=>update(true)));\n  lbl.addEventListener('change',()=>draw(cur));\n  document.getElementById('reset').addEventListener('click',()=>{boxes.forEach(b=>b.checked=false);update(true);});\n  document.addEventListener('keydown',e=>{\n    if(e.ctrlKey||e.metaKey||e.altKey)return;\n    const k=e.key.toLowerCase();\n    if(['1','2','3'].includes(k)){boxes[+k-1].checked=!boxes[+k-1].checked;update(true);}\n    else if(k==='l'){lbl.checked=!lbl.checked;draw(cur);}\n    else if(k==='r'){boxes.forEach(b=>b.checked=false);update(true);}\n  });\n  update(false);\n})();\n<\/script>\n<\/body>\n<\/html>\n", "contour": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>等高線地形圖：從 3D 地形到平面地圖<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --paper:#ECEEE6; --panel:#FAF9F3; --ink:#232A22; --muted:#5E665C; --line:#C8CCBE;\n  --brown:#8B5A2B; --brown-2:#6E4521; --sea:#2C6E9B;\n  --peak:#C0392B; --saddle:#7B4FA0; --ridge:#D97706; --valley:#1F78B4; --cliff:#333;\n  --t-plain:#3F8F3A; --t-basin:#7B4FA0; --t-table:#C2410C; --t-hill:#0F7C74; --t-mount:#8B3A2B;\n  --ok:#2E7D32; --bad:#C0392B; --accent:#C0392B;\n  --g1:#D1495B; --g2:#E09F3E; --g3:#2A9D8F; --g4:#3D5A98; --g5:#7A9E4B;\n  --sans:\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  --serif:\"Noto Serif TC\",\"PMingLiU\",\"MingLiU\",serif;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){ --paper:#161A16; --panel:#20251F; --ink:#E6E9E1; --muted:#A3AB9F; --line:#3A4238; }\n}\n:root[data-theme=\"dark\"]{ --paper:#161A16; --panel:#20251F; --ink:#E6E9E1; --muted:#A3AB9F; --line:#3A4238; }\nhtml{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0; height:100%; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased}\nbutton{font:inherit; color:inherit; cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--valley); outline-offset:2px}\n\n.app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:1  a=-(e.rot||0)*Math.PI/180, dx=x-e.c[0], dy=y-e.c[1], u=dx*Math.cos(a)-dy*Math.sin(a), v=dx*Math.sin(a)+dy*Math.cos(a); return Math.hypot(u/e.rx,v/e.ry);}\nfunction ellPts(e,n){const a=(e.rot||0)*Math.PI/180, out=[]; for(let k=0;k<=n;k++){const t=k/n*Math.PI*2, u=Math.cos(t)*e.rx, v=Math.sin(t)*e.ry; out.push([e.c[0]+u*Math.cos(a)-v*Math.sin(a), e.c[1]+u*Math.sin(a)+v*Math.cos(a)]);} return out;}\n\nfunction sig(z){return 1/(1+Math.exp(-z));}\nfunction rawH(T,x,y){\n  if(T.fn) return T.fn(x,y);\n  let h=T.base;\n  for(const [a,cx,cy,sa,sb,ang] of T.g){\n    const c=Math.cos(ang*Math.PI/180), s=Math.sin(ang*Math.PI/180);\n    const u=(x-cx)*c+(y-cy)*s, v=-(x-cx)*s+(y-cy)*c;\n    h+=a*Math.exp(-(u*u/(2*sa*sa)+v*v/(2*sb*sb)));\n  }\n  for(const [x0,y0,x1,y1,k,w] of T.cliff){\n    const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;\n    const t=((x-x0)*ux+(y-y0)*uy)/L, d=(x-x0)*(-uy)+(y-y0)*ux;\n    const tap=sig((t-.05)/.04)*sig((.95-t)/.04);\n    if(h>0) h*=1-k*sig(d/w)*tap;\n  }\n  return h;\n}\nfunction prep(T){\n  const H=new Float32Array(N*N); let mx=-1e9, mn=1e9;\n  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const v=rawH(T,j/(N-1),i/(N-1)); H[i*N+j]=v; if(v>mx)mx=v;}\n  const k=T.max/mx;\n  for(let q=0;q<H.length;q++){ if(H[q]>0) H[q]*=k; if(H[q]<mn) mn=H[q]; }\n  T.H=H; T.hmin=mn; T.cache={};\n}\nObject.values(TER).forEach(prep);\n\nfunction hAt(T,x,y){\n  const fx=Math.max(0,Math.min(N-1.0001,x*(N-1))), fy=Math.max(0,Math.min(N-1.0001,y*(N-1)));\n  const j=fx|0, i=fy|0, a=fx-j, b=fy-i, H=T.H;\n  return (H[i*N+j]*(1-a)+H[i*N+j+1]*a)*(1-b)+(H[(i+1)*N+j]*(1-a)+H[(i+1)*N+j+1]*a)*b;\n}\nfunction grad(T,x,y){ // 每公尺升高幾公尺\n  const e=1.2/(N-1), m=T.size*1000;\n  return [(hAt(T,x+e,y)-hAt(T,x-e,y))/(2*e*m),(hAt(T,x,y+e)-hAt(T,x,y-e))/(2*e*m)];\n}\nfunction slopeDeg(T,x,y){const g=grad(T,x,y); return Math.atan(Math.hypot(g[0],g[1]))*180/Math.PI;}\n\n/* ---------- 等高線（marching squares） ---------- */\nfunction contourAt(T,L,chain){\n  const H=T.H, segs=[], pts={};\n  const ep=(key,x,y)=>{pts[key]=[x,y]; return key;};\n  const hE=(i,j)=>{const a=H[i*N+j], b=H[i*N+j+1]; const t=(L-a)/(b-a); return ep(i*N+j,(j+t)/(N-1),i/(N-1));};\n  const vE=(i,j)=>{const a=H[i*N+j], b=H[(i+1)*N+j]; const t=(L-a)/(b-a); return ep(N*N+i*N+j,j/(N-1),(i+t)/(N-1));};\n  for(let i=0;i<N-1;i++)for(let j=0;j<N-1;j++){\n    const tl=H[i*N+j], tr=H[i*N+j+1], br=H[(i+1)*N+j+1], bl=H[(i+1)*N+j];\n    const c=(tl>L?8:0)|(tr>L?4:0)|(br>L?2:0)|(bl>L?1:0);\n    if(c===0||c===15) continue;\n    const T_=()=>hE(i,j), R=()=>vE(i,j+1), B=()=>hE(i+1,j), Lf=()=>vE(i,j);\n    const ctr=(tl+tr+br+bl)/4>L;\n    switch(c){\n      case 1: case 14: segs.push([Lf(),B()]); break;\n      case 2: case 13: segs.push([B(),R()]); break;\n      case 3: case 12: segs.push([Lf(),R()]); break;\n      case 4: case 11: segs.push([T_(),R()]); break;\n      case 6: case 9: segs.push([T_(),B()]); break;\n      case 7: case 8: segs.push([Lf(),T_()]); break;\n      case 5: if(ctr){segs.push([Lf(),T_()]);segs.push([B(),R()]);}else{segs.push([T_(),R()]);segs.push([Lf(),B()]);} break;\n      case 10: if(ctr){segs.push([T_(),R()]);segs.push([Lf(),B()]);}else{segs.push([Lf(),T_()]);segs.push([B(),R()]);} break;\n    }\n  }\n  if(!chain) return segs.map(s=>[pts[s[0]],pts[s[1]]]);\n  const adj=new Map();\n  segs.forEach((s,k)=>{for(const e of s){if(!adj.has(e))adj.set(e,[]); adj.get(e).push(k);}});\n  const used=new Uint8Array(segs.length), lines=[];\n  const walk=(start,from)=>{const out=[]; let cur=start, e=from;\n    while(true){ used[cur]=1; const s=segs[cur]; const nx=s[0]===e?s[1]:s[0]; out.push(nx);\n      const nb=adj.get(nx).find(k=>!used[k]); if(nb===undefined) break; cur=nb; e=nx; }\n    return out;};\n  for(let k=0;k<segs.length;k++){ if(used[k]) continue;\n    const s=segs[k]; used[k]=1;\n    const fwd=[]; let nb=adj.get(s[1]).find(q=>!used[q]); if(nb!==undefined) fwd.push(...walk(nb,s[1]));\n    const back=[]; nb=adj.get(s[0]).find(q=>!used[q]); if(nb!==undefined) back.push(...walk(nb,s[0]));\n    const keys=[...back.reverse(),s[0],s[1],...fwd];\n    lines.push(keys.map(q=>pts[q]));\n  }\n  return lines;\n}\nfunction levelsOf(T,iv){const a=[]; for(let L=T.island?0:iv; L<T.max; L+=iv) a.push(L); return a;}\nfunction contours(T,iv){\n  const k='c'+iv; if(T.cache[k]) return T.cache[k];\n  return T.cache[k]=levelsOf(T,iv).map(L=>({L, lines:contourAt(T,L===0?0.0001:L,true)}));\n}\n\n/* ---------- 顏色 ---------- */\nconst TINT=[[-150,[120,170,206]],[-1,[170,208,232]],[0,[186,215,168]],[100,[207,226,169]],[250,[232,225,165]],[400,[226,197,143]],[550,[207,165,122]],[700,[184,136,106]],[1000,[164,123,100]],[1600,[146,108,92]],[2200,[160,140,132]],[3000,[222,216,210]]];\nfunction tint(h){\n  if(h<=TINT[0][0]) return TINT[0][1];\n  for(let k=1;k<TINT.length;k++){ if(h<=TINT[k][0]){const [h0,c0]=TINT[k-1],[h1,c1]=TINT[k], t=(h-h0)/(h1-h0); return c0.map((v,q)=>v+(c1[q]-v)*t);} }\n  return TINT[TINT.length-1][1];\n}\n\n/* ================= 狀態 ================= */\nconst S={mode:'origin', t:'A', iv:50, tintOn:true,\n  water:{lv:0, playing:false, done:false},\n  slopeC:null,\n  feat:null,\n  prof:{a:null,b:null,step:0,drag:false},\n  game:null};\nconst T=()=>TER[S.t];\n\n/* ================= 2D 地圖 ================= */\nconst mapC=$('map'), mctx=mapC.getContext('2d');\nlet MS=500, dpr=1;\nconst tintCache={};\nfunction tintCanvas(t){\n  if(tintCache[t]) return tintCache[t];\n  const Tt=TER[t], c=document.createElement('canvas'); c.width=c.height=N;\n  const x=c.getContext('2d'), im=x.createImageData(N,N);\n  for(let q=0;q<N*N;q++){const col=tint(Tt.H[q]); im.data[q*4]=col[0]; im.data[q*4+1]=col[1]; im.data[q*4+2]=col[2]; im.data[q*4+3]=255;}\n  x.putImageData(im,0,0); return tintCache[t]=c;\n}\nconst P=(x,y)=>[x*MS,y*MS];\nfunction sizeMap(){\n  const r=mapC.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);\n  MS=Math.max(50,Math.min(r.width,r.height));\n  mapC.width=Math.round(r.width*dpr); mapC.height=Math.round(r.height*dpr);\n}\nfunction strokeLine(ctx,pts){ctx.beginPath(); pts.forEach((p,k)=>{const q=P(p[0],p[1]); k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);}); ctx.stroke();}\nfunction labelFont(px,w){return `${w||700} ${px}px ${css('--sans')}`;}\nfunction haloText(ctx,txt,x,y,color,px,align){\n  ctx.font=labelFont(px); ctx.textAlign=align||'center'; ctx.textBaseline='middle';\n  ctx.lineJoin='round'; ctx.lineWidth=Math.max(3,px*.32); ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.strokeText(txt,x,y);\n  ctx.fillStyle=color; ctx.fillText(txt,x,y);\n}\nfunction drawContours(ctx,Tt,iv,maxLevel){\n  const cs=contours(Tt,iv), brown=css('--brown');\n  const lblEvery=iv*2;\n  for(const {L,lines} of cs){\n    if(maxLevel!=null && L>maxLevel+0.01) continue;\n    const coast=Tt.island&&L===0;\n    ctx.strokeStyle=coast?css('--sea'):brown;\n    ctx.lineWidth=coast?2.4:(L%lblEvery===0?2.1:1.25);\n    ctx.lineJoin='round';\n    for(const ln of lines) strokeLine(ctx,ln);\n  }\n  // 標高數字：放在等高線最稀疏的位置\n  const placed=[];\n  const fs=Math.max(11,Math.round(MS/46));\n  for(const {L,lines} of cs){\n    if(maxLevel!=null && L>maxLevel+0.01) continue;\n    if(L%lblEvery!==0 || L===0) continue;\n    for(const ln of lines){\n      if(ln.length<30) continue;\n      let best=null, bs=1e9;\n      for(let k=8;k<ln.length-8;k+=4){\n        const [x,y]=ln[k]; if(x<.04||x>.96||y<.04||y>.96||(y>.86&&x<.36)) continue;\n        const g=grad(Tt,x,y), s=Math.hypot(g[0],g[1]);\n        const q=P(x,y); if(placed.some(p=>Math.hypot(p[0]-q[0],p[1]-q[1])<fs*(Tt.size>10?4.6:3.2))) continue;\n        if(s<bs){bs=s; best=k;}\n      }\n      if(best==null) continue;\n      const a=P(...ln[best-3]), b=P(...ln[best+3]), q=P(...ln[best]);\n      let ang=Math.atan2(b[1]-a[1],b[0]-a[0]); if(ang>Math.PI/2)ang-=Math.PI; if(ang<-Math.PI/2)ang+=Math.PI;\n      ctx.save(); ctx.translate(q[0],q[1]); ctx.rotate(ang);\n      ctx.font=labelFont(fs,700); const w=ctx.measureText(String(L)).width;\n      ctx.fillStyle='rgba(250,249,243,.95)'; ctx.fillRect(-w/2-3,-fs*.62,w+6,fs*1.24);\n      ctx.fillStyle=css('--brown-2'); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(L),0,1);\n      ctx.restore(); placed.push(q);\n    }\n  }\n}\nfunction drawDecor(ctx,Tt){\n  const fs=Math.max(11,Math.round(MS/48));\n  // 指北\n  const nx=MS-fs*2.2, ny=fs*2.4;\n  ctx.fillStyle=css('--ink'); ctx.beginPath(); ctx.moveTo(nx,ny-fs*1.3); ctx.lineTo(nx+fs*.55,ny+fs*.3); ctx.lineTo(nx,ny); ctx.lineTo(nx-fs*.55,ny+fs*.3); ctx.closePath(); ctx.fill();\n  haloText(ctx,'N',nx,ny+fs*1.1,css('--ink'),fs);\n  // 比例尺\n  const m=Tt.size*1000, seg=m>15000?5000:m>3000?1000:500, len=seg/m*MS, x0=fs*1.2, y0=MS-fs*1.3;\n  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(x0-6,y0-fs*1.6,len+fs*4.2,fs*2.3);\n  ctx.strokeStyle=css('--ink'); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,y0-5); ctx.lineTo(x0,y0); ctx.lineTo(x0+len,y0); ctx.lineTo(x0+len,y0-5); ctx.stroke();\n  ctx.font=labelFont(fs*.9,500); ctx.fillStyle=css('--ink'); ctx.textAlign='left'; ctx.textBaseline='alphabetic';\n  ctx.fillText('0',x0-2,y0-fs*.5); ctx.fillText(seg+' 公尺',x0+len-fs*.3,y0-fs*.5);\n  if(Tt.names) for(const [n,x,y] of Tt.names){const q=P(x,y); haloText(ctx,n,q[0],q[1],css('--sea'),fs*1.05);}\n  if(Tt.island){const q=P(.88,.2); haloText(ctx,'太平洋',q[0],q[1],css('--sea'),fs*1.1);}\n}\nfunction mark(ctx,x,y,color,r,label,shape){\n  const q=P(x,y); r=r||MS/70;\n  ctx.fillStyle=color; ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath();\n  if(shape==='tri'){ctx.moveTo(q[0],q[1]-r*1.2); ctx.lineTo(q[0]+r,q[1]+r*.7); ctx.lineTo(q[0]-r,q[1]+r*.7); ctx.closePath();}\n  else if(shape==='x'){ctx.lineWidth=4; ctx.strokeStyle=color; ctx.moveTo(q[0]-r,q[1]-r); ctx.lineTo(q[0]+r,q[1]+r); ctx.moveTo(q[0]+r,q[1]-r); ctx.lineTo(q[0]-r,q[1]+r); ctx.stroke(); r=r;}\n  else ctx.arc(q[0],q[1],r,0,Math.PI*2);\n  if(shape!=='x'){ctx.stroke(); ctx.fill();}\n  if(label) haloText(ctx,label,q[0],q[1]-r*2.3,color,Math.max(13,MS/38));\n}\nfunction drawFeature(ctx,Tt,k t);\n  const ox=(r.width-MS)/2, oy=(r.height-MS)/2; ctx.translate(ox,oy);\n  ctx.save(); ctx.beginPath(); ctx.rect(0,0,MS,MS); ctx.clip();\n  ctx.fillStyle='#F7F5EC'; ctx.fillRect(0,0,MS,MS);\n  if(S.tintOn){ctx.imageSmoothingEnabled=true; ctx.globalAlpha=Tt.island?1:.9; ctx.drawImage(tintCanvas(S.t),0,0,MS,MS); ctx.globalAlpha=1;}\n  let maxL=null;\n  if(S.mode==='origin') maxL=S.water.done?null:S.water.lv;\n  if(S.mode==='origin' && !S.water.done){\n    // 未淹到的高度先畫淡淡的輪廓，讓學生看得到山的位置\n    ctx.globalAlpha=.18; drawContours(ctx,Tt,S.iv,null); ctx.globalAlpha=1;\n  }\n  drawContours(ctx,Tt,S.iv,maxL);\n  if(S.mode==='origin' && !S.water.done && S.water.lv>0){\n    ctx.strokeStyle=css('--valley'); ctx.lineWidth=Math.max(3,MS/150);\n    for(const ln of contourAt(Tt,S.water.lv,true)) strokeLine(ctx,ln);\n  }\n  drawDecor(ctx,Tt);\n  overlay2D[S.mode] && overlay2D[S.mode](ctx,Tt);\n  ctx.restore();\n  ctx.strokeStyle=css('--line'); ctx.lineWidth=1.5; ctx.strokeRect(.75,.75,MS-1.5,MS-1.5);\n  ctx.setTransform(1,0,0,1,0,0);\n}\nfunction mapToUnit(e){\n  const r=mapC.getBoundingClientRect(), ox=(r.width-MS)/2, oy=(r.height-MS)/2;\n  return [(e.clientX-r.left-ox)/MS,(e.clientY-r.top-oy)/MS];\n}\n\n/* 坡度：沿最陡方向取一段，數跨過幾條等高線 */\nfunction slopeProbe(Tt,x,y){\n  const g=grad(Tt,x,y), gl=Math.hypot(g[0],g[1])||1e-9, ux=g[0]/gl, uy=g[1]/gl;\n  const Lm=Tt.island?200:Tt.size>10?2000:400, Lu=Lm/(Tt.size*1000);\n  const a=[x-ux*Lu/2,y-uy*Lu/2], b=[x+ux*Lu/2,y+uy*Lu/2];\n  const pts=[]; let prev=hAt(Tt,...a), n=0;\n  for(let k=1;k<=120;k++){const t=k/120, px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t, h=hAt(Tt,px,py);\n    for(const L of levelsOf(Tt,S.iv)){ if((prev<L)!==(h<L)){n++; pts.push([px,py]);} } prev=h;}\n  const deg=slopeDeg(Tt,x,y);\n  return {a,b,n,pts,deg,Lm,h:hAt(Tt,x,y)};\n}\nfunction slopeWord(d){return d<5?'平緩':d<15?'中等':d<30?'陡':'非常陡';}\nfunction drawProbe(ctx,Tt,pt,name,color){\n  const p=slopeProbe(Tt,pt[0],pt[1]);\n  const A=P(...p.a), B=P(...p.b);\n  ctx.strokeStyle='r s*1.15); haloText(ctx,'B',B[0],B[1]-fs,acc,fs*1.15);\n    if(pr.step>=2 && !pr.drag){ const xs=crossings(Tt,pr.a,pr.b);\n      xs.forEach(c=>{const q=P(c.x,c.y); ctx.fillStyle=acc; ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(q[0],q[1],MS/150+2,0,7); ctx.fill(); ctx.stroke();});\n    }\n  },\n  game(ctx,Tt){ gameOverlay(ctx,Tt); }\n};\n\n/* ================= 剖面 ================= */\nfunction sampleLine(Tt,a,b,n){n=n||300; const out=[]; for(let k=0;k<=n;k++){const t=k/n; out.push({t,h:hAt(Tt,a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t)});} return out;}\nfunction crossings(Tt,a,b){\n  const s=sampleLine(Tt,a,b,600), lv=levelsOf(Tt,S.iv), out=[];\n  for(let k=1;k<s.length;k++) for(const L of lv){ const h0=s[k-1].h, h1=s[k].h;\n    if((h0<L)!==(h1<L)){const t=s[k-1].t+(s[k].t-s[k-1].t)*(L-h0)/(h1-h0); out.push({t,L,x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t});}}\n  return out.sort((p,q)=>p.t-q.t);\n}\nconst profC=$('cprof'), pctx=profC.getContext('2d');\nfunction drawProfilePanel(){\n  if(S.mode!=='profile') return;\n  const r=profC.getBoundingClientRect(); if(r.width<10) return;\n  profC.width=Math.round(r.width*dpr); profC.height=Math.round(r.height*dpr);\n  const ctx=pctx; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);\n  const pr=S.prof, Tt=T(), W=r.width, H=r.height, fs=Math.max(12,Math.min(18,W/55));\n  const ml=fs*4.2, mr=fs*1.6, mt=fs*5, mb=fs*2.6, pw=W-ml-mr, ph=H-mt-mb;\n  ctx.font=labelFont(fs,700); ctx.fillStyle=css('--ink'); ctx.textAlign='left'; ctx.textBaseline='top';\n  ctx.fillText('地形剖面圖',fs*.8,fs*.5);\n  if(!pr.a||!pr.b||pr.step<1){ctx.fillStyle=css('--muted'); ctx.font=labelFont(fs,500); ctx.fillText('在右邊地圖上拖曳，畫出一條剖面線 A→B。',fs*.8,fs*2.4); return;}\n  const s=sampleLine(Tt,pr.a,pr.b,400), xs=crossings(Tt,pr.a,pr.b);\n  const D=Math.hypot(pr.b[0]-pr.a[0],pr.b[1]-pr.a[1])*Tt.size*1000;\n  const lv=levelsOf(Tt,S.iv), top=Math.max(S.iv,Math.ceil((Math.max(...s.map(p=>p.h))+1)/S.iv)*S.iv);\n  const bot=Tt.island?Math. nv(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --paper:#0D1822; --panel:#12212D; --ink:#DCE6ED; --ink2:#95AABA; --line:#274050;\n    --sea:#173041; --grat:#2A4659; --land-halo:#0D1822;\n    --wind:#5B9CEB; --lee:#F0A445; --foehn:#F0584C; --ty:#FF4F58;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --paper:#0D1822; --panel:#12212D; --ink:#DCE6ED; --ink2:#95AABA; --line:#274050;\n  --sea:#173041; --grat:#2A4659; --land-halo:#0D1822;\n  --wind:#5B9CEB; --lee:#F0A445; --foehn:#F0584C; --ty:#FF4F58;\n}\n[hidden]{display:none!important}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100%;background:var(--paper);color:var(--ink);\n  font-family:\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif;font-size:15px;line-height:1.6}\nbutton,select,input{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--wind);outline-offset:2px}\n\n.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:16px 22px 6px}\n.top h1{margin:0;font-size:28px;font-weight:900;letter-spacing:.02em;line-height:1.2}\n.top p{margin:0;color:var(--ink2);max-width:46em}\n\n.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:10px 22px 16px;align-items:start}\n@media (max-width:980px){.layout{grid-template-columns:1fr}}\n\n.stagewrap{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}\n.stagebar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}\n.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}\n.seg button{border:0;background:transparent;padding:5px 16px;cursor:pointer;font-weight:700}\n.seg button[aria-pressed=\"true\"]{background:var(--ink);color:var(--paper)}\n.nowname{font-weight:700;font-size:17px}\n.nowname small{font
