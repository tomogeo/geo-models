kground:color-mix(in srgb,var(--ty) 9%,transparent)}\n.note{margin:10px 0 0;font-size:14px;color:var(--ink2)}\n.drawbtns{display:flex;gap:8px;margin-top:10px}\n.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:700}\n.btn.primary{background:var(--ink);color:var(--paper)}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n\n#explain{margin:0;font-size:15px}\n.cities{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:14px}\n.cities li{display:flex;align-items:center;gap:7px}\n.cities em{font-style:normal;color:var(--ink2);margin-left:auto;font-size:13px}\n.dot{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid var(--ink2);background:transparent}\n.lv2 .dot{background:var(--wind);border-color:var(--wind)}\n.lv1 .dot{background:color-mix(in srgb,var(--wind) 45%,transparent);border-color:var(--wind)}\n.lv-1 .dot{background:var(--lee);border-color:var(--lee)}\n.lv-2 .dot{background:var(--foehn);border-color:var(--foehn)}\n\n.toggles label{display:flex;gap:10px;align-items:flex-start;padding:4px 0;cursor:pointer}\n.toggles input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink)}\n.toggles small{display:block;color:var(--ink2);font-size:13px;line-height:1.5}\n\n.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}\n.legend span{display:flex;align-items:center;gap:8px}\n.sw{width:22px;height:14px;border-radius:3px;flex:none}\n.arrowkey svg{width:22px;height:14px;flex:none}\n\ndetails{margin-top:4px}\ndetails summary{cursor:pointer;font-weight:700;padding:4px 0}\ndetails p{margin:4px 0 8px;font-size:14px;color:var(--ink2)}\n\nfooter{padding:0 22px 20px;color:var(--ink2);font-size:13px}\n@media (max-width:600px){.top h1{font-size:23px}.layout,.top,footer{padding-left:12px;padding-right:12px}}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\">\n  <h1>颱風路徑與迎風、背風<\/h1>\n  <p>選一條路徑，看颱風的逆時針環流吹到臺灣時，哪裡是迎風面、哪裡是背風面。<\/p>\n<\/header>\n<main class=\"layout\">\n  <section class=\"stagewrap\">\n    <div class=\"stagebar\">\n      <div class=\"seg\" role=\"group\" aria-label=\"顯示方式\">\n        <button id=\"v2\" aria-pressed=\"true\">2D 地圖<\/button>\n        <button id=\"v3\" aria-pressed=\"false\">3D 地形<\/button>\n      <\/div>\n      <div class=\"nowname\" id=\"nowname\"><\/div>\n    <\/div>\n    <div class=\"stage\" id=\"stage\">\n      <canvas id=\"c2d\" aria-label=\"颱風路徑地圖\"><\/canvas>\n      <div id=\"c3d\" hidden><\/div>\n      <div class=\"hint\" id=\"hint\" hidden><\/div>\n    <\/div>\n    <div class=\"player\">\n      <button class=\"play\" id=\"play\" aria-label=\"播放\"><svg viewBox=\"0 0 20 20\" id=\"playIcon\"><path d=\"M5 3l12 7-12 7z\"/><\/svg><\/button>\n      <input type=\"range\" id=\"slider\" min=\"0\" max=\"1000\" value=\"450\" aria-label=\"颱風移動進度\">\n      <select id=\"speed\" aria-label=\"播放速度\"><option value=\"36\">慢<\/option><option value=\"20\" selected>中<\/option><option value=\"11\">快<\/option><\/select>\n    <\/div>\n  <\/section>\n\n  <aside class=\"panel\">\n    <div class=\"tabs\" role=\"tablist\">\n      <button role=\"tab\" id=\"t-preset\" aria-selected=\"true\">代表路徑<\/button>\n      <button role=\"tab\" id=\"t-case\" aria-selected=\"false\">歷史颱風<\/button>\n      <button role=\"tab\" id=\"t-draw\" aria-selected=\"false\">自己畫路徑<\/button>\n    <\/div>\n    <div class=\"sec\" id=\"pathSec\">\n      <div class=\"paths\" id=\"pathList\"><\/div>\n      <div id=\"drawCtl\" hidden>\n        <p class=\"note\" style=\"margin-top:0\">在地圖上依序點出颱風中心經過的位置，至少 2 點。畫好之後按「開始模擬」。<\/p>\n        <div class=\"drawbtns\">\n          <button class=\"btn primary\" id=\"drawGo\" disabled>開始模擬<\/button>\n          <button class=\"btn\" id=\"drawUndo\" disabled>復原一點<\/button>\n          <button class=\"btn\" id=\"drawClear\" disabled>清除<\/button>\n        <\/div>\n      <\/div>\n      <p class=\"note\" id=\"pathNote\"><\/p>\n    <\/div>\n    <div class=\"sec\">\n      <h2>現在的情況<\/h2>\n      <p id=\"explain\"><\/p>\n      <ul class=\"cities\" id=\"cities\"><\/ul>\n    <\/div>\n    <div class=\"sec toggles\">\n      <h2>加入其他因素<\/h2>\n      <label><input type=\"checkbox\" id=\"o-sw\"><span>西南氣流<small>颱風把南海的西南季風水氣拉向臺灣<\/small><\/span><\/label>\n      <label><input type=\"checkbox\" id=\"o-ne\"><span>東北季風（共伴效應）<small>秋颱的外圍環流與東北季風疊加<\/small><\/span><\/label>\n      <label><input type=\"checkbox\" id=\"o-foehn\" checked><span>標示可能出現焚風的地方<small>氣流翻過高山後，在背風側下沉增溫<\/small><\/span><\/label>\n    <\/div>\n    <div class=\"sec\">\n      <h2>圖例<\/h2>\n      <div class=\"legend\" id=\"legend\">\n        <span><i class=\"sw\" style=\"background:var(--wind)\"><\/i>迎風面，雨很大<\/span>\n        <span><i class=\"sw\" style=\"background:color-mix(in srgb,var(--wind) 45%,#b9cfa0)\"><\/i>迎風面，多雨<\/span>\n        <span><i class=\"sw\" style=\"background:var(--lee)\"><\/i>背風面，雨少<\/span>\n        <span><i class=\"sw\" style=\"background:var(--foehn)\"><\/i>可能出現焚風<\/span>\n        <span class=\"arrowkey\"><svg viewBox=\"0 0 22 14\"><path d=\"M2 7h15M12 2l6 5-6 5\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><\/svg>風吹的方向<\/span>\n        <span><svg width=\"22\" height=\"14\" viewBox=\"0 0 22 14\"><circle cx=\"11\" cy=\"7\" r=\"5.5\" fill=\"none\" stroke=\"var(--ty)\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/><\/svg>七級風暴風圈<\/span>\n      <\/div>\n    <\/div>\n    <div class=\"sec\">\n      <h2>觀念補充<\/h2>\n      <details><summary>迎風面、背風面怎麼判斷<\/summary><p>先看颱風中心在臺灣的哪個方位，依逆時針環流推出臺灣吹什麼風。風從海上吹向山坡的那一側是迎風面，空氣被迫抬升、成雲致雨；翻過山脊之後的另一側是背風面，空氣下沉，雨量少。<\/p><\/details>\n      <details><summary>西南氣流<\/summary><p>颱風位在臺灣北方、西北方或已進入臺灣海峽時，南側環流會把南海一帶的西南季風水氣往臺灣拉。西南部山區正對西南風，成為迎風面，常出現極端豪雨，例如莫拉克颱風。<\/p><\/details>\n      <details><summary>共伴效應<\/summary><p>秋季東北季風南下時，若颱風經過臺灣東方或東南方，颱風外圍的東北風和季風疊加，北部、東北部的迎風坡雨量暴增，例如象神颱風。<\/p><\/details>\n      <details><summary>焚風<\/summary><p>氣流在迎風坡上升時降下大量雨水，翻過高山後沿背風坡下沉，空氣被壓縮增溫，變得又乾又熱。颱風在臺灣北方或西北方、吹西風時，臺東一帶最常出現。<\/p><\/details>\n    <\/div>\n  <\/aside>\n<\/main>\n<footer>路徑依中央氣象署颱風資料庫簡化繪製；風場與地形為理想化模型，實際風向還會受地形阻擋、繞流影響，僅供教學示意。<\/footer>\n<script>\n// ===== 核心模型：地形、颱風風場、迎風/背風判斷 =====\nconst DEG = Math.PI / 180, KX = 111 * Math.cos(23.7 * DEG), KY = 111;\nconst VIEW = { lon0: 118.5, lon1: 124.5, lat0: 20.3, lat1: 26.8 };\n\n// 臺灣本島海岸線（簡化）\nconst TW = [[121.54,25.30],[121.64,25.21],[121.74,25.15],[121.87,25.12],[122.00,25.01],[121.90,24.93],[121.83,24.85],[121.80,24.72],[121.87,24.60],[121.83,24.45],[121.72,24.27],[121.63,24.05],[121.61,23.95],[121.52,23.70],[121.45,23.40],[121.38,23.12],[121.25,22.87],[121.19,22.78],[121.02,22.57],[120.91,22.36],[120.87,22.15],[120.85,21.91],[120.74,21.92],[120.70,22.05],[120.62,22.28],[120.50,22.42],[120.40,22.51],[120.28,22.60],[120.24,22.72],[120.15,22.95],[120.08,23.12],[120.10,23.30],[120.14,23.50],[120.20,23.72],[120.28,23.87],[120.40,24.05],[120.50,24.25],[120.62,24.44],[120.75,24.60],[120.86,24.72],[120.94,24.85],[121.04,24.97],[121.14,25.05],[121.30,25.12],[121.40,25.18],[121.47,25.25]];\n\n// 山脈脊線 [lon, lat, 高度m]，w = 山體半寬(km)\nconst RIDGES = [\n  { w: 19, p: [[121.78,24.86,900],[121.50,24.62,2600],[121.23,24.38,3800],[121.05,24.12,2600],[120.90,23.95,1200]] }, // 雪山山脈\n  { w: 25, p: [[121.60,24.55,2200],[121.42,24.30,3300],[121.26,24.00,3300],[121.18,23.70,3200],[121.05,23.40,3300],[120.95,23.15,3100],[120.80,22.62,2800],[120.80,22.30,1500],[120.82,22.00,300]] }, // 中央山脈\n  { w: 12, p: [[120.97,23.72,2300],[120.96,23.47,3900],[120.92,23.25,2600]] }, // 玉山山脈\n  { w: 12, p: [[120.90,23.80,1700],[120.80,23.50,2500],[120.68,23.15,1500],[120.62,22.95,700]] }, // 阿里山山脈\n  { w: 8,  p: [[121.53,23.93,700],[121.42,23.55,1500],[121.30,23.20,1400],[121.18,22.85,600]] }, // 海岸山脈\n  { w: 8,  p: [[121.55,25.17,1100],[121.57,25.19,1100]] } // 大屯火山群\n];\n\nconst G = { lon0: 119.9, lat0: 21.8, d: 0.025, nc: 89, nr: 145 };\nconst N = G.nc * G.nr;\nconst GXs = new Float32Array(N), GYs = new Float32Array(N);\nconst E = new Float32Array(N), LAND = new Uint8Array(N), SHADE = new Float32Array(N), LV = new Int8Array(N);\n\nfunction pip(x, y, poly) {\n  let ins = false;\n  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {\n    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];\n    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;\n  }\n  return ins;\n}\nfunction segDist(px, py, ax, ay, bx, by) {\n  const vx = bx - ax, vy = by - ay, wx = px - ax, wy = py - ay, L = vx * vx + vy * vy;\n  let t = L ? (wx * vx + wy * vy) / L : 0; t = Math.max(0, Math.min(1, t));\n  return [Math.hypot(px - (ax + t * vx), py - (ay + t * vy)), t];\n}\nfunction coastDist(lon, lat) {\n  const px = lon * KX, py = lat * KY; let m = 1e9;\n  for (let i = 0, j = TW.length - 1; i < TW.length; j = i++) {\n    const d = segDist(px, py, TW[j][0] * KX, TW[j][1] * KY, TW[i][0] * KX, TW[i][1] * KY)[0];\n    if (d < m) m = d;\n  }\n  return m;\n}\nfunction ridgeHeight(lon, lat) {\n  const px = lon * KX, py = lat * KY; let h = 0;\n  for (const R of RIDGES) for (let k = 0; k < R.p.length - 1; k++) {\n    const a = R.p[k], b = R.p[k + 1];\n    const [d, t] = segDist(px, py, a[0] * KX, a[1] * KY, b[0] * KX, b[1] * KY);\n    const H = a[2] + (b[2] - a[2]) * t, q = (d / R.w) * (d / R.w), v = H * (0.8 * Math.exp(-q * q) + 0.2 * Math.exp(-q));\n    if (v > h) h = v;\n  }\n  return h;\n}\nfunction buildTerrain() {\n  for (let r = 0; r < G.nr; r++) for (let c = 0; c < G.nc; c++) {\n    const i = r * G.nc + c, lon = G.lon0 + c * G.d, lat = G.lat0 + r * G.d;\n    const inside = pip(lon, lat, TW), cd = coastDist(lon, lat);\n    if (!inside && cd > 2.2) continue;\n    LAND[i] = 1;\n    const di = inside ? cd : 0;\n    let h = ridgeHeight(lon, lat) * Math.min(1, di / 9);\n    E[i] = Math.max(h, Math.min(120, di * 3)) + 3;\n  }\n  // 大尺度地形坡向（平滑約 30 km），用來判斷風是「橫越」山脈還是「平行」山脈\n  let S = Float32Array.from(E);\n  for (let pass = 0; pass < 3; pass++) {\n    const T = new Float32Array(N), R = 5;\n    for (let r = 0; r < G.nr; r++) for (let c = 0; c < G.nc; c++) {\n      let sum = 0, n = 0;\n      for (let k = -R; k <= R; k++) { const cc = c + k; if (cc >= 0 && cc < G.nc) { sum += S[r * G.nc + cc]; n++; } }\n      T[r * G.nc + c] = sum / n;\n    }\n    for (let r = 0; r < G.nr; r++) for (let c = 0; c < G.nc; c++) {\n      let sum = 0, n = 0;\n      for (let k = -R; k <= R; k++) { const rr = r + k; if (rr >= 0 && rr < G.nr) { sum += T[rr * G.nc + c]; n++; } }\n      S[r * G.nc + c] = sum / n;\n    }\n  }\n  for (let r = 1; r < G.nr - 1; r++) for (let c = 1; c < G.nc - 1; c++) {\n    const i = r * G.nc + c;\n    const gx = (S[i + 1] - S[i - 1]) / (2 * G.d * KX), gy = (S[i + G.nc] - S[i - G.nc]) / (2 * G.d * KY), m = Math.hypot(gx, gy);\n    if (m > 4) { GXs[i] = gx / m; GYs[i] = gy / m; }\n  }\n  const dxk = G.d * KX, dyk = G.d * KY, lx = -0.5, ly = 0.6, lz = 0.62; // 光源：西北\n  for (let r = 1; r < G.nr - 1; r++) for (let c = 1; c < G.nc - 1; c++) {\n    const i = r * G.nc + c; if (!LAND[i]) continue;\n    const gx = (E[i + 1] - E[i - 1]) / 1000 / (2 * dxk) * 6, gy = (E[i + G.nc] - E[i - G.nc]) / 1000 / (2 * dyk) * 6;\n    const n = Math.hypot(gx, gy, 1), dot = (-gx * lx - gy * ly + lz) / n;\n    SHADE[i] = Math.max(0.55, Math.min(1.12, 0.45 + dot * 0.75));\n  }\n}\nfunction elevAt(lon, lat) {\n  const c = Math.round((lon - G.lon0) / G.d), r = Math.round((lat - G.lat0) / G.d);\n  if (c < 0 || r < 0 || c >= G.nc || r >= G.nr) return 0;\n  const i = r * G.nc + c; return LAND[i] ? E[i] : 0;\n}\nfunction isLandPt(lon, lat) { return pip(lon, lat, TW); }\nfunction isLandCell(lon, lat) {\n  const c = Math.round((lon - G.lon0) / G.d), r = Math.round((lat - G.lat0) / G.d);\n  if (c < 0 || r < 0 || c >= G.nc || r >= G.nr) return false;\n  return LAND[r * G.nc + c] === 1;\n}\n\n// ===== 風場 =====\nconst VMAX = 45, RM = 50, INFLOW = 20 * DEG, R7 = RM * Math.pow(VMAX / 17.2, 1 / 0.6); // 七級風半徑\nconst TWC = { lon: 121.0, lat: 23.7 };\nfunction typhoonWind(lon, lat, c) {\n  const dx = (lon - c.lon) * KX, dy = (lat - c.lat) * KY, r = Math.hypot(dx, dy);\n  if (r < 1) return [0, 0];\n  let V = r < RM ? VMAX * r / RM : VMAX * Math.pow(RM / r, 0.6);\n  if (r > 450) V *= Math.max(0, 1 - (r - 450) / 450);\n  const ca = Math.cos(INFLOW), sa = Math.sin(INFLOW);\n  return [V * (ca * (-dy / r) + sa * (-dx / r)), V * (ca * (dx / r) + sa * (-dy / r))];\n}\n// 颱風離臺灣較遠時，整座島大致吹同一個方向的風（由颱風中心相對臺灣的方位決定）；\n// 颱風很近或在陸地上時，改用各地實際的環流風向。\nfunction blendWind(lon, lat, c) {\n  const loc = typhoonWind(lon, lat, c), sp = Math.hypot(loc[0], loc[1]);\n  const dx = (TWC.lon - c.lon) * KX, dy = (TWC.lat - c.lat) * KY, rd = Math.hypot(dx, dy);\n  if (rd < 1) return loc;\n  const big = [-dy / rd * sp, dx / rd * sp];\n  const a = Math.max(0, Math.min(1, 1 - (rd - 120) / 200));\n  return [a * loc[0] + (1 - a) * big[0], a * loc[1] + (1 - a) * big[1]];\n}\nfunction wind(lon, lat, c, o) {\n  let u = 0, v = 0;\n  if (c) { const w = isLandCell(lon, lat) ? blendWind(lon, lat, c) : typhoonWind(lon, lat, c); u += w[0]; v += w[1]; }\n  if (o.sw && c) { // 颱風引進的西南氣流：颱風愈接近臺灣愈明顯\n    const rd = Math.hypot((c.lon - TWC.lon) * KX, (c.lat - TWC.lat) * KY);\n    const k = Math.max(0, Math.min(1, (25.3 - lat) / 2.2)) * Math.max(0, Math.min(1, 1 - (rd - 350) / 500)) * 15;\n    u += k * 0.74; v += k * 0.67;\n  }\n  if (o.ne) { // 東北季風\n    const k = Math.max(0, Math.min(1, (lat - 22.6) / 2)) * 13;\n    u -= k * 0.66; v -= k * 0.75;\n  }\n  return [u, v];\n}\nconst LOOK = [5, 10, 16, 22, 29, 36, 44, 52, 60];\nfunction compute(c, o) {\n  for (let i = 0; i < N; i++) {\n    if (!LAND[i]) { LV[i] = 0; continue; }\n    const r = (i / G.nc) | 0, cc = i - r * G.nc, lon = G.lon0 + cc * G.d, lat = G.lat0 + r * G.d;\n    const [u, v] = wind(lon, lat, c, o), s = Math.hypot(u, v);\n    if (s < 5) { LV[i] = 0; continue; }\n    const ux = u / s / KX, uy = v / s / KY, h0 = E[i];\n    let a = 0, b = 0, bm = 0;\n    for (const L of LOOK) {\n      const ea = elevAt(lon + ux * L, lat + uy * L), eb = elevAt(lon - ux * L, lat - uy * L);\n      a += ea; b += eb; if (eb > bm) bm = eb;\n    }\n    a /= LOOK.length; b /= LOOK.length;\n    let sc = (Math.max(a, h0) - Math.max(b, h0)) / 900 * Math.min(1, s / 20);\n    let cf = 1;\n    if (GXs[i] || GYs[i]) { cf = Math.max(0.1, Math.abs(u / s * GXs[i] + v / s * GYs[i])); sc *= cf; }\n    let lv = 0;\n    if (sc > 0.6) lv = 2; else if (sc > 0.25) lv = 1;\n    else if (sc < -0.25) { lv = -1; if (o.foehn && cf > 0.55 && sc < -0.45 && bm > 1800 && s >= 10 && h0 < 700) lv = -2; }\n    LV[i] = lv;\n  }\n}\n\n// ===== 路徑 =====\nfunction catmull(pts, seg = 16) {\n  const out = [];\n  for (let i = 0; i < pts.length - 1; i++) {\n    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];\n    for (let k = 0; k < seg; k++) {\n      const t = k / seg, t2 = t * t, t3 = t2 * t;\n      out.push([0, 1].map(j => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));\n    }\n  }\n  out.push(pts[pts.length - 1].slice());\n  return out;\n}\nfunction makeTrack(pts) {\n  const d = catmull(pts), cum = [0];\n  for (let i = 1; i < d.length; i++) cum.push(cum[i - 1] + Math.hypot((d[i][0] - d[i - 1][0]) * KX, (d[i][1] - d[i - 1][1]) * KY));\n  return { d, cum, len: cum[cum.length - 1] };\n}\nfunction posAt(tr, t) {\n  const s = Math.max(0, Math.min(1, t)) * tr.len; let i = 1;\n  while (i < tr.cum.length - 1 && tr.cum[i] < s) i++;\n  const s0 = tr.cum[i - 1], s1 = tr.cum[i], f = s1 > s0 ? (s - s0) / (s1 - s0) : 0;\n  return { lon: tr.d[i - 1][0] + (tr.d[i][0] - tr.d[i - 1][0]) * f, lat: tr.d[i - 1][1] + (tr.d[i][1] - tr.d[i - 1][1]) * f, idx: i };\n}\n\nconst CITIES = [\n  ['臺北', 121.52, 25.04], ['基隆', 121.72, 25.12], ['新竹', 120.97, 24.80], ['宜蘭', 121.75, 24.75], ['臺中', 120.68, 24.15],\n  ['花蓮', 121.59, 23.98], ['嘉義', 120.45, 23.48], ['臺南', 120.21, 22.99], ['高雄', 120.31, 22.63], ['臺東', 121.13, 22.76], ['恆春', 120.75, 22.00]\n];\nfunction cityLevel(lon, lat) {\n  const c0 = Math.ro const topicOf=id=>REG.topics.find(t=>t.id===id);
let filter='all';

/* 首頁等高線 */
(function(){
  const svg=$('contours'); const W=1200,H=520; svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio','xMaxYMid slice');
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const waves=[...Array(4)].map((_,k)=>({f:k+2,a:rnd()*6.28,m:(0.10/(k+1))}));
  const cx=W*0.80,cy=H*0.52; let d='';
  for(let i=1;i<=16;i++){
    const r=26*i, pts=[];
    for(let s=0;s<=120;s++){
      const th=s/120*Math.PI*2; let k=1;
      waves.forEach(w=>k+=w.m*Math.sin(w.f*th+w.a+i*0.18));
      pts.push([cx+Math.cos(th)*r*k*1.35, cy+Math.sin(th)*r*k]);
    }
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z');
    if(i%5===0)p.setAttribute('class','idx');
    p.style.animationDelay=(i*0.06)+'s';
    svg.appendChild(p);
  }
})();

/* 主題篩選 */
function renderTabs(){
  const used=REG.topics.filter(t=>REG.models.some(m=>m.topic===t.id));
  const btn=(id,label,n,c)=>`<button class="tab" type="button" data-f="${id}" aria-pressed="${filter===id}" ${c?`style="--c:var(${c})"`:''}>${c?'<span class="dot"></span>':''}${label}<span class="n">${n}</span></button>`;
  $('tabs').innerHTML=btn('all','全部',REG.models.length)+used.map(t=>btn(t.id,t.name,REG.models.filter(m=>m.topic===t.id).length,t.color)).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderTabs();renderList();});
}
function renderList(){
  const topics=REG.topics.filter(t=>(filter==='all'||filter===t.id)&&REG.models.some(m=>m.topic===t.id));
  $('groups').innerHTML=topics.map(t=>{
    const ms=REG.models.filter(m=>m.topic===t.id);
    return `<section class="group" style="--c:var(${t.color})"><h2>${t.name}<small>${ms.length} 個模型</small></h2><ul class="list">`+
      ms.map(m=>`<li class="item" data-id="${m.id}"><div class="ico" aria-hidden="true">${m.icon}</div><div><h3>${m.title}</h3><p>${m.desc}</p>${m.keys?`<div class="keys">上課操作：${m.keys}</div>`:''}</div><button class="open" type="button" data-id="${m.id}">開啟</button></li>`).join('')+
      `</ul></section>`;
  }).join('');
  $('groups').querySelectorAll('.item').forEach(li=>li.onclick=()=>{location.hash=li.dataset.id;});
}
$('foot').textContent=`目前共 ${REG.models.length} 個模型，會持續增加。`;

/* 播放模型 */
let current=null;
function openModel(id){
  const m=REG.models.find(x=>x.id===id); if(!m||!SRC[id]){closeModel();return;}
  if(current===id)return; current=id;
  const t=topicOf(m.topic);
  $('vtitle').innerHTML=`<i style="--c:var(${t.color})"></i>${m.title}`;
  $('viewer').style.setProperty('--c',`var(${t.color})`);
  const f=$('frame'); f.srcdoc=SRC[id];
  $('viewer').classList.add('on'); document.body.classList.add('viewing');
  document.title=m.title+'｜地理模型教室';
}
function closeModel(){
  current=null; $('viewer').classList.remove('on'); document.body.classList.remove('viewing');
  $('frame').srcdoc=''; document.title='地理模型教室';
  if(document.fullscreenElement)try{document.exitFullscreen();}catch(_){}
}
$('frame').addEventListener('load',()=>{
  const f=$('frame'); if(!current)return;
  try{
    f.contentWindow.focus();
    f.contentDocument.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!f.contentDocument.fullscreenElement) goHome(); });
  }catch(_){}
});
function goHome(){
  closeModel();
  if(!location.hash) return;
  try{ history.pushState(null,'',location.href.split('#')[0]); }
  catch(_){ location.hash=''; }
}
$('back').onclick=goHome;
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():$('viewer').requestFullscreen();}catch(_){} setTimeout(()=>{try{$('frame').contentWindow.focus();}catch(_){}},200);};
document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕';});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&current&&!document.fullscreenElement) goHome(); });
function route(){ const id=decodeURIComponent(location.hash.slice(1)); id?openModel(id):closeModel(); }
window.addEventListener('hashchange',route);

renderTabs(); renderList(); route();
})();
</script>
</body>
</html>
