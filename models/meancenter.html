<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>平均中心與標準距離</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：左大地圖＋右步驟面板（延續「空間內插」模型）；地圖本身維持課本紙面配色 */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1f2a36; --ink2:#566372; --line:#d3dae2;
  --accent:#2f4f8a; --accent-soft:#e3eaf6; --step:#8f6fb0; --step-soft:#efe8f6;
  --red:#d0101c; --red-soft:#fbe3e3; --warn:#b4412f; --ok:#2e7d55;
  --es:#00a092; --hs:#8f86c3;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161b22; --paper:#1f262f; --ink:#e6ebf1; --ink2:#9aa7b5; --line:#34404d;
    --accent:#8fb0ea; --accent-soft:#26344a; --step:#bb9bdc; --step-soft:#342a42;
    --red:#ff6b6b; --red-soft:#43272a; --warn:#f08a74; --ok:#6fd39f;
    --es:#3cc9b9; --hs:#aea6e0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161b22; --paper:#1f262f; --ink:#e6ebf1; --ink2:#9aa7b5; --line:#34404d;
  --accent:#8fb0ea; --accent-soft:#26344a; --step:#bb9bdc; --step-soft:#342a42;
  --red:#ff6b6b; --red-soft:#43272a; --warn:#f08a74; --ok:#6fd39f;
  --es:#3cc9b9; --hs:#aea6e0; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;
  padding:18px clamp(16px,3vw,32px) 12px}
.top h1{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:.02em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.switches{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-size:15px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper);font-weight:500}
.seg button:disabled{opacity:.4;cursor:not-allowed}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;padding:0 clamp(16px,3vw,32px) 24px;align-items:start}
@media (max-width:940px){.layout{grid-template-columns:minmax(0,1fr)}}
.mapcol{min-width:0}
.mapbox{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;justify-content:center;overflow:hidden}
canvas#map{display:block;touch-action:none;border-radius:4px;max-width:100%}
.maptools{position:absolute;left:18px;top:18px;display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){.mapbox{flex-direction:column;align-items:center}.maptools{position:static;margin-bottom:8px;justify-content:center}.maptools:empty{display:none}}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-top:8px;font-size:14px;color:var(--ink2)}
.mapfoot label{display:inline-flex;align-items:center;gap:6px;margin-right:14px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:6px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:.92}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;min-width:0}
.steps{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 4px 7px;
  display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--ink2);line-height:1.3}
.steps b{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--step-soft);color:var(--step);font-size:15px;margin-bottom:3px}
.steps button[aria-current="step"]{border-color:var(--step);color:var(--ink);font-weight:500}
.steps button[aria-current="step"] b{background:var(--step);color:var(--paper)}
.body h2{margin:0 0 4px;font-size:19px;text-wrap:balance}
.body p{margin:0 0 10px;color:var(--ink2);font-size:15px}
.body .lead{color:var(--ink);font-size:16px}
.ctl{margin:12px 0}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink2);margin-bottom:4px}
.ctl .lab strong{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.ctl .seg{width:100%}
.ctl .seg button{flex:1;padding:5px 6px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--red)}
.btn{border:0;background:var(--accent);color:var(--paper);border-radius:9px;padding:9px 16px;font-size:16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{display:flex;gap:10px;margin:10px 0}
.stat div{flex:1;background:var(--bg);border-radius:9px;padding:8px 10px;min-width:0}
.stat span{display:block;font-size:13px;color:var(--ink2)}
.stat strong{font-size:21px;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;color:var(--ink2);font-weight:400}
.formula{background:var(--step-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.formula .eq{font-size:17px;text-align:center;margin:2px 0 6px;font-family:"Cambria Math","STIX Two Math","Times New Roman","Noto Sans TC",serif;font-variant-numeric:tabular-nums}
.formula .eq.sub{font-size:15px;color:var(--ink2)}
.formula small{display:block;color:var(--ink2);font-size:13px;line-height:1.5}
.over{text-decoration:overline}
.hint{font-size:14px;color:var(--ink2);background:var(--bg);border-radius:9px;padding:8px 10px;margin:10px 0}
.sel{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:15px}
.sel h3{margin:0 0 4px;font-size:16px}
.sel .num{font-variant-numeric:tabular-nums}
details{margin:8px 0;font-size:14px}
summary{cursor:pointer;color:var(--accent)}
.tbl{max-height:230px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:8px}
table.w{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.w th{position:sticky;top:0;background:var(--paper);font-weight:500;color:var(--ink2);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
table.w td{text-align:right;padding:3px 6px}
table.w th:first-child,table.w td:first-child{text-align:left}
table.w tr.hl td{background:var(--red-soft)}
table.w tfoot td{border-top:1px solid var(--line);font-weight:500}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{font-weight:500;color:var(--ink2)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.legend{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.legend .t{color:var(--ink);font-size:14px;font-weight:500}
.legend div{display:flex;align-items:center;gap:8px}
.lg{width:24px;min-height:16px;flex:none;display:grid;place-items:center}
.lg i{display:block}
.score{font-size:15px;margin:10px 0}
.score strong{font-size:30px;font-variant-numeric:tabular-nums}
.good{color:var(--ok)} .bad{color:var(--warn)}
.tasks{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.task{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--paper);text-align:left;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.task[aria-pressed="true"]{border-color:var(--step);background:var(--step-soft)}
.task .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--paper)}
.task.done .ck{background:var(--ok);border-color:var(--ok)}
.winp{width:74px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.grad{height:12px;border-radius:3px;flex:1;background:linear-gradient(90deg,#fbe9e0,#f3b096,#e26250,#8c283c)}
.task small{display:block;color:var(--ink2);font-size:13px}
.meter{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--step)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div>
    <h1>平均中心與標準距離</h1>
    <p>學校集中在哪裡？分散得多開？補習班聚在哪裡？（課本圖 2-32～2-34，嘉義市）</p>
  </div>
  <div class="switches">
    <div class="seg" id="varSeg" aria-label="選擇資料">
      <button data-v="es" aria-pressed="true">國小（20 所）</button>
      <button data-v="hs" aria-pressed="false">高中（14 所）</button>
    </div>
    <div class="seg" id="modeSeg" aria-label="選擇模式">
      <button data-m="explain" aria-pressed="true">講解步驟</button>
      <button data-m="heat" aria-pressed="false">熱區地圖</button>
      <button data-m="challenge" aria-pressed="false">挑戰</button>
    </div>
  </div>
</header>

<main class="layout">
  <div class="mapcol">
    <div class="mapbox" id="mapbox">
      <canvas id="map" aria-label="嘉義市學校分布與平均中心、標準距離地圖"></canvas>
      <div class="maptools" id="maptools"></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <div class="mapfoot">
      <div>
        <label><input type="checkbox" id="optGrid"> 座標格線</label>
        <label><input type="checkbox" id="optNum"> 學校編號</label>
      </div>
      <div id="srcNote">學校位置依課本圖 2-33 判讀；座標原點設在嘉義市西南角</div>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</main>

function mean(p){let sx=0,sy=0;p.forEach(s=>{sx+=s.x;sy+=s.y});return {x:sx/p.length,y:sy/p.length};}
function wmean(p){let sx=0,sy=0,sw=0;p.forEach(s=>{sx+=s.w*s.x;sy+=s.w*s.y;sw+=s.w});return {x:sx/sw,y:sy/sw,sw};}
function sdist(p,c){c=c||mean(p);let s=0;p.forEach(q=>{s+=(q.x-c.x)**2+(q.y-c.y)**2});return Math.sqrt(s/p.length);}
function inRing(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];
  if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function district(x,y){ if(inRing(x,y,D.west))return '西區'; if(inRing(x,y,D.east))return '東區';
  // 兩區界線上的細縫：看離哪一區近
  return nearRing(x,y,D.west)<nearRing(x,y,D.east)?(nearRing(x,y,D.west)<0.08?'西區':null):(nearRing(x,y,D.east)<0.08?'東區':null); }
function nearRing(x,y,r){let m=1e9;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[j],b=r[i];const dx=b[0]-a[0],dy=b[1]-a[1];
  const t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));m=Math.min(m,Math.hypot(a[0]+t*dx-x,a[1]+t*dy-y));}return m;}
function inCity(x,y){return !!district(x,y);}
function where(c){const d=district(c.x,c.y);if(!d)return '兩區交界';const o=d==='西區'?D.east:D.west;return nearRing(c.x,c.y,o)<0.3?'兩區交界':d;}

function schoolCol(v,inside){ if(v==='es')return inside?COL.esIn:COL.es; return inside?COL.hsIn:COL.hs; }
function drawSchools(p,v,o={}){

    const rad=o.wt?wr(s):6.5;

    if(o.moved&&(Math.abs(s.x-s.ox)>0.05||Math.abs(s.y-s.oy)>0.05)){
      ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(60,60,60,.7)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(X(s.ox),Y(s.oy));ctx.lineTo(X(s.x),Y(s.y));ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(X(s.ox),Y(s.oy),4,0,Math.PI*2);ctx.strokeStyle='rgba(60,60,60,.7)';ctx.stroke();
      ctx.beginPath();ctx.arc(X(s.x),Y(s.y),rad+3,0,Math.PI*2);ctx.strokeStyle='#111';ctx.lineWidth=1.6;ctx.stroke();
    }
    if(S.showNum) text(String(s.i),X(s.x)+rad+2,Y(s.y)-rad,{s:10.5,a:'left',w:500,c:'#333'});

}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

        ctx.save();ctx.globalAlpha=a;text(pre+'Ȳ = '+f2(c.y),X(0)+6,Y(c.y)-10,{s:12,w:700,a:'left',c:COL.red});ctx.restore();}}

        ctx.lineTo(X(m.x+(s.x-m.x)*q),Y(m.y+(s.y-m.y)*q));ctx.stroke();});ctx.restore();}

function drawChallenge(){

    const p=S.pts, m=mean(p), sd=sdist(p,m);
    drawSchools(p,S.v,{ringAll:true});

      const hx=X(ch.guess.x+ch.r), hy=Y(ch.guess.y);ctx.beginPath();ctx.arc(hx,hy,7,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#2f4f8a';ctx.lineWidth=2.4;ctx.stroke();
      text('我猜的',X(ch.guess.x),Y(ch.guess.y)-16,{s:12,w:700,c:'#2f4f8a'}); }

    }
  } else {
    const T=TASKS[ch.task], p=ch.tp, o=T.v==='es'?S.cmp.es:S.cmp.hs, mo=mean(o), so=sdist(o,mo), m=mean(p), sd=sdist(p,m);
    circle(mo,so,{fill:false,stroke:'rgba(80,80,80,.6)',dash:[5,5],lw:1.6});

/* ---------- 互動 ---------- */
function evKm(e){const r=cv.getBoundingClientRect();return toKm(e.clientX-r.left,e.clientY-r.top);}
function hit(p,list){let best=null,bd=Infinity;list.forEach(s=>{const d=Math.hypot(s.x-p.x,s.y-p.y)*sc;if(d<bd){bd=d;best=s;}});return bd<=13?best:null;}
let drag=null;
cv.addEventListener('pointerdown',e=>{
  const p=evKm(e);
  if(S.mode==='challenge'){
    const ch=S.ch;
    if(ch.lv===1){ if(ch.revealed){toast('按「再猜一次」重新開始');return;}
      if(ch.guess&&Math.hypot(p.x-(ch.guess.x+ch.r),p.y-ch.guess.y)*sc<14){drag={kind:'r'};}
      else if(ch.guess&&Math.hypot(p.x-ch.guess.x,p.y-ch.guess.y)*sc<14){drag={kind:'c'};}
      else {ch.guess={x:p.x,y:p.y};drag={kind:'c'};renderPanel();}
      cv.setPointerCapture(e.pointerId);req();return; }
    const h=hit(p,ch.tp); if(h){drag={kind:'s',s:h,moved:false,sx:e.clientX,sy:e.clientY,from:{x:h.x,y:h.y}};cv.setPointerCapture(e.pointerId);}
    return;
  }
  if(S.mode==='heat'){heatClick(p);return;}
  if(S.step===4)return;
  const h=hit(p,S.pts);
  if(h){drag={kind:'s',s:h,moved:false,sx:e.clientX,sy:e.clientY,from:{x:h.x,y:h.y}};S.sel=h;cv.setPointerCapture(e.pointerId);renderPanel();req();}
  else if(S.sel){S.sel=null;renderPanel();req();}
});
cv.addEventListener('pointermove',e=>{
  if(!drag){ const p=evKm(e);let over=false;
    if(S.mode==='challenge'&&S.ch.lv===1&&S.ch.guess&&!S.ch.revealed) over=Math.hypot(p.x-(S.ch.guess.x+S.ch.r),p.y-S.ch.guess.y)*sc<14||Math.hypot(p.x-S.ch.guess.x,p.y-S.ch.guess.y)*sc<14;
    else if(S.mode==='challenge'&&S.ch.lv===2) over=!!hit(p,S.ch.tp);
    else if(S.mode==='explain'&&S.step<4) over=!!hit(p,S.pts);
    else if(S.mode==='heat'){cv.style.cursor=S.hm.tool!=='view'||S.hm.st>=2?'crosshair':'';return;}
    cv.style.cursor=over?'grab':(S.mode==='challenge'&&S.ch.lv===1&&!S.ch.revealed?'crosshair':''); return; }
  const p=evKm(e);
  if(drag.kind==='r'){S.ch.r=Math.max(0.2,Math.min(6,Math.hypot(p.x-S.ch.guess.x,p.y-S.ch.guess.y)));panelLive();req();return;}
  if(drag.kind==='c'){S.ch.guess={x:Math.max(X0,Math.min(X1,p.x)),y:Math.max(Y0,Math.min(Y1,p.y))};req();return;}
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>3)drag.moved=true; if(!drag.moved)return;
  drag.s.x=Math.max(X0,Math.min(X1,p.x)); drag.s.y=Math.max(Y0,Math.min(Y1,p.y)); panelLive(); req();
});
cv.addEventListener('pointerup',()=>{
  if(!drag)return; const d=drag; drag=null;
  if(d.kind==='s'&&d.moved&&!inCity(d.s.x,d.s.y)){d.s.x=d.from.x;d.s.y=d.from.y;toast('學校要放在嘉義市範圍內');}
  if(S.mode==='challenge'&&S.ch.lv===2&&d.kind==='s') checkTask();
  renderPanel(); renderTools(); req();
});

let tt=0; function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200);}
function animate(key,dur,done){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){S[key]=1;done&&done();renderPanel();req();return;}
  const t0=performance.now(); S[key]=0;
  const tick=now=>{S[key]=Math.min(1,(now-t0)/dur);draw();if(S[key]<1)requestAnimationFrame(tick);else{done&&done();renderPanel();}};

/* ---------- 面板 ---------- */
const panel=document.getElementById('panel');

const HG=0.05, HX0=-0.2, HY0=-0.2, HNX=Math.ceil(12.6/HG), HNY=Math.ceil(9.1/HG);
let HC=null;
function kde(pts,r,n){ // 密度計算：每家補習班在計算範圍內的影響（越近越大）
  const g=new Float32Array(HNX*HNY), R=Math.ceil(r/HG);
  for(let k=0;k<n;k++){const s=pts[k], ci=Math.floor((s.x-HX0)/HG), cj=Math.floor((s.y-HY0)/HG);
    for(let j=Math.max(0,cj-R);j<=Math.min(HNY-1,cj+R);j++)for(let i=Math.max(0,ci-R);i<=Math.min(HNX-1,ci+R);i++){
      const dx=HX0+(i+.5)*HG-s.x, dy=HY0+(j+.5)*HG-s.y, q=(dx*dx+dy*dy)/(r*r); if(q<1) g[j*HNX+i]+=(1-q)*(1-q);}}
  return g;
}
const HSTOP=[[0,[255,255,255,0]],[.06,[252,236,228,.6]],[.3,[244,180,152,.85]],[.6,[227,100,82,.92]],[1,[132,36,58,.96]]];
function heatCol(t){t=Math.max(0,Math.min(1,t));for(let i=1;i<HSTOP.length;i++)if(t<=HSTOP[i][0]){const a=HSTOP[i-1],b=HSTOP[i],f=(t-a[0])/(b[0]-a[0]);return a[1].map((v,k)=>v+(b[1][k]-v)*f);}return HSTOP[HSTOP.length-1][1];}
function heatCanvas(){
  const H=S.hm, n=Math.round(H.k*H.pts.length), key=H.r+'|'+H.ver+'|'+n;
  if(HC&&HC.key===key)return HC;
  const full=(HC&&HC.fkey===H.r+'|'+H.ver)?HC.max:null;
  let mx=full; if(mx==null){const gf=kde(H.pts,H.r,H.pts.length);mx=0;for(const v of gf)if(v>mx)mx=v;}
  const g=n===H.pts.length?null:kde(H.pts,H.r,n), gg=g||kde(H.pts,H.r,H.pts.length);
  const c=document.createElement('canvas');c.width=HNX;c.height=HNY;const x=c.getContext('2d'),im=x.createImageData(HNX,HNY);
  for(let j=0;j<HNY;j++)for(let i=0;i<HNX;i++){const col=heatCol(gg[j*HNX+i]/(mx||1)),o=((HNY-1-j)*HNX+i)*4;
    im.data[o]=col[0];im.data[o+1]=col[1];im.data[o+2]=col[2];im.data[o+3]=col[3]*255;}
  x.putImageData(im,0,0); HC={key,fkey:H.r+'|'+H.ver,max:mx,c}; return HC;
}
function countWithin(p,r){return S.hm.pts.filter(s=>Math.hypot(s.x-p.x,s.y-p.y)<=r).length;}
function drawHeat(){
  const H=S.hm, st=H.st;
  if(st>=2&&H.k>0){const hc=heatCanvas();ctx.save();ctx.clip(S._city[0]);ctx.restore();
    ctx.save();const clip=new Path2D();clip.addPath(S._city[0]);clip.addPath(S._city[1]);ctx.clip(clip);
    ctx.imageSmoothingEnabled=true;ctx.drawImage(hc.c,X(HX0),Y(HY0+HNY*HG),HNX*HG*sc,HNY*HG*sc);ctx.restore();
    ctx.lineJoin='round';ctx.strokeStyle=COL.line;ctx.lineWidth=1.4;ctx.stroke(S._city[0]);ctx.stroke(S._city[1]);
    text('西區',X(2.3),Y(5.2),{s:18,w:500,c:'#3a3a3a'}); text('東區',X(10.3),Y(3.4),{s:18,w:500,c:'#3a3a3a'});}
  if(st===2&&H.showR){ctx.save();ctx.strokeStyle='rgba(74,118,189,.35)';ctx.lineWidth=1;H.pts.forEach(s=>{ctx.beginPath();ctx.arc(X(s.x),Y(s.y),H.r*sc,0,Math.PI*2);ctx.stroke();});ctx.restore();}
  const showP=st===1||H.showPts;
  if(showP){const n=st===1?H.pts.length:Math.round(H.k*H.pts.length);
    H.pts.forEach((s,k)=>{const on=k<n; dot(s,on?'#4a76bd':'rgba(74,118,189,.35)',st===1?5:3.6,{ring:st===1?'#fff':null,rw:1});});}
  if(st===3){const es=mk('es');es.forEach(s=>dot(s,COL.es,6.5,{ring:'#fff',rw:1.6}));
    es.filter(s=>s.nm).forEach(s=>text(s.nm,X(s.x)+(s.nm==='興嘉'?-12:12),Y(s.y)+(s.nm==='崇文'?18:-14),{s:15,w:700,a:s.nm==='興嘉'?'right':'left',c:'#1d1d1d'}));}
  if(H.probe&&st>=2){const pr=H.probe,n=countWithin(pr,H.r);circle(pr,H.r,{fill:'rgba(20,30,50,.06)',stroke:'#1f2a36',dash:[5,4],lw:1.8});
    ctx.beginPath();ctx.arc(X(pr.x),Y(pr.y),3.5,0,Math.PI*2);ctx.fillStyle='#1f2a36';ctx.fill();
    text(`半徑 ${m0(H.r)} m 內：${n} 家`,X(pr.x),Y(pr.y)-H.r*sc-10,{s:12.5,w:700,c:'#1f2a36'});}
}
const HSTEPS=['離散型點資料','連續型面資料','熱區地圖的應用'];
function setHeatStep(n){const H=S.hm;H.st=n;H.probe=null;if(n===2&&H.k>=1&&!H.done)H.k=0;if(n===3){H.k=1;H.done=true;H.showPts=false;}if(n===2)H.showPts=true;renderPanel();renderTools();req();}
function densAt(p,r){let v=0;S.hm.pts.forEach(s=>{const q=((s.x-p.x)**2+(s.y-p.y)**2)/(r*r);if(q<1)v+=(1-q)*(1-q);});return v;}
function heatDensestSchools(){const r=S.hm.r, es=mk('es'), mx=heatCanvas().max||1;return es.map(s=>({s,d:densAt(s,r)/mx*100,n:countWithin(s,r)})).sort((a,b)=>b.d-a.d);}
function renderHeat(){
  const H=S.hm, N=H.pts.length, west=H.pts.filter(s=>district(s.x,s.y)==='西區').length;
  let h=`<ol class="steps" style="grid-template-columns:repeat(3,1fr)">`+HSTEPS.map((t,i)=>`<li><button data-hst="${i+1}" ${H.st===i+1?'aria-current="step"':''}><b>${i+1}</b>${t}</button></li>`).join('')+`</ol><div class="body">`;
  if(H.st===1){
    h+=`<h2>離散型點資料</h2><p class="lead">嘉義市國小文理／英文補習班分布情況：相較於各級學校，補習班數量較多且分布密集。</p>
    <p>每一家補習班都是地圖上的一個點。點很多又互相重疊時，很難一眼看出主要的空間群聚處在哪裡。</p>
    <div class="stat"><div><span>補習班</span><strong>${N} <small>家</small></strong></div><div><span>西區／東區</span><strong>${west} <small>/ ${N-west}</small></strong></div></div>
    <div class="hint">下一步：用熱區地圖把離散型點資料轉換成連續型面資料。</div>`;
  }
  if(H.st===2){
    h+=`<h2>連續型面資料：補習班分布熱區</h2><p class="lead">熱區地圖是一種用來表示資料數值強度與位置的密度地圖，可將離散型的點資料轉換成連續型面資料，以表示地理現象的群聚趨勢。</p>
    <p>密度愈高，代表該處補習班群聚趨勢愈明顯。</p>
    <div class="ctl"><div class="lab">計算範圍（半徑）<strong id="hrv">${m0(H.r)} 公尺</strong></div><input type="range" id="hr" min="0.2" max="1.5" step="0.05" value="${H.r}" aria-label="計算範圍（半徑）"><div style="font-size:13px;color:var(--ink2);margin-top:2px">計算每個位置周圍多大範圍內的補習班</div></div>
    <div class="btnrow"><button class="btn" id="goH">${H.k>=1?'重新產生熱區':'產生熱區'}</button></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 0"><input type="checkbox" id="hR" ${H.showR?'checked':''}> 顯示每家的計算範圍</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 0"><input type="checkbox" id="hP" ${H.showPts?'checked':''}> 顯示補習班點</label>
    <div class="hint">點一下地圖任一處，看那裡計算範圍內有幾家補習班。範圍調小，熱區變得零碎；調大，熱區連成一大片。</div>`;
    if(H.probe){const n=countWithin(H.probe,H.r);h+=`<div class="sel"><h3>這一點（${where(H.probe)}）</h3><div>半徑 ${m0(H.r)} 公尺內有 <b>${n}</b> 家補習班</div></div>`;}
  }
  if(H.st===3){
    const top=heatDensestSchools().slice(0,5);
    h+=`<h2>熱區地圖的應用</h2><p class="lead">將國小分布與補習班熱區套疊，看看補習班群聚在哪些國小附近。</p>
    <p style="font-size:14px;margin-bottom:0">學校所在位置的補習班密度（全市最高＝100），前 5 名：</p><table class="cmp"><thead><tr><th>國小</th><th>位在</th><th>密度</th><th>${m0(H.r)} m 內</th></tr></thead><tbody>`+
    top.map(o=>`<tr><td>${o.s.nm?'<b>'+o.s.nm+'國小</b>':'國小 '+o.s.i}</td><td>${district(o.s.x,o.s.y)}</td><td><b>${Math.round(o.d)}</b></td><td>${o.n} 家</td></tr>`).join('')+`</tbody></table>
    <p style="font-size:13.5px;margin-bottom:4px">課本的結論：</p><p>將國小分布與補習班熱區套疊，可看出國小附近多有補習班分布，其中又以<b style="color:var(--ink)">西區興嘉國小</b>和<b style="color:var(--ink)">東區嘉北國小、崇文國小</b>附近的補習班密度最高。</p>
    <label style="display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 0"><input type="checkbox" id="hP" ${H.showPts?'checked':''}> 顯示補習班點</label>
    <div class="hint">想一想：補習班為什麼會聚在這幾所國小附近？（提示：學生人數、上下學動線、商業區）</div>`;
  }
  if(H.ver>0) h=h.replace('<div class="body">','<div class="body"><div class="hint" style="margin-top:0;background:var(--red-soft)">你新增或刪除過補習班，數值已和課本不同。</div>');
  h+=`<p style="font-size:13px;color:var(--ink2);margin-top:10px">補習班位置依課本圖 2-34 判讀，約 ${D.cram.length} 家（重疊的點依大小推估）。</p></div>`+heatLegend();
  panel.innerHTML=h;
  panel.querySelectorAll('[data-hst]').forEach(b=>b.onclick=()=>setHeatStep(+b.dataset.hst));
  const hr=document.getElementById('hr'); if(hr) hr.oninput=()=>{H.r=+hr.value;H.k=1;document.getElementById('hrv').textContent=m0(H.r)+' 公尺';req();};
  if(hr) hr.onchange=()=>renderPanel();
  const go=document.getElementById('goH'); if(go) go.onclick=()=>{H.done=true;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce){H.k=1;renderPanel();req();return;}
    const t0=performance.now(),dur=2600;const tick=now=>{H.k=Math.min(1,(now-t0)/dur);draw();if(H.k<1)requestAnimationFrame(tick);else renderPanel();};requestAnimationFrame(tick);};
  const r1=document.getElementById('hR'); if(r1) r1.onchange=()=>{H.showR=r1.checked;req();};
  const r2=document.getElementById('hP'); if(r2) r2.onchange=()=>{H.showPts=r2.checked;req();};
}
function heatLegend(){
  const H=S.hm, it=[];
  it.push(`<div><span class="lg"><i style="width:10px;height:10px;border-radius:50%;background:#4a76bd"></i></span>文理／英文補習班位置</div>`);
  if(H.st>=2) it.push(`<div style="gap:6px"><span style="width:24px;flex:none">低</span><span class="grad"></span><span>高</span></div><div style="padding-left:32px;margin-top:-4px">補習班密度</div>`);
  if(H.st===3) it.push(`<div><span class="lg"><i style="width:12px;height:12px;border-radius:50%;background:${COL.es}"></i></span>國小位置</div>`);
  return `<div class="legend"><div class="t">圖例</div>${it.join('')}</div>`;
}
function heatTools(){
  const H=S.hm;
  tools.innerHTML=`<div class="seg" id="hTool"><button data-t="view" aria-pressed="${H.tool==='view'}">${H.st>=2?'查詢密度':'檢視'}</button><button data-t="add" aria-pressed="${H.tool==='add'}">新增補習班</button><button data-t="del" aria-pressed="${H.tool==='del'}">刪除補習班</button></div>${H.ver>0?'<button class="chip" id="hReset">還原課本資料</button>':''}`;
  tools.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{H.tool=b.dataset.t;heatTools();});
  const r=document.getElementById('hReset'); if(r) r.onclick=()=>{H.pts=mkCram();H.ver=0;H.probe=null;HC=null;renderPanel();heatTools();req();};
}
function heatClick(p){
  const H=S.hm;
  if(H.tool==='add'){ if(!inCity(p.x,p.y)){toast('補習班要放在嘉義市範圍內');return;} H.pts.push({x:p.x,y:p.y});H.ver++;H.k=1;renderPanel();heatTools();req();return; }
  if(H.tool==='del'){ let b=-1,bd=1e9;H.pts.forEach((s,i)=>{const d=Math.hypot(s.x-p.x,s.y-p.y)*sc;if(d<bd){bd=d;b=i;}}); if(bd<=10){H.pts.splice(b,1);H.ver++;H.k=1;renderPanel();heatTools();req();} else toast('點在補習班上才能刪除'); return; }
  if(H.st>=2){H.probe=inCity(p.x,p.y)?p:null;renderPanel();req();}
}

/* ---------- 工具列、切換 ---------- */
const tools=document.getElementById('maptools');
function renderTools(){
  if(S.mode==='heat'){heatTools();return;}
  if(S.mode==='explain'&&S.step<4&&edited(S.pts)){
    tools.innerHTML=`<button class="chip" id="resetPts">還原課本資料</button>`;
    document.getElementById('resetPts').onclick=()=>{S.pts=mk(S.v);S.cmp[S.v]=mk(S.v);S.sel=null;renderPanel();renderTools();req();};
  } else tools.innerHTML='';
}
function setVar(v,silent){
  S.v=v; S.pts=mk(v); S.sel=null; S.done2=false; S.done3=false; S.a2=0; S.a3=0;
  document.querySelectorAll('#varSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));
  if(!silent){renderPanel();renderTools();req();}
}
document.querySelectorAll('#varSeg button').forEach(b=>b.onclick=()=>{
  if(S.mode==='heat'){toast('熱區地圖使用補習班資料');return;}
  if(S.mode==='challenge'&&S.ch.lv===2){toast('第 2 關由任務決定資料');return;}
  if(S.mode==='explain'&&S.step===4){toast('第 4 步同時比較國小與高中');return;}
  setVar(b.dataset.v); if(S.mode==='challenge'){S.ch.guess=null;S.ch.revealed=false;renderPanel();}
});
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.m; document.querySelectorAll('#modeSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  S.sel=null; if(S.mode==='challenge'){S.ch.guess=null;S.ch.revealed=false; if(S.ch.lv===2)loadTask(S.ch.task); else setVar(S.v,true);}
  else setVar(S.v,true);
  document.querySelectorAll('#varSeg button').forEach(x=>x.disabled=S.mode==='heat');
  document.getElementById('srcNote').textContent=S.mode==='heat'?'補習班位置依課本圖 2-34 判讀':'學校位置依課本圖 2-33 判讀；座標原點設在嘉義市西南角';
  renderPanel(); renderTools(); req();
});
document.getElementById('optGrid').onchange=e=>{S.showGrid=e.target.checked;req();};
document.getElementById('optNum').onchange=e=>{S.showNum=e.target.checked;req();};
new ResizeObserver(()=>resize()).observe(box);
renderPanel(); renderTools(); resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw());
</script>

</body>
</html>
