<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中地理論・西貢開店大亨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
/* Layout: 左邊大地圖（大屏投影看得清楚）＋右側說明／操作欄；講解模式底部有步驟列。配色：都市夜景紫（人文主題色）為主色，三種商品用綠、橘、紅。 */
:root{
  --bg:#EDEFF3; --panel:#FFFFFF; --ink:#1A2130; --muted:#586274; --line:#CBD1DB; --soft:#E3E6ED;
  --accent:#6B4E8C; --accent-fg:#FFFFFF;
  --plain:#F3EFE3; --plain-dot:#C9BFA3;
  --d1:#EEE8F5; --d2:#D9C9EA; --d3:#B99DD7; --d4:#9271BE; --d5:#62419A; --nodata:#DDE1E8;
  --g-sm:#16866B; --g-hm:#D27200; --g-med:#C3283F;
  --t1:#D23B33; --t2:#2B68BF; --t3:#2C9149; --t4:#D97512; --t5:#C2408A; --t6:#7A5230;
  --sea:#C3DCEA; --water:#A9CDE3; --land-out:#E4E3DC; --land:#FAF9F5; --border:#8E97A8; --coast:#5E7F96;
  --ok:#1E7F45; --bad:#C3283F; --river:#2479B5;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","PMingLiU","Songti TC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121620; --panel:#1B2130; --ink:#E6EAF2; --muted:#9DA7BA; --line:#323B4E; --soft:#252D3E;
  --accent:#B399D6; --accent-fg:#16101F;
  --plain:#2A2820; --plain-dot:#5A5442;
  --d1:#252037; --d2:#3A2D58; --d3:#5C4386; --d4:#8963B8; --d5:#C2A6E8; --nodata:#2A3040;
  --g-sm:#3CC59E; --g-hm:#F2A13B; --g-med:#F06478;
  --t1:#F0675F; --t2:#5F9BEB; --t3:#58C47A; --t4:#F09A3E; --t5:#EE7BBE; --t6:#C9976A;
  --sea:#142838; --water:#1F4560; --land-out:#1C2029; --land:#262C38; --border:#6B7487; --coast:#5B87A8; --t5:#EE7BBE; --t6:#C9976A;
  --sea:#142838; --water:#1F4560; --land-out:#1C2029; --land:#262C38; --border:#6B7487; --coast:#5B87A8;
  --ok:#57C987; --bad:#F06478; --river:#5DB3EA; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121620; --panel:#1B2130; --ink:#E6EAF2; --muted:#9DA7BA; --line:#323B4E; --soft:#252D3E;
  --accent:#B399D6; --accent-fg:#16101F;
  --plain:#2A2820; --plain-dot:#5A5442;
  --d1:#252037; --d2:#3A2D58; --d3:#5C4386; --d4:#8963B8; --d5:#C2A6E8; --nodata:#2A3040;
  --g-sm:#3CC59E; --g-hm:#F2A13B; --g-med:#F06478;
  --t1:#F0675F; --t2:#5F9BEB; --t3:#58C47A; --t4:#F09A3E;
  --ok:#57C987; --bad:#F06478; --river:#5DB3EA; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
kbd{font-family:inherit;font-size:13px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,p{margin:0}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-inline:clamp(16px,2vw,32px);padding-block:12px;max-width:1700px;margin-inline:auto}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,2.6vw,40px);letter-spacing:.06em;line-height:1.1}
.brand .sub{color:var(--muted);font-size:15px}
.modes{display:inline-flex;border:2px solid var(--accent);border-radius:10px;overflow:hidden}
.modes button{border:0;background:transparent;padding:7px 18px;font-weight:700;font-size:16px}
.modes button+button{border-left:2px solid var(--accent)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:clamp(12px,1.6vw,24px);min-height:0}
.mapcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;min-height:0;min-width:0}
.mapbox{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.mapin{position:relative;touch-action:none}
.mapin canvas,.mapin svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapin svg{overflow:hidden}
.lyr{pointer-events:none}
.mapctl{position:absolute;left:8px;top:8px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mapctl button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;min-width:40px;height:38px;padding:0 10px;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgb(0 0 0 / .08)}
.mapctl #dens[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.mapctl #dens[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.mapin.grab{cursor:grab}.mapin.grabbing{cursor:grabbing}
/* 商品等級分類板 */
.board{position:absolute;inset:0;overflow:auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;padding:4px}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--panel)}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:0}
.bin{border:3px solid var(--c);border-radius:14px;background:color-mix(in srgb,var(--c) 7%,var(--panel));display:flex;flex-direction:column;gap:8px;padding:10px;min-height:0;overflow:auto}
.bin h3{font-family:var(--serif);font-size:clamp(20px,1.8vw,28px);color:var(--c);display:flex;align-items:center;gap:8px}
.bin h3 small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500}
.bin.over{background:color-mix(in srgb,var(--c) 22%,var(--panel))}
.bin .slot{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;flex:1}
.card{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;font-size:clamp(16px,1.4vw,21px);cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:6px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.card.ok{border-color:var(--ok);color:var(--ok)}.card.bad{border-color:var(--bad);color:var(--bad)}
.card.drag{position:fixed;z-index:20;pointer-events:none;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.score.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:14px;color:var(--muted);justify-content:center}
.legend .ramp{display:inline-flex;align-items:center;gap:0}
.legend .ramp i{display:inline-block;width:26px;height:12px}
.legend .ramp span{font-variant-numeric:tabular-nums;margin-inline:5px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.45;box-shadow:0 4px 14px rgb(0 0 0 / .15);white-space:nowrap;z-index:3}
.tip b{font-size:15px}

.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.side h2{font-family:var(--serif);font-weight:700;font-size:clamp(23px,2vw,30px);line-height:1.3;text-wrap:balance}
.side p{max-width:34em}
.side b.hl{color:var(--accent)}
.def{display:grid;gap:8px}
.def div{border-left:4px solid var(--c,var(--accent));padding:2px 0 2px 12px}
.def dt,.def strong{font-weight:700}
.ctrl{display:grid;gap:10px}
.ctrl label.lab{font-size:14px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:transparent;padding:6px 13px;font-weight:500;font-size:15px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700}
.seg button .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.readout{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums;align-items:baseline}
.readout dt{color:var(--muted);font-size:15px}
.readout dd{margin:0;font-weight:700;font-size:19px}
.verdict{border-radius:10px;padding:10px 14px;font-weight:700;font-size:19px;display:flex;gap:10px;align-items:center}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.verdict small{display:block;font-weight:500;font-size:15px;color:var(--ink)}
.note{font-size:14px;color:var(--muted)}
.btn{border:2px solid var(--ink);background:transparent;border-radius:8px;padding:6px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
table.tb{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb thead th{font-size:13px;color:var(--muted);font-weight:700}
.tb td.num,.tb th.num{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);border-radius:999px;padding:4px 14px;background:transparent;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--c);color:#fff}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;font-weight:700;flex:none}

/* steps footer */
.foot{display:flex;align-items:center;gap:12px}
.foot .dots{display:flex;gap:8px;flex:1;justify-content:center}
.foot .dots button{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 14px;font-size:14px}
.foot .dots button[aria-current="step"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.foot .hint{font-size:13px;color:var(--muted)}

/* game */
.levels{display:flex;gap:6px;flex-wrap:wrap}
.levels button{border:1.5px solid var(--line);background:var(--soft);border-radius:8px;padding:4px 12px;font-weight:700;font-size:15px}
.levels button[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.levels button.done::after{content:" ✓";color:var(--ok)}
.levels button.done[aria-current="true"]::after{color:inherit}
.goal{border:2px dashed var(--accent);border-radius:10px;padding:10px 14px;font-weight:700}
.stores{display:grid;gap:6px}
.store{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.store .bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:3px}
.store .bar i{display:block;height:100%;background:var(--c)}
.store .st{font-weight:700;white-space:nowrap}
.store .st.ok{color:var(--ok)} .store .st.bad{color:var(--bad)}
.banner{border-radius:12px;padding:12px 16px;background:color-mix(in srgb,var(--ok) 15%,transparent);border:2px solid var(--ok)}
.banner b{color:var(--ok);font-size:20px}
.turn{border-radius:12px;padding:12px 16px;color:#fff;background:color-mix(in srgb,var(--c) 80%,#000);display:grid;gap:2px}
.turn .big{font-size:clamp(22px,2vw,30px);font-weight:900;line-height:1.25}
.turn .meta{display:flex;justify-content:space-between;gap:10px;font-weight:700;opacity:.95}
.timer{font-variant-numeric:tabular-nums}
.score{display:grid;gap:6px}
.score .t{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--soft);font-variant-numeric:tabular-nums}
.score .t.now{outline:3px solid var(--c)}
.score .t .pts{font-size:22px;font-weight:900}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:999px;padding:6px 18px;font-weight:700;z-index:4;pointer-events:none;transition:opacity .3s}
.toast[hidden]{display:none}
ol.qs{margin:0;padding-left:1.3em;display:grid;gap:6px}

@media (max-width:900px){
  .app{height:auto;grid-template-rows:auto auto auto}
  .stage{grid-template-columns:minmax(0,1fr)}
  .mapbox{height:min(78vh,calc((100vw - 32px)*1.19))}
  .foot .hint{display:none}
  .foot .dots button{padding:3px 12px}
  .bins{grid-template-columns:minmax(0,1fr)}
  .foot .dots .t{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>中地理論</h1>
      <span class="sub">商閾、商品圈與市場區｜以胡志明市為例</span>
    </div>
    <div class="modes" role="group" aria-label="模式">
      <button type="button" id="mLearn" aria-pressed="true">講解</button>
      <button type="button" id="mSolo" aria-pressed="false">個人挑戰</button>
      <button type="button" id="mTeam" aria-pressed="false">分組對戰</button>
    </div>
  </header>

  <main class="stage">
    <section class="mapcol">
      <div class="mapbox" id="mapbox">
        <div class="board" id="board" hidden></div>
        <div class="mapin" id="mapin">
          <svg id="base" class="lyr" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
          <canvas id="cv"></canvas>
          <svg id="top" class="lyr" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
          <svg id="ov" xmlns="http://www.w3.org/2000/svg" aria-label="地圖"></svg>
          <div class="tip" id="tip" hidden></div>
          <div class="toast" id="toast" hidden></div>
            <div class="mapctl" id="mapctl">
          <button type="button" id="zin" aria-label="放大">＋</button>
          <button type="button" id="zout" aria-label="縮小">－</button>
          <button type="button" id="zreset">重設</button>
          <button type="button" id="dens" aria-pressed="true">人口密度</button>
        </div>

        </div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="side" id="side" aria-live="polite"></aside>
  </main>

  <nav class="foot" id="foot">
    <button class="btn" id="prev" type="button">上一步</button>
    <div class="dots" id="dots"></div>
    <span class="hint">← → 切換步驟</span>
    <button class="btn primary" id="next" type="button">下一步</button>
  </nav>
</div>

/* ===== 中地理論核心計算（講解、遊戲共用） ===== */
const SIM = (function(){
  const G = HCMC, CELL = G.cell, W = G.W, H = G.H;
  const GOODS = {
    sm:  {key:'sm', name:'超市',     order:'低階', range:3,  thr:150000,  color:'--g-sm'},
    hm:  {key:'hm', name:'大賣場',   order:'中階', range:8,  thr:700000,  color:'--g-hm'},
    med: {key:'med',name:'醫學中心', order:'高階', range:20, thr:2500000, color:'--g-med'}
  };
  // 過河要多走的距離（km，模型設定值）
  const CROSS = {'0-1':2, '1-0':2, '0-2':6, '2-0':6, '1-2':8, '2-1':8};

  // cells
  const cells = []; const at = new Int32Array(W*H).fill(-1);
  let total = 0;
  for (let j=0;j<H;j++) for (let i=0;i<W;i++){
    const ch = G.grid[j].charCodeAt(i); if (ch===46) continue;
    const k = ch-97, d = G.dists[k];
    const c = {i, j, x:(i+.5)*CELL, y:(j+.5)*CELL, d:k, side:d.side, pReal: d.pop/d.cells};
    at[j*W+i] = cells.length; cells.push(c); total += c.pReal;
  }
  const pUni = total / cells.length;
  cells.forEach(c => c.pUni = pUni);
  const N = cells.length;

  function cellAt(x, y){
    const i = Math.floor(x/CELL), j = Math.floor(y/CELL);
    if (i<0||j<0||i>=W||j>=H) return -1;
    return at[j*W+i];
  }
  function dist(c, s, river){
    let d = Math.hypot(c.x-s.x, c.y-s.y);
    if (river && c.side!==s.side) d += CROSS[c.side+'-'+s.side];
    return d;
  }
  function popOf(c, mode){ return mode==='uni' ? c.pUni : c.pReal; }

  // 每個格子歸給「商品圈內、最近的、營業中」的店
  function assign(stores, opt){
    const owner = new Int16Array(N).fill(-1), dmin = new Float32Array(N).fill(1e9);
    const cust = stores.map(()=>0);
    stores.forEach((s, si)=>{
      if (!s.open) return;
      const g = GOODS[s.good], R = g.range, ri = Math.ceil(R/CELL)+1;
      const ci = Math.floor(s.x/CELL), cj = Math.floor(s.y/CELL);
      for (let j=Math.max(0,cj-ri); j<=Math.min(H-1,cj+ri); j++)
        for (let i=Math.max(0,ci-ri); i<=Math.min(W-1,ci+ri); i++){
          const k = at[j*W+i]; if (k<0) continue;
          const d = dist(cells[k], s, opt.river);
          if (d<=R && d<dmin[k]){ dmin[k]=d; owner[k]=si; }
        }
    });
    for (let k=0;k<N;k++) if (owner[k]>=0) cust[owner[k]] += popOf(cells[k], opt.pop);
    return {owner, cust};
  }
  // 反覆讓「最撐不住的店」倒閉，直到剩下的店都達到商閾
  function settle(stores, opt){
    stores.forEach(s => s.open = true);
    let r;
    for(;;){
      r = assign(stores, opt);
      let worst=-1, wr=1;
      stores.forEach((s,si)=>{ if(!s.open) return; const q=r.cust[si]/GOODS[s.good].thr; if(q<wr){wr=q; worst=si;} });
      if (worst<0) break;
      stores[worst].lastCust = r.cust[worst]; stores[worst].open = false;
    }
    stores.forEach((s,si)=>{ s.cust=r.cust[si]; });
    return r;
  }
  // 單一店家：商品圈內人口、要湊滿商閾需要的半徑
  function probe(x, y, good, opt){
    const s = {x, y, side:0}; const k0 = cellAt(x,y); if (k0>=0) s.side = cells[k0].side;
    const g = GOODS[good], arr = [];
    for (let k=0;k<N;k++){ const c=cells[k]; const d=dist(c,s,opt.river); if (d<=40) arr.push([d, popOf(c,opt.pop)]); }
    arr.sort((a,b)=>a[0]-b[0]);
    let acc=0, rThr=null, inRange=0;
    for (const [d,p] of arr){ acc+=p; if (d<=opt.range) inRange=acc; if (rThr===null && acc>=g.thr) rThr=d; }
    return {inRange, rThr};
  }
  // 自動開店：每次挑「尚未被服務的人口」最多的位置，直到湊不到商閾
  function autoPlace(good, opt){
    const g = GOODS[good], R = g.range, ri = Math.ceil(R/CELL)+1;
    const served = new Uint8Array(N), stores = [];
    const cand = cells.filter(c => (c.i%2===0 && c.j%2===0));
    for (let guard=0; guard<80; guard++){
      let best=null, bv=0;
      for (const c of cand){
        let v=0;
        for (let j=Math.max(0,c.j-ri); j<=Math.min(H-1,c.j+ri); j++)
          for (let i=Math.max(0,c.i-ri); i<=Math.min(W-1,c.i+ri); i++){
            const k=at[j*W+i]; if(k<0||served[k]) continue;
            if (dist(cells[k], c, opt.river)<=R) v+=popOf(cells[k],opt.pop);
          }
        if (v>bv){bv=v; best=c;}
      }
      if (!best || bv<g.thr) break;
      const s={x:best.x, y:best.y, side:best.side, good};
      stores.push(s);
      // 只把「湊滿商閾所需範圍」標成已服務，讓店與店可以靠近
      const near=[];
      for (let j=Math.max(0,best.j-ri); j<=Math.min(H-1,best.j+ri); j++)
        for (let i=Math.max(0,best.i-ri); i<=Math.min(W-1,best.i+ri); i++){
          const k=at[j*W+i]; if(k<0||served[k]) continue;
          const d=dist(cells[k],s,opt.river); if(d<=R) near.push([d,k]);
        }
      near.sort((a,b)=>a[0]-b[0]); let acc=0;
      for (const [d,k] of near){ served[k]=1; acc+=popOf(cells[k],opt.pop); if(acc>=g.thr*1.05) break; }
    }
    settle(stores, opt);

(function(){

    drag.el.style.left=(e.clientX-drag.ox)+'px'; drag.el.style.top=(e.clientY-drag.oy)+'px';
    b.querySelectorAll('.bin').forEach(x=>x.classList.remove('over'));

];
function latt(a,m){
  const pts=[],cx=G.w/2,cy=G.h/2;
  for(let j=-14;j<=14;j++)for(let i=-14;i<=14;i++){
    if(m>1&&(((i%m)+m)%m||((j%m)+m)%m)) continue;
    const x=cx+a*(i+j/2), y=cy+a*(R3/2)*j;
    if(x>-a&&x<G.w+a&&y>-a&&y<G.h+a) pts.push({x,y,i,j,inside:x>=0&&x<=G.w&&y>=0&&y<=G.h});
  }
  return pts;
}
function hexPath(x,y,R){let d='';for(let k=0;k<6;k++){const an=Math.PI/180*(30+60*k);d+=(k?'L':'M')+(x+R*Math.cos(an)).toFixed(2)+' '+(y+R*Math.sin(an)).toFixed(2);}return d+'Z';}

    pts.forEach(p=>el('circle',{cx:p.x,cy:p.y,r:a/R3,fill:'none',stroke:'var(--muted)','stroke-width':1.2,'stroke-dasharray':'4 4','vector-effect':'non-scaling-stroke'},lay));
  } else pts.forEach(p=>el('circle',{cx:p.x,cy:p.y,r:R,fill:`var(${g.color})`,'fill-opacity':.2,stroke:`var(${g.color})`,'stroke-width':2.5,'vector-effect':'non-scaling-stroke'},lay));
  pts.forEach(p=>marker(lay,p.x,p.y,'sm',{small:L2.stage>0}));

  if(L2.stage===1){const gx=cx+a/2, gy=cy+a*R3/6; el('circle',{cx:gx,cy:gy,r:px(6),fill:'var(--bad)'},ov); label(ov,gx,gy+px(22),'空白：沒有店服務',{fill:'var(--bad)'});}

function storeRow(s,name){

    <span class="st ${s.open?'ok':'bad'}">${s.open?'營業中':'倒閉'}</span></div>`;

function hitStore(list,p){const r=px(18);let best=-1,bd=r;list.forEach((s,i)=>{const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<bd){bd=d;best=i;}});return best;}
function soloClick(p){
  const L=LEVELS[SOLO.lv], hit=hitStore(SOLO.mine,p);

  if(SOLO.mine.length>=L.n){toast('店已經開完了，點你的店可以收掉重開');return;}
  SOLO.mine.push({x:p.x,y:p.y,side:S.cells[k].side,good:L.good}); render();
}

/* ===================== 分組對戰 ===================== */
const ROUNDS=['sm','sm','hm','med'];
const TEAM={phase:'setup',n:4,sec:30,r:0,t:0,stores:[],hist:[],left:0,timer:0,view:'sm',paused:false,_placed:false};
function teamPlace(p){
  if(TEAM.phase!=='play') return;
  const k=S.cellAt(p.x,p.y); if(k<0){toast('請點在胡志明市範圍內');return;}
  const good=ROUNDS[TEAM.r], before=TEAM.stores.filter(s=>s.good===good&&s.open);
  const s={x:p.x,y:p.y,side:S.cells[k].side,good,team:TEAM.t}; TEAM.stores.push(s); TEAM._placed=true;
  settleAll(TEAM.stores,GAME_OPT);
  const killed=before.filter(x=>!x.open);
  if(!s.open) toast(`${TEAMS[s.team].name}的${GOODS[good].name}撐不下去，倒閉了！`);
  else if(killed.length) toast(`${[...new Set(killed.map(x=>TEAMS[x.team].name))].join('、')}的${GOODS[good].name}被擠倒了！`);
  advance();
}
function advance(){
  TEAM.hist.push({r:TEAM.r,t:TEAM.t,n:TEAM.stores.length-(TEAM._placed?1:0)}); TEAM._placed=false;
  TEAM.t++; if(TEAM.t>=TEAM.n){TEAM.t=0;TEAM.r++;}
  if(TEAM.r>=ROUNDS.length){TEAM.phase='end';stopTimer();}
  else {TEAM.view=ROUNDS[TEAM.r]; TEAM.left=TEAM.sec;}
  render();
}
function stopTimer(){clearInterval(TEAM.timer);TEAM.timer=0;}
function startTimer(){stopTimer(); if(!TEAM.sec) return; TEAM.left=TEAM.sec;
  TEAM.timer=setInterval(()=>{ if(TEAM.phase!=='play'||st.mode!=='team'||TEAM.paused) return; TEAM.left--;
    const e=$('tm'); if(e) e.textContent=TEAM.left+' 秒';
    if(TEAM.left<=0){toast(`時間到，${TEAMS[TEAM.t].name}這回合跳過`); advance();} },1000);}
function teamScores(){return TEAMS.slice(0,TEAM.n).map((T,i)=>{const mine=TEAM.stores.filter(s=>s.team===i);
  return {i,name:T.name,c:T.c,pts:mine.reduce((a,s)=>a+points(s),0),open:mine.filter(s=>s.open).length,all:mine.length};});}
function drawTeam(){

  side(`

  </div>

  <div class="score${two}">${sc.map(t=>`<div class="t ${t.i===TEAM.t?'now':''}" style="--c:var(${t.c})"><span class="sw" style="background:var(${t.c})"></span><b>${esc(t.name)}</b><span class="note">${t.open}／${t.all} 家</span><span class="pts">${t.pts}</span></div>`).join('')}</div>

    const uni=st.mode==='learn'&&st.step===4&&L4.pop==='uni';
    if(M.dens) h=uni?`<span class="k"><span class="sw" style="background:var(--d3);border-radius:2px"></span>人口平均分布：每 km² 約 ${Math.round(UNI_DENS).toLocaleString('zh-TW')} 人</span>`
      :`<span>人口密度（人/km²）</span><span class="ramp">${[1,2,3,4,5].map(i=>`<i style="background:var(--d${i})"></i>`).join('')}</span><span class="note">&lt;1,000 → 30,000 以上</span>`;
    h+=`<span class="k"><span class="sw" style="background:var(--water);border-radius:2px"></span>河流、水域</span>${M.s>=16?`<span class="k"><span style="display:inline-block;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)"></span>地標</span>`:'<span class="note">放大後會顯示地標</span>'}`;
    if(riverOn) h+=`<span class="k"><span style="display:inline-block;width:22px;border-top:3px dashed var(--river)"></span>過河要多走</span>`;
  }
  $('legend').innerHTML=h;
}
function render(){
  const k=kind();
  [baseSvg,topSvg].forEach(s=>s.style.display=k==='map'?'':'none');
  cv.style.display=k==='board'?'none':''; ov.style.display=k==='board'?'none':'';
  $('board').hidden=k!=='board'; $('mapctl').hidden=k!=='map'; mapin.style.visibility=k==='board'?'hidden':'';
  mapin.classList.toggle('grab',k==='map');
  if(k!=='map' && (M.V.w!==G.w)){M.V={...FULL}; applyView();}
  if(st.mode==='learn') [drawL1,drawGrade,drawL2,drawL3,drawL4][st.step]();
  else if(st.mode==='solo') drawSolo();
  else drawTeam();
  legend();
  $('foot').hidden=st.mode!=='learn';
  $('dots').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',i===st.step&&st.mode==='learn'?'step':'false'));
  $('prev').disabled=st.step===0; $('next').disabled=st.step===STEPS.length-1;
}
function setMode(m){
  st.mode=m; ['mLearn','mSolo','mTeam'].forEach((id,i)=>$(id).setAttribute('aria-pressed',['learn','solo','team'][i]===m));
  lastSide=''; $('side').scrollTop=0; requestAnimationFrame(fit); render();
}
function go(i){st.step=Math.max(0,Math.min(STEPS.length-1,i)); if(st.step===2&&!L2.r) L2.r=L2STAGES[L2.stage].r; lastSide=''; $('side').scrollTop=0; render();}
$('dots').innerHTML=STEPS.map((t,i)=>`<button type="button" data-i="${i}" aria-label="${i+1} ${t}">${i+1}<span class="t"> ${t}</span></button>`).join('');
$('dots').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
$('prev').onclick=()=>go(st.step-1); $('next').onclick=()=>go(st.step+1);
$('mLearn').onclick=()=>setMode('learn'); $('mSolo').onclick=()=>setMode('solo'); $('mTeam').onclick=()=>setMode('team');
document.addEventListener('keydown',e=>{
  if(st.mode!=='learn'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(st.step+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(st.step-1);}
  else if(st.step===2&&/^[1-4]$/.test(e.key)) setL2(+e.key-1);
});
// 地圖按鈕
$('zin').onclick=()=>{const V=M.V; zoomAt(V.x+V.w/2,V.y+V.h/2,1/1.6);};
$('zout').onclick=()=>{const V=M.V; zoomAt(V.x+V.w/2,V.y+V.h/2,1.6);};
$('zreset').onclick=()=>setView(0,0,G.w);
$('dens').onclick=()=>{M.dens=!M.dens; $('dens').setAttribute('aria-pressed',M.dens); render();};

/* ---------- 指標操作：點擊、拖曳店家、平移、滾輪與雙指縮放 ---------- */
const ptrs=new Map(); let gest=null, raf=0, pend=null;
ov.addEventListener('wheel',e=>{
  if(kind()!=='map') return; e.preventDefault();
  const p=toKm(e.clientX,e.clientY), dy=e.deltaMode===1?e.deltaY*30:e.deltaY;
  zoomAt(p.x,p.y,Math.exp(dy*0.0016));
},{passive:false});
ov.addEventListener('pointerdown',e=>{
  try{ov.setPointerCapture(e.pointerId);}catch(_){} ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const k=kind();
  if(ptrs.size===2&&k==='map'){
    const [a,b]=[...ptrs.values()], mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    gest={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),anchor:toKm(mid.x,mid.y),V0:{...M.V},s0:M.s};
    hideTip(); return;
  }
  if(ptrs.size>2) return;
  const p=toKm(e.clientX,e.clientY);
  if(st.mode==='learn'&&st.step===0&&Math.hypot(p.x-L1.x,p.y-L1.y)<px(24)) gest={type:'store'};
  else gest={type:'maybe',sx:e.clientX,sy:e.clientY,V0:{...M.V},p};
});
ov.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){ showTip(toKm(e.clientX,e.clientY)); return; }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!gest) return;
  if(gest.type==='pinch'&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const nw=gest.V0.w*gest.d0/Math.max(10,d), r=mapin.getBoundingClientRect(), ns=M.s0*G.w/Math.max(G.w/14,Math.min(G.w,nw));
    setView(gest.anchor.x-(mid.x-r.left)/ns, gest.anchor.y-(mid.y-r.top)/ns, nw); return;
  }
  if(gest.type==='store'){ const p=toKm(e.clientX,e.clientY); if(S.cellAt(p.x,p.y)<0) return; pend=p;
    if(!raf) raf=requestAnimationFrame(()=>{raf=0; if(pend){L1.x=pend.x;L1.y=pend.y;render();}}); hideTip(); return; }
  if(gest.type==='maybe'&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>6&&kind()==='map'){ gest.type='pan'; mapin.classList.add('grabbing'); hideTip(); }
  if(gest.type==='pan'){ const V=gest.V0; setView(V.x-(e.clientX-gest.sx)/M.s, V.y-(e.clientY-gest.sy)/M.s, V.w); }
});
function up(e){
  const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId); mapin.classList.remove('grabbing');
  if(!had||!gest) return;
  if(gest.type==='pinch'){ if(ptrs.size===0) gest=null; return; }
  if(gest.type==='maybe'&&e.type==='pointerup'){
    const p=gest.p;
    if(st.mode==='learn'&&st.step===0){ if(S.cellAt(p.x,p.y)>=0){L1.x=p.x;L1.y=p.y;render();} }
    else if(st.mode==='solo') soloClick(p);
    else if(st.mode==='team') teamPlace(p);
  }
  gest=null;
}
ov.addEventListener('pointerup',up); ov.addEventListener('pointercancel',up);
ov.addEventListener('pointerleave',e=>{ if(!ptrs.size) hideTip(); });
function hideTip(){tip.hidden=true;}
function showTip(p){
  if(kind()!=='map'){hideTip();return;}
  const k=S.cellAt(p.x,p.y); if(k<0){hideTip();return;}
  const d=G.dists[S.cells[k].d];
  tip.innerHTML=`<b>${esc(d.short)}</b><br>人口 ${wan(d.pop)}人<br>密度 ${Math.round(DENS[S.cells[k].d]).toLocaleString('zh-TW')} 人/km²`;
  tip.hidden=false;
  const W=mapin.clientWidth, tw=tip.offsetWidth;
  tip.style.left=Math.max(4,Math.min(W-tw-4,p.cx+14))+'px'; tip.style.top=Math.max(4,p.cy-70)+'px';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{lastSide='';render();});
new MutationObserver(()=>{lastSide='';render();}).observe(root,{attributes:true,attributeFilter:['data-theme']});

L2.r=L2STAGES[0].r;
const h=(location.hash||'').slice(1); if(h==='solo'||h==='team') st.mode=h;
setMode(st.mode);
fit();
})();

</script>
