<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}</style></head><body><title>資料分級比較器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 課本圖2-48 的「長條圖在上、面量圖在下」三欄；上機時左大圖、右側操作區。配色取自課本（橘色單色漸層、淺綠底、綠色標題）。 */
:root{
  --bg:#f1f4ed; --card:#ffffff; --fg:#1d2a1d; --muted:#586657; --line:#cfd8c9; --soft:#e6edde;
  --brand:#3f8f3a; --brand-fg:#ffffff; --hl:#161616; --gray:#d9ddd4; --mapline:#7d8a78;
  --ok:#2e7d32; --warn:#b3261e; --focus:#d97b21;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141914; --card:#1d241d; --fg:#e8eee5; --muted:#a3b1a1; --line:#394539; --soft:#273127;
  --brand:#6dbf66; --brand-fg:#0e190d; --hl:#fafafa; --gray:#3a423a; --mapline:#0f130f;
  --ok:#81c784; --warn:#ff8a80; --focus:#f0a050; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141914; --card:#1d241d; --fg:#e8eee5; --muted:#a3b1a1; --line:#394539; --soft:#273127;
  --brand:#6dbf66; --brand-fg:#0e190d; --hl:#fafafa; --gray:#3a423a; --mapline:#0f130f;
  --ok:#81c784; --warn:#ff8a80; --focus:#f0a050; color-scheme:dark;}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:14px 40px}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid var(--brand)}
.brand{min-width:0}
.tag{display:inline-block;background:var(--brand);color:var(--brand-fg);font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:0 12px 12px 0;margin-bottom:4px}
h1{font-size:26px;line-height:1.25;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px}
.seg{display:inline-flex;border:1.5px solid var(--brand);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);font-weight:700}
.seg button+button{border-left:1.5px solid var(--brand)}
.time{font-size:12px;color:var(--muted);margin-left:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stepcard{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:start}
.stepno{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.08em}
.stepcard h2{font-size:21px;line-height:1.3}
.stext{margin-top:6px;max-width:78ch}
.stext p+p{margin-top:6px}
.stext b{font-weight:700}
.nav{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}
.btn{border:1.5px solid var(--brand);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 14px;font-weight:500}
.btn.pri{background:var(--brand);color:var(--brand-fg);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:3px 10px;font-size:13px}
.dots{display:flex;gap:6px;justify-content:center}
.dots button{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--brand);background:transparent;padding:0}
.dots button[aria-current="step"]{background:var(--brand)}
.panels{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;transition:opacity .25s}
.pn.off{opacity:.55}
.pn.focus{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
.pn header{display:flex;align-items:center;gap:8px}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-fg);font-weight:700}
.pn h3{font-size:17px}
.pdesc{font-size:13px;color:var(--muted);margin:4px 0 6px;min-height:2.9em}
svg.bars{width:100%;height:auto;display:block}
svg.bars .grid{stroke:var(--line);stroke-width:.6}
svg.bars .ax,svg.bars .nm,svg.bars .un{fill:var(--muted);font-size:8.5px;font-family:var(--font)}
svg.bars .sep{stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2}
.bar{stroke:var(--mapline);stroke-width:.4}
.bar.on,.dot.on{stroke:var(--hl);stroke-width:2}
.bar.hs{stroke:var(--hl);stroke-width:1.6}
.arrow{text-align:center;color:var(--brand);font-size:18px;line-height:1;margin:2px 0}
svg.map{width:100%;height:auto;display:block;max-height:560px}
.panels svg.map{max-height:44vh}
.panels svg.bars{max-height:22vh}
.cty{stroke:var(--mapline);stroke-width:.6;cursor:pointer}
.box{fill:none;stroke:var(--mapline);stroke-width:1}
.boxlab{fill:var(--muted);font-size:8px;font-family:var(--font)}
.mlab{fill:var(--hl);font-size:8px;font-family:var(--font);paint-order:stroke;stroke:var(--card);stroke-width:2.2px;stroke-linejoin:round;pointer-events:none}
.hit{fill:transparent;pointer-events:all;cursor:pointer}
.ov{stroke:var(--hl);stroke-width:2.4;pointer-events:none}
.hsu{stroke:var(--hl);stroke-width:1.8;stroke-dasharray:4 2.5;pointer-events:none}
.leg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:13px}
.leg li{display:grid;grid-template-columns:18px auto 1fr auto;gap:8px;align-items:center}
.leg i{display:block;width:18px;height:14px;border:1px solid var(--mapline)}
.leg .ct{color:var(--muted);font-variant-numeric:tabular-nums}
.leg .rg{font-variant-numeric:tabular-nums}
.leg .gno{font-weight:700;min-width:3em}
.none{color:var(--muted);font-size:13px;margin-top:8px}
.banner{margin-top:14px;background:var(--brand);color:var(--brand-fg);border-radius:10px;padding:12px 16px;font-size:19px;font-weight:700;text-wrap:balance}
.cmp{margin-top:10px;font-size:15px;min-height:1.6em}
.cmp b{font-weight:700}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:0 10px;margin:2px 4px 2px 0;font-size:14px;background:var(--soft)}
.lab{margin-top:14px;display:grid;grid-template-columns:minmax(300px,5fr) minmax(0,6fr);gap:14px;align-items:start}
.col{display:grid;gap:14px;min-width:0}
.maptitle{font-size:17px;font-weight:700;text-align:center;margin-bottom:4px;min-height:1.6em;text-wrap:balance}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field input[type=text],textarea{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:5px 10px}
textarea{width:100%;resize:vertical;min-height:64px}
.h4{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.h4 .acts{display:flex;gap:6px;flex-wrap:wrap}
svg.strip{width:100%;height:auto;display:block;touch-action:none}
svg.strip .ax{fill:var(--muted);font-size:9px;font-family:var(--font)}
svg.strip .axl{stroke:var(--muted);stroke-width:1}
svg.strip .cut{stroke:var(--hl);stroke-width:1.6}
svg.strip .cv{paint-order:stroke;stroke:var(--card);stroke-width:3px;fill:var(--fg);font-size:10px;font-weight:700;font-family:var(--font)}
svg.strip .grip{fill:var(--card);stroke:var(--hl);stroke-width:2;cursor:ew-resize}
svg.strip .gh{fill:transparent;cursor:ew-resize}
.dot{stroke:var(--mapline);stroke-width:.6}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700;white-space:nowrap}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
td input{width:5.2em;border:1.5px solid var(--brand);border-radius:6px;background:var(--card);padding:1px 6px;font-variant-numeric:tabular-nums}
td .sw{display:inline-block;width:14px;height:14px;border:1px solid var(--mapline);vertical-align:-2px;margin-right:6px}
td.names{font-size:13px;color:var(--muted)}
.warn{color:var(--warn);font-weight:700}
.okc{color:var(--ok);font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.hint li{margin:2px 0}
ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.tasks li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px;border:1.5px solid var(--line);border-radius:8px}
ul.tasks li.done{border-color:var(--ok);background:var(--soft)}
.chk{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);font-weight:700}
li.done .chk{background:var(--ok);border-color:var(--ok);color:var(--card)}
.sub2{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.sub2 button{border:1.5px solid var(--brand);background:var(--card);border-radius:999px;padding:3px 14px;font-weight:500}
.sub2 button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);font-weight:700}
.opt{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:8px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.opt.sel{border-color:var(--brand);background:var(--soft)}
.opt.done{border-color:var(--ok)}
.guess{margin-top:14px;display:grid;grid-template-columns:minmax(300px,5fr) minmax(0,6fr);gap:14px;align-items:start}
.gbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.gbtns .btn{flex:1;min-width:6em;padding:9px 12px;font-size:16px}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line)}
.fb.good{border-color:var(--ok)}
.fb.bad{border-color:var(--warn)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--hl);color:var(--bg);padding:5px 10px;border-radius:8px;font-size:13px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;max-width:240px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hl);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;display:none;z-index:30}
.fallback{width:100%;margin-top:8px}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}
@media (max-width:1000px){.panels{grid-template-columns:1fr}.lab,.guess{grid-template-columns:1fr}.stepcard{grid-template-columns:1fr}.nav{flex-direction:row;align-items:center;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){.pn{transition:none}}
</style>

</div>

function cls(v,cuts){let g=0;while(g<cuts.length&&r2(v)>cuts[g]+1e-9)g++;return g;}

function rangeText(cuts,g){const k=cuts.length+1;if(k===1)return'全部';
  if(g===0)return'≤ '+f2(cuts[0]);if(g===k-1)return'≥ '+f2(cuts[k-2]+0.01);return f2(cuts[g-1]+0.01)+' ～ '+f2(cuts[g]);}
function metrics(ds,cuts){const s=sortedNames(ds),g=groupsOf(ds,cuts),k=cuts.length+1,c=counts(ds,cuts);
  let within=0;for(let i=0;i<k;i++){const m=s.filter(n=>g[n]===i).map(n=>val(ds,n));if(m.length)within=Math.max(within,Math.max(...m)-Math.min(...m));}
  let cross=Infinity,pair=null;for(let i=1;i<s.length;i++)if(g[s[i]]!==g[s[i-1]]){const d=val(ds,s[i])-val(ds,s[i-1]);if(d<cross){cross=d;pair=[s[i-1],s[i]];}}
  return{c,empty:c.filter(x=>x===0).length,max:Math.max(...c),min:Math.min(...c),within,cross,pair};}
function windowInsight(ds,cuts){const s=sortedNames(ds),g=groupsOf(ds,cuts),thr=DS[ds].thr;let best=null;
  for(let i=0;i<s.length;i++){const v0=val(ds,s[i]),w=s.filter(n=>val(ds,n)>=v0-1e-9&&val(ds,n)<=v0+thr+1e-9);const gs=new Set(w.map(n=>g[n]));
    if(!best||gs.size>best.gs||(gs.size===best.gs&&w.length>best.w.length))best={w,gs:gs.size};}
  return best;}

const S={ds:'old',mode:'teach',step:0,sel:null,hover:null,chal:'guess',labels:false,

/* ---------- 繪圖元件 ---------- */
function barsSVG(ds,cuts,colored,hs){
  const s=sortedNames(ds),g=groupsOf(ds,cuts),k=cuts.length+1,col=colsFor(k),I=DS[ds];
  const W=372,H=186,ml=30,mr=6,mt=12,mb=42,bw=(W-ml-mr)/s.length,y=v=>mt+(H-mt-mb)*(1-v/I.ymax);
  let h=`<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${DS[ds].label}由小到大排序長條圖"><text class="un" x="2" y="8">(%)</text>`;
  for(let t=0;t<=I.ymax;t+=I.tick)h+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${ml-4}" y="${y(t)+3}" text-anchor="end">${t}</text>`;
  s.forEach((n,i)=>{const v=val(ds,n),x=ml+i*bw+1,fill=colored?col[g[n]]:'var(--gray)';
    h+=`<rect data-n="${n}" class="bar${hs&&hs.has(n)?' hs':''}" x="${x}" y="${y(v)}" width="${bw-2}" height="${y(0)-y(v)}" style="fill:${fill}"/>`;
    h+=[...n].map((ch,j)=>`<text class="nm" x="${x+(bw-2)/2}" y="${H-mb+11+j*10}" text-anchor="middle">${ch}</text>`).join('');
    if(colored&&i>0&&g[s[i]]!==g[s[i-1]])h+=`<line class="sep" x1="${ml+i*bw}" x2="${ml+i*bw}" y1="${mt}" y2="${H-mb}"/>`;});
  return h+'</svg>';
}
function mapSVG(fillFn,o){o=o||{};const hs=o.hs||new Set();
  let h=`<svg class="map" viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="臺灣各縣市面量圖">`;
  for(const[n,b]of Object.entries(MAP.boxes))h+=`<rect class="box" x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}"/><text class="boxlab" x="${b[0]}" y="${b[1]-3}">${n}${n==='連江縣'?'（馬祖）':''}</text>`;
  for(const n of NAMES)h+=`<use class="cty" href="#c-${n}" data-n="${n}" style="fill:${fillFn(n)}"/>`;
  const p=MAP.counties['澎湖縣'].c;h+=`<circle class="hit" data-n="澎湖縣" cx="${p[0]}" cy="${p[1]}" r="12"/>`;

  return h+`<use class="ov" href="" style="fill:none;display:none"/></svg>`;
}

   {t:'先看資料：這是同一份資料',h:`<p><b>${I.label}</b>共 22 個縣市，由小到大排好了：最小是 <b>${lo} ${f2(val(ds,lo))}%</b>，最大是 <b>${hi} ${f2(val(ds,hi))}%</b>。</p><p>問題來了：要把這 22 個數字分成 <b>5 組</b>、塗成 5 種顏色，該怎麼分？下面用三種分法來試。</p>`},
   {t:'① 等量分級：每組縣市一樣多',h:`<p>22 個縣市分成 5 組，每組放 <b>4～5 個縣市</b>（22 ÷ 5）。分界落在縣市和縣市之間。</p><p><b>缺點：</b>${wtxt}，這 ${win.w.length} 個縣市只差 ${range}%，卻被分到 <b>${win.gs} 個不同的組</b>（圖上虛線框）。數值很接近，顏色卻不一樣。</p>`,hs:{q:new Set(win.w)}},
   {t:'② 等距分級：每組寬度一樣',h:`<p>先算級距：（最大值 ${f2(st.max)} － 最小值 ${f2(st.min)}）÷ 5 ＝ <b>${f2(w)}%</b>，每組都一樣寬。</p><p>由低到高各組的縣市數：<b>${ce_c.join('、')}</b>。${empties.length?`<b>第 ${5-empties[0]} 組沒有任何縣市</b>，是空組。`:`最多的一組有 <b>${Math.max(...ce_c)}</b> 個縣市，最少的只有 <b>${Math.min(...ce_c)}</b> 個。`}資料擠在中間時，大部分縣市會變成同一種顏色，不容易看出彼此的差異。</p>`},
   {t:'③ 自訂分級：門檻由你決定',h:ds==='old'?`<p>以老年人口比例 <b>14～20%（高齡）</b>、<b>＞20%（超高齡）</b>為標準，只分 2 組，用來呈現臺灣「高齡」「超高齡」縣市的分布。</p><p>由低到高各組的縣市數：<b>${cc_c.join('、')}</b>。門檻有意義，地圖的主題就很清楚。</p>`:`<p>以<b>全國平均 2.6%</b> 為界，只分 2 組：低於平均、高於平均，用來看哪些縣市的新住民比例比全國高。</p><p>由低到高各組的縣市數：<b>${cc_c.join('、')}</b>。門檻有意義，地圖的主題就很清楚。</p>`},
   {t:'④ 三張圖放在一起比',h:`<p>資料完全相同，只有分級方式不同。用等量和等距比較，22 個縣市中有 <b>${diff} 個</b>被分到不同的組。<b>點任何一個縣市</b>（地圖或長條都可以），看它在三種分級裡各是第幾組。</p><div class="cmp" id="cmp"></div>`,banner:true}

const domain=ds=>{const st=stat(ds),step=ds==='old'?2:0.5;return[Math.floor(st.min/step)*step,Math.ceil(st.max/step)*step,step];};
function stripSVG(ds,cuts){
  const[lo,hi,step]=domain(ds),W=560,H=134,ml=26,mr=26,x=v=>ml+(v-lo)/(hi-lo)*(W-ml-mr),k=cuts.length+1,col=colsFor(k),g=groupsOf(ds,cuts);

  for(let i=0;i<k;i++)h+=`<rect x="${x(edges[i])}" y="28" width="${x(edges[i+1])-x(edges[i])}" height="64" style="fill:${col[i]};opacity:.35"/>`;

  for(let t=lo;t<=hi+1e-9;t+=step)h+=`<line class="axl" x1="${x(t)}" x2="${x(t)}" y1="92" y2="96"/><text class="ax" x="${x(t)}" y="106" text-anchor="middle">${+t.toFixed(1)}</text>`;
  const rows=[];sortedNames(ds).forEach(n=>{const px=x(val(ds,n));let r=0;while(rows[r]!==undefined&&px-rows[r]<9.5)r++;rows[r]=px;
    h+=`<circle class="dot" data-n="${n}" cx="${px}" cy="${86-r*10}" r="4.4" style="fill:${col[g[n]]}"/>`;});
  cuts.forEach((c,i)=>{h+=`<line class="cut" x1="${x(c)}" x2="${x(c)}" y1="14" y2="96"/><text class="cv" x="${x(c)}" y="${i%2?23:11}" text-anchor="middle">${f2(c)}</text>

function emphSide(){
  const ds=S.ds,c=S.cuts[ds],cur=S.emph[ds];
  return `<section class="card"><div class="h4">想強調什麼，就怎麼分</div>${EMPH[ds].map(o=>{const d=cur===o.k&&o.ok(c,ds);return `<div class="opt${cur===o.k?' sel':''}${d?' done':''}" data-act="emph" data-arg="${o.k}"><span class="${d?'okc':''}">${d?'✓':(cur===o.k?'●':'○')}</span><span><b>${o.t}</b><br><span class="hint">${o.d}</span>${cur===o.k?(d?'<br><span class="okc">做到了，記得替地圖取一個符合主題的圖名。</span>':'<br><span class="hint">還沒做到，繼續調整分界。</span>'):''}</span></div>`;}).join('')}
   <label class="hint" for="note">用一句話說明：你為什麼這樣分？</label><textarea id="note" placeholder="例：我把 20% 當門檻，因為它是超高齡社會的標準…">${esc(S.notes[ds])}</textarea>
   <div class="field" style="margin-top:8px"><button class="btn sm" data-act="copy">複製我的成果（圖名、表格、說明）</button></div></section>`;
}
function metricsSide(){
  const ds=S.ds,rows=[['等量分級',cutsQ(ds)],['等距分級',cutsE(ds)],['自訂（課本）',cutsC(ds)],['我的設計',S.cuts[ds]]];
  return `<section class="card"><div class="h4">用數字檢查分得好不好</div><div class="tblwrap"><table><thead><tr><th>方法</th><th>由低到高各組縣市數</th><th class="n">空組</th><th class="n">組內最大落差</th><th class="n">相近卻被分開（最小跨組差）</th></tr></thead><tbody>${rows.map(([n,c])=>{const m=metrics(ds,c);return `<tr><td>${n}</td><td class="n">${m.c.join('、')}</td><td class="n${m.empty?' warn':''}">${m.empty}</td><td class="n">${f2(m.within)}</td><td class="n">${isFinite(m.cross)?f2(m.cross):'—'}${m.pair?`<br><span class="hint">${m.pair[0]}／${m.pair[1]}</span>`:''}</td></tr>`;}).join('')}</tbody></table></div>
   <ul class="hint" style="margin:8px 0 0;padding-left:20px"><li><b>空組</b>越多、<b>最大組</b>越大，圖越容易變成同一個顏色。</li><li><b>組內最大落差</b>越大，同色的縣市差得越多。</li><li><b>最小跨組差</b>越小，代表數值幾乎一樣的縣市被硬分開。</li><li>等量適合分布均勻的資料；等距看相對量差；自訂要有主題與門檻。</li></ul></section>`;
}
/* ---------- 猜分級法 ---------- */
function newRound(){
  const ds=S.ds,st=stat(ds),keep=S.guess||{score:0,total:0};let method=['q','e','c'][Math.floor(Math.random()*3)],cuts;
  if(method==='q')cuts=cutsQ(ds);else if(method==='e')cuts=cutsE(ds);
  else{const step=ds==='old'?1:0.25,cand=[];for(let v=Math.ceil((st.min+0.3)/step)*step;v<st.max-0.2;v+=step)cand.push(+v.toFixed(2));
    for(let t=0;t<60;t++){const kk=2+Math.floor(Math.random()*3),pick=cand.slice().sort(()=>Math.random()-.5).slice(0,kk).sort((a,b)=>a-b);
      const c=counts(ds,pick);if(c.every(x=>x>0)){const eq=cutsE(ds),qq=cutsQ(ds);if(pick.length===4&&(pick.every((x,i)=>Math.abs(x-eq[i])<0.2)||pick.every((x,i)=>Math.abs(x-qq[i])<0.2)))continue;cuts=pick;break;}}
    if(!cuts)cuts=cutsC(ds);}
  S.guess={ds,method,cuts,ans:null,hint:false,score:keep.score,total:keep.total};
}
function guessHTML(){
  if(!S.guess||S.guess.ds!==S.ds)newRound();
  const G=S.guess,ds=G.ds,cuts=G.cuts,k=cuts.length+1,col=colsFor(k),g=groupsOf(ds,cuts),c=counts(ds,cuts);
  let fb='';
  if(G.ans){const ok=G.ans===G.method;const why={q:`每一組的縣市數都差不多（${c.join('、')}），這是<b>等量分級</b>。`,e:`每一組的寬度都相等（約 ${f2((stat(ds).max-stat(ds).min)/5)}%），各組縣市數卻不一樣（${c.join('、')}），這是<b>等距分級</b>。`,c:`組距不一樣寬，縣市數也不一樣（${c.join('、')}），分界像是人訂的門檻，這是<b>自訂分級</b>。`};
    fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'答對了！':'再想想，答案是「'+METH[G.method].name+'」。'}</b><br>${why[G.method]}</div><div class="field" style="margin-top:8px"><button class="btn pri" data-act="next">下一題 ›</button></div>`;}
  return `<div class="guess"><section class="card"><div class="maptitle">這張圖用哪一種分級？</div>${mapSVG(n=>col[g[n]])}${G.hint?legendHTML(ds,cuts):''}</section>
   <section class="card"><div class="h4"><span>看顏色分布、猜猜看</span><span class="hint">答對 ${G.score} ／ ${G.total}</span></div>
   <p class="hint">提示：想想「每組縣市數」和「每組寬度」。</p>
   <div class="gbtns">${['q','e','c'].map(m=>`<button class="btn" data-act="guess" data-arg="${m}" ${G.ans?'disabled':''}>${METH[m].name}</button>`).join('')}</div>
   <div class="field"><button class="btn sm" data-act="hint">${G.hint?'收起提示':'看圖例和長條圖'}</button></div>
   ${G.hint?barsSVG(ds,cuts,true,null):''}${fb}</section></div>`;
}
function chalHTML(){
  const tabs=[['guess','猜分級法'],['task','任務關卡'],['emph','想強調什麼就怎麼分'],['metrics','用數字檢驗']];
  let h=`<div class="sub2" role="tablist">${tabs.map(([k,n])=>`<button data-act="chal" data-arg="${k}" aria-pressed="${S.chal===k}">${n}</button>`).join('')}</div>`;
  if(S.chal==='guess')return h+guessHTML();
  const side={task:taskSide,emph:emphSide,metrics:metricsSide}[S.chal]();
  return h+workspace(side);
}

/* ---------- 主繪製 ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  $('#subline').textContent=DS[S.ds].sub+'　同樣的資料，用不同的分級方式呈現。';
  $('#ctl').innerHTML=`<div class="seg" role="group" aria-label="選擇資料">${['old','imm'].map(d=>`<button data-act="ds" data-arg="${d}" aria-pressed="${S.ds===d}">${DS[d].label}</button>`).join('')}</div>
   <div class="seg" role="group" aria-label="選擇模式">${[['teach','講解'],['lab','上機'],['chal','挑戰']].map(([k,n])=>`<button data-act="mode" data-arg="${k}" aria-pressed="${S.mode===k}">${n}</button>`).join('')}</div>
   <span class="time">${S.mode==='teach'?'講解約 5 分鐘':S.mode==='lab'?'上機約 10 分鐘':'選做'}</span>`;
  $('#view').innerHTML=S.mode==='teach'?teachHTML():S.mode==='lab'?workspace(labSide()):chalHTML();
  $('#foot').textContent=DS[S.ds].src+'　縣市界：taiwan-atlas。分界以「≤ 上限」歸組，資料取到小數第 2 位。';
  if(S.mode==='teach'&&S.step===4)cmpHTML();
  applyHL();
}
function applyHL(){
  const n=S.hover||S.sel;
  document.querySelectorAll('svg.map').forEach(svg=>{const ov=svg.querySelector('.ov');if(!ov)return;if(n){ov.setAttribute('href','#c-'+n);ov.style.display='';}else ov.style.display='none';});
  document.querySelectorAll('.bar,.dot').forEach(el=>el.classList.toggle('on',el.dataset.n===n));
}
function tipHTML(n){
  const ds=S.ds,v=val(ds,n);let h=`<b>${n}</b>　${f2(v)}%`;
  if(S.mode==='teach'){PANELS.forEach(p=>{if(S.step>=({q:1,e:2,c:3})[p.id]){const cuts=METH[p.id].cuts(ds),g=cls(v,cuts);h+=`<br>${p.name}：${p.id==='c'?DS[ds].customNames[g].split('（')[0]:'第 '+(cuts.length+1-g)+' 組'}`;}});}
  else if(S.mode==='lab'||S.chal!=='guess'){const cuts=S.cuts[ds];h+=`　第 ${cuts.length+1-cls(v,cuts)} 組`;}
  return h;
}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200);}
async function copy(){
  const t=copyText(S.ds,S.cuts[S.ds]);
  try{await navigator.clipboard.writeText(t);S.fallback='';toast('已複製，可以貼到 Word 或表格');}
  catch(e){S.fallback=t;render();const f=$('#fb');if(f){f.focus();f.select();}toast('請按 Ctrl+C 複製下方文字');}
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act,arg=a.dataset.arg;
    if(act==='ds'){S.ds=arg;S.sel=null;S.guess=null;S.fallback='';render();}
    else if(act==='mode'){S.mode=arg;S.sel=null;S.fallback='';render();}
    else if(act==='step'){S.step=Math.max(0,Math.min(4,S.step+ +arg));render();}
    else if(act==='goto'){S.step=+arg;render();}
    else if(act==='preset'){S.cuts[S.ds]=METH[arg].cuts(S.ds);render();}
    else if(act==='copy')copy();
    else if(act==='chal'){S.chal=arg;S.fallback='';render();}
    else if(act==='emph'){S.emph[S.ds]=arg;render();}
    else if(act==='hint'){S.guess.hint=!S.guess.hint;render();}
    else if(act==='next'){newRound();render();}
    else if(act==='guess'){S.guess.ans=arg;S.guess.total++;if(arg===S.guess.method)S.guess.score++;render();}
    return;}
  const t=e.target.closest('[data-n]');
  if(t&&S.mode==='teach'){S.sel=S.sel===t.dataset.n?null:t.dataset.n;applyHL();cmpHTML();}
});
document.addEventListener('pointerover',e=>{const t=e.target.closest('[data-n]');if(t&&!t.classList.contains('gh')){S.hover=t.dataset.n;const tip=$('#tip');tip.innerHTML=tipHTML(S.hover);tip.style.display='block';applyHL();}});
document.addEventListener('pointermove',e=>{const tip=$('#tip');if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-250)+'px';tip.style.top=(e.clientY+14)+'px';}});
document.addEventListener('pointerout',e=>{const t=e.target.closest('[data-n]');if(t){S.hover=null;$('#tip').style.display='none';applyHL();}});
document.addEventListener('keydown',e=>{if(S.mode==='teach'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){if(e.key==='ArrowRight'){S.step=Math.min(4,S.step+1);render();}if(e.key==='ArrowLeft'){S.step=Math.max(0,S.step-1);render();}}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('td input[data-ci]')){const i=+el.dataset.ci,v=r2(parseFloat(el.value)),c=S.cuts[S.ds].slice();
    const lo=i>0?c[i-1]+0.01:-Infinity,hi=i<c.length-1?c[i+1]-0.01:Infinity;
    if(!isFinite(v)||v<lo-1e-9||v>hi+1e-9){toast('分界要由小到大，而且不能重疊');}else{c[i]=v;S.cuts[S.ds]=c;}render();}
  else if(el.id==='lbl'){S.labels=el.checked;render();}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='ttl'){S.titles[S.ds]=el.value;const m=$('#mapTitle');if(m)m.textContent=el.value;}
  else if(el.id==='note')S.notes[S.ds]=el.value;
});
/* 拖曳分界線 */
let drag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.gh');if(h){drag=+h.dataset.ci;e.preventDefault();}});
window.addEventListener('pointermove',e=>{
  if(drag===null)return;const svg=$('#strip');if(!svg)return;
  const[lo,hi]=domain(S.ds),r=svg.getBoundingClientRect(),ml=26,mr=26,W=560,px=(e.clientX-r.left)/r.width*W;
  let v=r2(lo+(px-ml)/(W-ml-mr)*(hi-lo));const c=S.cuts[S.ds].slice();
  const a=drag>0?c[drag-1]+0.01:lo,b=drag<c.length-1?c[drag+1]-0.01:hi;v=Math.max(a,Math.min(b,v));
  if(v!==c[drag]){c[drag]=r2(v);S.cuts[S.ds]=c;render();}
});
window.addEventListener('pointerup',()=>{drag=null;});

$('#defs').innerHTML=NAMES.map(n=>`<path id="c-${n}" d="${MAP.counties[n].d}"/>`).join('');
render();
</script>
</body></html>
