<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DTM 水系萃取步驟機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：左地圖、右步驟面板；延續「空間內插」模型，紫色步驟標籤取自課本圖 2-28 */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1f2a36; --ink2:#566372; --line:#d3dae2;
  --accent:#2f4f8a; --accent-soft:#e3eaf6; --step:#8f6fb0; --step-soft:#efe8f6;
  --river:#1f5fb4; --warn:#b4412f; --ok:#2e7d55;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161b22; --paper:#1f262f; --ink:#e6ebf1; --ink2:#9aa7b5; --line:#34404d;
    --accent:#8fb0ea; --accent-soft:#26344a; --step:#bb9bdc; --step-soft:#342a42;
    --river:#7fb2f0; --warn:#f08a74; --ok:#6fd39f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161b22; --paper:#1f262f; --ink:#e6ebf1; --ink2:#9aa7b5; --line:#34404d;
  --accent:#8fb0ea; --accent-soft:#26344a; --step:#bb9bdc; --step-soft:#342a42;
  --river:#7fb2f0; --warn:#f08a74; --ok:#6fd39f; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;
  padding:18px clamp(16px,3vw,32px) 12px}
.top h1{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:.02em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.switches{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-size:15px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper);font-weight:500}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding:0 clamp(16px,3vw,32px) 24px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.mapcol{min-width:0}
.mapbox{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;justify-content:center;overflow:hidden}
canvas#map{display:block;touch-action:none;border-radius:3px;max-width:100%;cursor:crosshair}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;
  padding:3px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.92}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:6px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:.94}
.mapfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-top:8px;font-size:14px;color:var(--ink2)}
.mapfoot label{display:inline-flex;align-items:center;gap:6px;margin-right:14px;cursor:pointer}
.mapfoot .opts{display:flex;flex-wrap:wrap}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;min-width:0}
.steps{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 4px 7px;
  display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--ink2);line-height:1.3}
.steps b{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--step-soft);color:var(--step);font-size:15px;margin-bottom:3px}
.steps button[aria-current="step"]{border-color:var(--step);color:var(--ink);font-weight:500}
.steps button[aria-current="step"] b{background:var(--step);color:var(--paper)}
.body h2{margin:0 0 4px;font-size:19px;text-wrap:balance}
.body p{margin:0 0 10px;color:var(--ink2);font-size:15px}
.body .lead{color:var(--ink);font-size:16px}
.ctl{margin:12px 0}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink2);margin-bottom:4px}
.ctl .lab strong{color:var(--ink);font-variant-numeric:tabular-nums;font-size:16px}
.ctl .seg{display:flex;width:100%}
.ctl .seg button{flex:1;padding:5px 6px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.btn{border:0;background:var(--accent);color:var(--paper);border-radius:9px;padding:8px 14px;font-size:15px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:10px 0}
.stat div{background:var(--bg);border-radius:9px;padding:7px 10px}
.stat span{display:block;font-size:12px;color:var(--ink2)}
.stat strong{font-size:20px;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--ink2);background:var(--bg);border-radius:9px;padding:8px 10px;margin:10px 0}
.hint b{color:var(--ink)}
.note{font-size:13px;color:var(--ink2);margin-top:10px}
.formula{background:var(--step-soft);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:15px}
.formula small{display:block;color:var(--ink2);font-size:13px}

/* 3×3 放大鏡 */
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:270px;margin:8px auto}
.nine div,.nine button{aspect-ratio:1.25;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--bg);line-height:1.2;padding:2px}
.nine .v{font-size:19px;font-weight:700;color:var(--ink)}
.nine .d{font-size:12px;color:var(--ink2)}
.nine .c{background:var(--step-soft);border-color:var(--step)}
.nine .best{border:2px solid var(--river);background:var(--accent-soft)}
.nine .best .d{color:var(--river);font-weight:700}
.nine button:hover{border-color:var(--accent)}
.nine .right{border:2px solid var(--ok)} .nine .wrong{border:2px solid var(--warn)}
table.w{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.w th{font-weight:500;color:var(--ink2);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
table.w td{text-align:right;padding:3px 4px}
table.w th:first-child,table.w td:first-child{text-align:left}
table.w tr.best td{color:var(--river);font-weight:700}
.legend{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:13px;color:var(--ink2)}
.legend .t{color:var(--ink);font-size:14px;font-weight:500;margin-bottom:6px}
.ramp{height:12px;border-radius:3px}
.rampt{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.dirleg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dirleg span{display:flex;align-items:center;gap:5px}
.dirleg i{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.keyline{display:flex;align-items:center;gap:8px;margin:3px 0}
.keyline i{display:inline-block;width:24px;flex:none}
.score{font-size:15px;margin:8px 0}
.score strong{font-size:24px;font-variant-numeric:tabular-nums}
.good{color:var(--ok)} .bad{color:var(--warn)}
.choice{display:flex;gap:8px;margin:10px 0}
.choice button{flex:1;font-size:22px;font-weight:700;padding:8px 0;border-radius:10px;border:2px solid var(--line);background:var(--paper)}
.choice button:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top">
  <div>
    <h1>DTM 水系萃取步驟機</h1>
    <p>從數值地形模型一步步找出大豹溪的水系與集水區（課本圖 2-28）</p>
  </div>
  <div class="switches">
  <div class="seg" id="resSeg" aria-label="網格解析度">
    <button data-r="lo" aria-pressed="true">一般網格</button>
    <button data-r="hi" aria-pressed="false">高解析度</button>

  <div class="seg" id="modeSeg" aria-label="選擇模式">
    <button data-m="explain" aria-pressed="true">講解步驟</button>
    <button data-m="challenge" aria-pressed="false">挑戰模式</button>
  </div>
  </div>
</header>

<main class="layout">
  <div class="mapcol">
    <div class="mapbox" id="mapbox">

      <div class="tip" id="tip" hidden></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <div class="mapfoot">
      <div class="opts" id="opts">
        <label><input type="checkbox" id="optContour"> 等高線（100 m）</label>
        <label><input type="checkbox" id="optGrid"> 網格線</label>
        <label><input type="checkbox" id="optShade" checked> 地形陰影</label>
      </div>

    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</main>

function compute(){F=new Float64Array(N);DIR=new Int8Array(N).fill(-1);ACC=new Int32Array(N);UP=Array.from({length:N},()=>[]);

}
const shadeMix=(col,i,amt)=>{const s=0.55+0.6*SHADE[i];const f=1-amt+amt*s;return [Math.min(255,col[0]*f),Math.min(255,col[1]*f),Math.min(255,col[2]*f)];};
const L_DTM=()=>makeLayer('dtm'+S.shade,i=>S.shade?shadeMix(rampColor(Z[i]),i,.55):rampColor(Z[i]));
const L_DIR=()=>makeLayer('dir',i=>DIR[i]<0?[255,255,255]:shadeMix(hex2rgb(DCOL[DIR[i]]),i,.6));
const L_ACC=()=>makeLayer('acc',i=>{const t=Math.log(ACC[i]+1)/Math.log(ACCMAX+1);const a=Math.min(1,Math.pow(t,1.6)*1.35);
  return [247-(247-14)*a,248-(248-40)*a,250-(250-96)*a];});

function contourSegs(level){const segs=[];
  for(let r=0;r<R-1;r++)for(let c=0;c<C-1;c++){const a=Z[r*C+c],b=Z[r*C+c+1],cc=Z[(r+1)*C+c+1],d=Z[(r+1)*C+c];
    const code=(a>=level?8:0)|(b>=level?4:0)|(cc>=level?2:0)|(d>=level?1:0);if(code===0||code===15)continue;
    const x0=c+.5,y0=r+.5,T=[x0+(level-a)/(b-a),y0],Rt=[x0+1,y0+(level-b)/(cc-b)],B=[x0+(level-d)/(cc-d),y0+1],L=[x0,y0+(level-a)/(d-a)];
    const add=(p,q)=>segs.push([p,q]);
    switch(code){case 1:case 14:add(L,B);break;case 2:case 13:add(B,Rt);break;case 3:case 12:add(L,Rt);break;case 4:case 11:add(T,Rt);break;
      case 6:case 9:add(T,B);break;case 7:case 8:add(L,T);break;case 5:add(L,T);add(B,Rt);break;case 10:add(L,B);add(T,Rt);break;}}
  return segs;}
function drawContours(){if(!CONT){CONT=[];for(let l=200;l<=1600;l+=100)CONT.push([l,contourSegs(l)]);}
  for(const [l,segs] of CONT){ctx.beginPath();segs.forEach(([p,q])=>{ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);});
    ctx.strokeStyle=l%500===0?'rgba(70,45,20,.85)':'rgba(70,45,20,.45)';ctx.lineWidth=(l%500===0?1.4:.8)/cell;ctx.stroke();}}
function drawGridLines(){if(cell<5)return;ctx.beginPath();for(let c=0;c<=C;c++){ctx.moveTo(c,0);ctx.lineTo(c,R);}for(let r=0;r<=R;r++){ctx.moveTo(0,r);ctx.lineTo(C,r);}
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=.6/cell;ctx.stroke();}
function cellXY(i){return [i%C+.5,((i/C)|0)+.5];}
function drawRivers(th,color,alpha){ctx.save();ctx.lineCap='round';ctx.strokeStyle=color;ctx.globalAlpha=alpha||1;
  const lg=Math.log(ACCMAX+1);
  for(let i=0;i<N;i++){if(ACC[i]<th||DIR[i]<0)continue;const j=nbr(i,DIR[i]);const [x,y]=cellXY(i);
    ctx.lineWidth=(1.2+2.6*Math.log(ACC[i]+1)/lg)/cell;ctx.beginPath();ctx.moveTo(x,y);
    if(j<0){const [dr,dc]=D8[DIR[i]];ctx.lineTo(x+dc*.5,y+dr*.5);}else{const [x2,y2]=cellXY(j);ctx.lineTo(x2,y2);}ctx.stroke();}
  // 流出圖框的邊格
  for(let i=0;i<N;i++){if(ACC[i]<th||DIR[i]>=0)continue;}
  ctx.restore();}
function drawMaskOutline(m,color,w){ctx.beginPath();
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const i=r*C+c;if(!m[i])continue;
    if(r===0||!m[i-C]){ctx.moveTo(c,r);ctx.lineTo(c+1,r);} if(r===R-1||!m[i+C]){ctx.moveTo(c,r+1);ctx.lineTo(c+1,r+1);}
    if(c===0||!m[i-1]){ctx.moveTo(c,r);ctx.lineTo(c,r+1);} if(c===C-1||!m[i+1]){ctx.moveTo(c+1,r);ctx.lineTo(c+1,r+1);}}
  ctx.strokeStyle=color;ctx.lineWidth=w/cell;ctx.lineCap='square';ctx.stroke();}
function fillMask(m,rgba){ctx.fillStyle=rgba;for(let i=0;i<N;i++)if(m[i]){ctx.fillRect(i%C,(i/C)|0,1,1);}}
function ring(i,color,rad){const [x,y]=cellXY(i);ctx.beginPath();ctx.arc(x,y,rad||1.6,0,7);ctx.lineWidth=2.5/cell;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.lineWidth=1.5/cell;ctx.strokeStyle=color;ctx.stroke();}
function selBox(i){const c=i%C,r=(i/C)|0;ctx.lineWidth=2.5/cell;ctx.strokeStyle='#fff';ctx.strokeRect(c-1,r-1,3,3);
  ctx.lineWidth=1.4/cell;ctx.strokeStyle='#5b3d7a';ctx.strokeRect(c-1,r-1,3,3);ctx.strokeRect(c,r,1,1);if(K>1.5)ring(i,'#5b3d7a',2.4*K);}
function arrowAt(x,y,k,len,color,lw){const [dr,dc]=D8[k],l=Math.hypot(dr,dc),ux=dc/l,uy=dr/l;
  const x1=x-ux*len*.45,y1=y-uy*len*.45,x2=x+ux*len*.45,y2=y+uy*len*.45;
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-ux*lw*1.2,y2-uy*lw*1.2);ctx.stroke();
  const h=lw*3.2;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-ux*h-uy*h*.6,y2-uy*h+ux*h*.6);ctx.lineTo(x2-ux*h+uy*h*.6,y2-uy*h-ux*h*.6);ctx.closePath();ctx.fill();}
function label(text,x,y,size,color){ctx.font=`700 ${size/cell}px "Noto Sans TC",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=3.5/cell;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.strokeText(text,x,y);ctx.fillStyle=color;ctx.fillText(text,x,y);}

function drawSmall(){
  const n=SN;ctx.setTransform(dpr*cell,0,0,dpr*cell,0,0);ctx.clearRect(0,0,n,n);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const t=(SG[r][c]-30)/(92-30);const col=rampColor(ZMIN+t*(ZMAX-ZMIN)*0.92);
    ctx.fillStyle=`rgb(${col[0]|0},${col[1]|0},${col[2]|0})`;ctx.fillRect(c,r,1,1);}
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2/cell;ctx.beginPath();for(let i=0;i<=n;i++){ctx.moveTo(i,0);ctx.lineTo(i,n);ctx.moveTo(0,i);ctx.lineTo(n,i);}ctx.stroke();
  const showArrow=(r,c)=>S.sAll||S.sShown.has(r*n+c)||S.step===3;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const k=S6.dir[r][c];
    if(S.step===3){ // 累積量：數字＋箭頭
      ctx.globalAlpha=.55;if(k>=0)arrowAt(c+.5,r+.5,k,.8,'#1b3550',3/cell);else{ctx.beginPath();ctx.arc(c+.5,r+.5,.12,0,7);ctx.fillStyle='#1b3550';ctx.fill();}ctx.globalAlpha=1;
      const a=S.sRain?S.sRain.count[r][c]:(S.sRain===null&&S.sAccShown?S6.acc[r][c]:null);
      ctx.font=`700 ${15/cell}px "Noto Sans TC",sans-serif`;ctx.fillStyle='rgba(31,42,54,.75)';ctx.fillText(SG[r][c]+' m',c+.5,r+.22);
      if(a!==null){ctx.font=`700 ${26/cell}px "Noto Sans TC",sans-serif`;ctx.lineWidth=4/cell;ctx.strokeStyle='#fff';ctx.strokeText(a,c+.5,r+.68);ctx.fillStyle='#14306b';ctx.fillText(a,c+.5,r+.68);}
    } else {
      ctx.font=`700 ${24/cell}px "Noto Sans TC",sans-serif`;ctx.fillStyle='#1f2a36';ctx.fillText(SG[r][c],c+.5,showArrow(r,c)?r+.3:r+.5);
      if(showArrow(r,c)){if(k>=0)arrowAt(c+.5,r+.72,k,.42,'#14306b',3.5/cell);else{ctx.font=`700 ${14/cell}px "Noto Sans TC",sans-serif`;ctx.fillStyle='#14306b';ctx.fillText('出水口',c+.5,r+.75);}}
    }
  }
  if(S.step===3&&S.sRain){for(const d of S.sRain.drops){if(d.done)continue;ctx.beginPath();ctx.arc(d.x,d.y,.11,0,7);ctx.fillStyle='#1f5fb4';ctx.fill();ctx.lineWidth=1.5/cell;ctx.strokeStyle='#fff';ctx.stroke();}}
  if(S.step===2&&S.ssel!==null){const r=(S.ssel/n)|0,c=S.ssel%n;
    ctx.lineWidth=4/cell;ctx.strokeStyle='#5b3d7a';ctx.strokeRect(Math.max(0,c-1),Math.max(0,r-1),Math.min(n,c+2)-Math.max(0,c-1),Math.min(n,r+2)-Math.max(0,r-1));
    ctx.lineWidth=3/cell;ctx.strokeStyle='#fff';ctx.strokeRect(c+.06,r+.06,.88,.88);}
}

function draw(){
  if(smallView())return drawSmall();
  ctx.setTransform(dpr*cell,0,0,dpr*cell,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,C,R);
  let layer='dtm';
  if(S.mode==='explain'){if(S.step===2)layer='dir';if(S.step===3)layer='acc';}
  else if(S.ch.tab==='acc'&&S.ch.acc&&S.ch.acc.revealed)layer='acc';
  ctx.drawImage(layer==='dtm'?L_DTM():layer==='dir'?L_DIR():L_ACC(),0,0,C,R);
  if(S.contour&&layer==='dtm')drawContours();
  if(S.grid)drawGridLines();
  if(S.mode==='explain'){
    if(S.step===1&&S.sel!==null)selBox(S.sel);
    if(S.step===2&&S.sel!==null){selBox(S.sel);const r=(S.sel/C)|0,c=S.sel%C;const k=calcCell((rr,cc)=>Z[rr*C+cc],{R,C},r,c).best;if(k>=0)arrowAt(c+.5,r+.5,k,2.6*K,'#111',2.6/cell);}
    if(S.step===3){
      if(S.upMask)fillMask(S.upMask,'rgba(143,111,176,.45)');
      if(S.rain)drawRain();
      if(S.sel!==null)ring(S.sel,'#5b3d7a',1.4*K);
    }
    if(S.step===4){fillMask(S.ws,'rgba(255,255,255,.18)');drawRivers(S.th,'#1f5fb4');drawMaskOutline(S.ws,'#111',2);ring(S.outlet,'#111',1.3*K);
      const [x,y]=cellXY(S.outlet);label('出水口',x+(x<C/2?6:-6)*K,y+2.2*K,13,'#111');}
  } else drawChallenge();
}

/* 大豹溪下雨動畫 */
function startRain(){const drops=[];for(let i=0;i<N;i+=Math.max(2,Math.round(2*K*K))){const j=(Math.random()*N)|0;drops.push({i:j,t:Math.random()*-1.5,x:0,y:0});}
  S.rain={drops,trail:new Float32Array(N),t0:performance.now()};S.rainRun=true;loopRain();}
function loopRain(){if(!S.rain||!S.rainRun)return;const R0=S.rain;
  for(const d of R0.drops){d.t+=0.06*K;if(d.t<0)continue;if(d.t>=1){const k=DIR[d.i];if(k<0){d.i=(Math.random()*N)|0;d.t=-Math.random();continue;}R0.trail[d.i]+=1;d.i=nbr(d.i,k);d.t-=1;if(d.i<0){d.i=(Math.random()*N)|0;d.t=-Math.random();}}}
  for(let i=0;i<N;i++)R0.trail[i]*=0.985;
  draw();if(performance.now()-R0.t0<14000)requestAnimationFrame(loopRain);else{S.rainRun=false;S.rain=null;draw();toast('雨停了：水最後都集中在累積量大的谷地');}}
function drawRain(){const R0=S.rain;ctx.fillStyle='rgba(31,95,180,.85)';
  for(let i=0;i<N;i++){const v=R0.trail[i];if(v>1){ctx.globalAlpha=Math.min(.7,v*.015);ctx.fillRect(i%C,(i/C)|0,1,1);}}ctx.globalAlpha=1;
  ctx.fillStyle='#0b3d91';for(const d of R0.drops){if(d.t<0)continue;const k=DIR[d.i];if(k<0)continue;const [x,y]=cellXY(d.i);
    ctx.beginPath();ctx.arc(x+D8[k][1]*d.t,y+D8[k][0]*d.t,.32*K,0,7);ctx.fill();}}

/* 小網格下雨 */
function startSmallRain(){const n=SN,drops=[],count=[];for(let r=0;r<n;r++){count[r]=Array(n).fill(0);for(let c=0;c<n;c++)drops.push({r,c,x:c+.5,y:r+.5,p:0,done:false});}
  S.sRain={drops,count};S.sAccShown=false;
  let last=performance.now();
  function tick(now){if(!S.sRain)return;const dt=Math.min(.05,(now-last)/1000);last=now;let alive=0;
    for(const d of S.sRain.drops){if(d.done)continue;const k=S6.dir[d.r][d.c];if(k<0){d.done=true;continue;}alive++;
      d.p+=dt*1.1;const [dr,dc]=D8[k];d.x=d.c+.5+dc*Math.min(1,d.p);d.y=d.r+.5+dr*Math.min(1,d.p);
      if(d.p>=1){d.r+=dr;d.c+=dc;d.p=0;S.sRain.count[d.r][d.c]++;}}
    draw();renderPanel(true);
    if(alive)requestAnimationFrame(tick);else{S.sRain=null;S.sAccShown=true;draw();renderPanel();toast('每一格的數字，就是流進它的上游格數');}}
  requestAnimationFrame(tick);}

/* ===================== 互動 ===================== */
function cellFromEvent(e){const rc=cv.getBoundingClientRect();const x=(e.clientX-rc.left)/cell,y=(e.clientY-rc.top)/cell;
  const c=Math.floor(x),r=Math.floor(y);if(c<0||r<0||c>=W0||r>=H0)return null;return {r,c,i:r*W0+c,px:e.clientX-rc.left,py:e.clientY-rc.top};}
let painting=false;
cv.addEventListener('pointerdown',e=>{const p=cellFromEvent(e);if(!p)return;
  if(S.mode==='challenge'&&S.ch.tab==='ws'&&S.ch.ws&&!S.ch.ws.revealed){painting=true;cv.setPointerCapture(e.pointerId);paint(p);return;}
  onClick(p);});
cv.addEventListener('pointermove',e=>{const p=cellFromEvent(e);
  if(painting&&p){paint(p);return;}
  if(!p||smallView()){tip.hidden=true;return;}
  let t=`高程 ${Z[p.i]} m`;
  if(S.mode==='explain'&&S.step===2&&DIR[p.i]>=0)t+=`｜流向 ${DNAME[DIR[p.i]]} ${ARW[DIR[p.i]]}`;
  if(S.mode==='explain'&&S.step>=3)t+=`｜累積量 ${ACC[p.i].toLocaleString()} 格`;
  tip.textContent=t;tip.hidden=false;
  const bx=box.getBoundingClientRect(),rc=cv.getBoundingClientRect();
  let x=rc.left-bx.left+p.px+14,y=rc.top-bx.top+p.py+14;if(x>bx.width-170)x-=190;tip.style.left=x+'px';tip.style.top=y+'px';});
cv.addEventListener('pointerleave',()=>{tip.hidden=true;});
window.addEventListener('pointerup',()=>{if(painting){painting=false;}});

function onClick(p){
  if(smallView()){
    if(S.step===2){S.ssel=p.i;S.sShown.add(p.i);}
    draw();renderPanel();return;}
  if(S.mode==='explain'){
    if(S.step===1||S.step===2){S.sel=p.i;}
    if(S.step===3){S.sel=p.i;S.upMask=watershed(p.i);}
    if(S.step===4){let i=p.i;
      // 點在河道附近時吸附到最近的河道格
      let best=-1,bd=99;const sr=Math.round(2*K);for(let dr=-sr;dr<=sr;dr++)for(let dc=-sr;dc<=sr;dc++){const rr=p.r+dr,cc=p.c+dc;if(rr<0||cc<0||rr>=R||cc>=C)continue;const j=rr*C+cc;
        if(ACC[j]>=S.th){const d=Math.hypot(dr,dc)-ACC[j]*1e-6;if(d<bd){bd=d;best=j;}}}
      if(best>=0)i=best;S.outlet=i;S.ws=watershed(i);}
    draw();renderPanel();}
  else challengeClick(p);
}

/* ===================== 面板 ===================== */
const panel=document.getElementById('panel');
const STEPS=['取得數值地形模型','以網格高程差計算流向','計算匯流累積量','取得水系與集水區範圍'];
const SHORT=['取得 DTM','計算流向','匯流累積','水系與集水區'];
function stepsNav(){return `<ol class="steps">${SHORT.map((t,k)=>`<li><button data-step="${k+1}" ${S.step===k+1?'aria-current="step"':''}><b>${k+1}</b>${t}</button></li>`).join('')}</ol>`;}
function nineHTML(get,n,r,c,opts){const o=calcCell(get,n,r,c);const pos=[[-1,-1],[-1,0],[-1,1],[0,-1],[0,0],[0,1],[1,-1],[1,0],[1,1]];
  return `<div class="nine">${pos.map(([dr,dc])=>{if(!dr&&!dc)return `<div class="c"><span class="v">${o.v}</span><span class="d">中心格</span></div>`;
    const k=D8.findIndex(d=>d[0]===dr&&d[1]===dc),it=o.list[k];if(!it)return `<div><span class="d">圖框外</span></div>`;
    const show=opts&&opts.calc;const cls=show&&k===o.best?'best':'';
    return `<div class="${cls}"><span class="v">${it.w}</span>${show?`<span class="d">${it.diff>0?`低 ${it.diff}${it.dist>1?' ÷1.41':''} = ${it.slope.toFixed(1)}`:(it.diff<0?`高 ${-it.diff}`:'一樣高')}</span>`:''}</div>`;}).join('')}</div>`;}
function calcTable(get,n,r,c){const o=calcCell(get,n,r,c);
  const rows=o.list.filter(Boolean).sort((a,b)=>b.slope-a.slope);
  return `<table class="w"><tr><th>方向</th><th>高程差</th><th>距離</th><th>坡降</th></tr>${rows.map(it=>`<tr class="${it.k===o.best?'best':''}"><td>${ARW[it.k]} ${DNAME[it.k]}</td><td>${it.diff}</td><td>${it.dist>1?'1.41':'1'}</td><td>${it.slope.toFixed(1)}</td></tr>`).join('')}</table>
  <p class="note">${o.best>=0?`落差最大的是 <b>${DNAME[o.best]}</b>，水往 ${ARW[o.best]} 流。`:'四周都沒有比它低的格子，這裡是出水口（或窪地）。'}</p>`;}
const rampCSS=`linear-gradient(90deg,${RAMP.map(c=>`rgb(${c})`).join(',')})`;
const LEG_DTM=`<div class="legend"><div class="t">高程（m，示意）</div><div class="ramp" style="background:${rampCSS}"></div><div class="rampt"><span>100</span><span>500</span><span>900</span><span>1,300</span><span>1,700</span></div></div>`;
const LEG_DIR=`<div class="legend"><div class="t">流向（每格只會流向 8 個方向之一）</div><div class="dirleg">${[6,7,0,1,2,3,4,5].map(k=>`<span><i style="background:${DCOL[k]}"></i>${ARW[k]} ${DNAME[k]}</span>`).join('')}</div></div>`;
const LEG_ACC=()=>`<div class="legend"><div class="t">匯流累積量（流進該格的上游格數）</div><div class="ramp" style="background:linear-gradient(90deg,#f7f8fa,#9fb0c8,#0e2860)"></div><div class="rampt"><span>0</span><span>少</span><span>多</span><span>${ACCMAX.toLocaleString()}</span></div></div>`;

function renderPanel(light){
  if(S.mode==='challenge')return renderChallenge();
  let h=stepsNav()+'<div class="body">';
  const st=S.step;
  if(st===1){
    let mn=1e9,mx=-1;for(let i=0;i<N;i++){mn=Math.min(mn,Z[i]);mx=Math.max(mx,Z[i]);}
    h+=`<h2>1　${STEPS[0]}</h2><p class="lead">數值地形模型（DTM）把地表切成一格一格，<b>每格只記一個高度值</b>。</p>
      <p>顏色是分層設色：綠色低、黃色中、紅色高。勾選下方「等高線」，可以和「等高線地形圖」模型對照。</p>
      <div class="stat"><div><span>網格數</span><strong>${C}×${R}</strong></div><div><span>最低</span><strong>${mn} m</strong></div><div><span>最高</span><strong>${mx} m</strong></div></div>`;
    if(S.sel!==null){const r=(S.sel/C)|0,c=S.sel%C;h+=`<div class="hint">點到的格子與周圍 8 格的高程（m）：</div>${nineHTML((rr,cc)=>Z[rr*C+cc],{R,C},r,c)}<p class="note">電腦看到的地形就是這樣一堆數字，下一步就用它們算水往哪裡流。</p>`;}
    else h+=`<div class="hint">在地圖上<b>點任一格</b>，看看它和周圍 8 格的高程數字。</div>`;
    h+=LEG_DTM;
  }
  if(st===2){
    h+=`<h2>2　${STEPS[1]}</h2><div class="ctl"><div class="seg" id="viewSeg"><button data-v="small" aria-pressed="${S.view==='small'}">小網格示範</button><button data-v="big" aria-pressed="${S.view==='big'}">套到大豹溪</button></div></div>`;
    h+=`<div class="formula">坡降 ＝ 高程差 ÷ 距離<small>上下左右的距離算 1 格；斜角的距離是 √2 ≈ 1.41 格。水流向<b>坡降最大</b>的那一格（D8 法）。</small></div>`;
    if(S.view==='small'){
      if(S.ssel!==null){const r=(S.ssel/SN)|0,c=S.ssel%SN;h+=nineHTML((rr,cc)=>SG[rr][cc],{R:SN,C:SN},r,c,{calc:true})+calcTable((rr,cc)=>SG[rr][cc],{R:SN,C:SN},r,c);}
      else h+=`<div class="hint">點小網格中的任一格，看它和 8 個鄰居怎麼比。可以先讓學生自己算，再點開對答案。</div>`;
      h+=`<div class="btnrow"><button class="btn" id="sAll">${S.sAll?'隱藏全部箭頭':'全部算出來'}</button><button class="btn ghost" id="sReset">清除</button></div>`;
    } else {
      if(S.sel!==null){const r=(S.sel/C)|0,c=S.sel%C;h+=nineHTML((rr,cc)=>Z[rr*C+cc],{R,C},r,c,{calc:true})+calcTable((rr,cc)=>Z[rr*C+cc],{R,C},r,c);}
      else h+=`<div class="hint">每一格都照同樣的方法算出流向，再依方向上色，就是課本第 2 格的圖。<b>點任一格</b>看計算過程。</div>`;
      h+=`<p class="note">同一面山坡流向一致，顏色會連成一片；顏色交界的地方就是稜線或谷線。</p>`;
    }
    h+=LEG_DIR;
  }
  if(st===3){
    h+=`<h2>3　${STEPS[2]}</h2><div class="ctl"><div class="seg" id="viewSeg"><button data-v="small" aria-pressed="${S.view==='small'}">小網格示範</button><button data-v="big" aria-pressed="${S.view==='big'}">套到大豹溪</button></div></div>`;
    h+=`<div class="formula">匯流累積量 ＝ 有幾格的水會流進這一格<small>想像每一格都下一滴雨，雨水順著箭頭往下流，數數每格被幾滴雨經過。</small></div>`;
    if(S.view==='small'){
      h+=`<div class="btnrow"><button class="btn" id="sRain" ${S.sRain?'disabled':''}>每格下一滴雨</button><button class="btn ghost" id="sAccBtn">${S.sAccShown?'隱藏數字':'直接顯示答案'}</button></div>`;
      h+=`<div class="hint">最大的數字在哪裡？出水口收到 <b>${SN*SN-1}</b> 格的水，也就是整個小網格的其他所有格子。數字 0 的格子在最上游，也就是分水嶺。</div>`;
    } else {
      h+=`<div class="btnrow"><button class="btn" id="bRain" ${S.rainRun?'disabled':''}>下雨動畫</button><button class="btn ghost" id="bClear">清除選取</button></div>`;
      if(S.sel!==null){let up=0;for(let i=0;i<N;i++)if(S.upMask[i])up++;
        h+=`<div class="stat"><div><span>這一格的累積量</span><strong>${ACC[S.sel].toLocaleString()}</strong></div><div><span>上游範圍（紫色）</span><strong>${up.toLocaleString()} 格</strong></div></div><p class="note">紫色範圍就是這一格的集水區：落在範圍內的雨，最後都會流經這一格。</p>`;}
      else h+=`<div class="hint">累積量大的格子連起來，谷地就浮現了。<b>點任一格</b>，看它的上游範圍。</div>`;
    }
    h+=LEG_ACC();
  }
  if(st===4){
    let ch=0,wsN=0,chIn=0;for(let i=0;i<N;i++){if(ACC[i]>=S.th){ch++;if(S.ws[i])chIn++;}if(S.ws[i])wsN++;}
    h+=`<h2>4　${STEPS[3]}</h2><p class="lead">設定<b>門檻值</b>：累積量超過門檻的格子才算河道。</p>
      <div class="ctl"><div class="lab"><span>門檻值（上游格數）</span><strong id="thv">≥ ${S.th.toLocaleString()}</strong></div>
      <input type="range" id="th" min="0" max="100" step="1" value="${th2s(S.th)}" aria-label="門檻值"><div class="ticks"><span>${s2th(0).toLocaleString()} 密</span><span>疏 ${s2th(100).toLocaleString()}</span></div></div>
      <div class="stat"><div><span>集水區面積</span><strong>${wsN.toLocaleString()} 格</strong></div><div><span>集水區內河道</span><strong>${chIn.toLocaleString()} 格</strong></div><div><span>水系密度</span><strong>${wsN?(chIn/wsN*100).toFixed(1):0}%</strong></div></div>
      <div class="hint">門檻<b>低</b>：連山坡上的小溝都算河道，水系很密。門檻<b>高</b>：只剩主流，水系很疏。課本的圖大約是 <b>${TH0.toLocaleString()}</b>。</div>
      <div class="hint">在地圖上<b>點河道</b>當作新的出水口，黑線會圈出它的集水區；同一個集水區裡的雨水，都會從出水口流出去。</div>
      <div class="btnrow"><button class="btn ghost" id="resetOut">回到大豹溪出水口</button><button class="btn ghost" id="th120">門檻設回 ${TH0.toLocaleString()}</button></div>
      <p class="note">對照「水文歷線」模型：集水區愈大，下大雨時匯集到出水口的水愈多。</p>
      <div class="legend"><div class="keyline"><i style="border-top:3px solid #1f5fb4"></i>河流（線愈粗，累積量愈大）</div><div class="keyline"><i style="height:12px;border:2px solid var(--ink)"></i>集水區</div></div>`;
  }
  h+='</div>';panel.innerHTML=h;bindPanel();
}
const th2s=t=>Math.round(Math.log(t/TMIN)/Math.log(400)*100), s2th=s=>Math.round(TMIN*Math.pow(400,s/100));
function bindPanel(){
  panel.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>goStep(+b.dataset.step));
  panel.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.sRain=null;resize();renderPanel();});
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f;};
  on('sAll',()=>{S.sAll=!S.sAll;draw();renderPanel();});
  on('sReset',()=>{S.sAll=false;S.sShown.clear();S.ssel=null;draw();renderPanel();});
  on('sRain',()=>startSmallRain());
  on('sAccBtn',()=>{S.sRain=null;S.sAccShown=!S.sAccShown;draw();renderPanel();});
  on('bRain',()=>{startRain();renderPanel();});
  on('bClear',()=>{S.sel=null;S.upMask=null;draw();renderPanel();});
  on('resetOut',()=>{S.outlet=OUT0;S.ws=watershed(OUT0);draw();renderPanel();});
  on('th120',()=>{S.th=TH0;draw();renderPanel();});
  const th=document.getElementById('th');if(th)th.oninput=()=>{S.th=s2th(+th.value);document.getElementById('thv').textContent='≥ '+S.th.toLocaleString();draw();
    clearTimeout(th._t);th._t=setTimeout(()=>{renderPanel();const n=document.getElementById('th');n&&n.focus();},250);};
  bindChallenge();
}
function goStep(k){S.step=k;S.sel=null;S.upMask=null;S.rainRun=false;S.rain=null;S.sRain=null;
  if((k===2||k===3)&&S.mode==='explain'&&!S._visited){S.view='small';}
  syncOpts();resize();renderPanel();}
function syncOpts(){const dtm=S.mode==='challenge'||S.step===1||S.step===4;
  document.getElementById('opts').style.visibility=smallView()?'hidden':'visible';
  document.getElementById('optContour').disabled=!dtm;}

/* ===================== 挑戰模式 ===================== */
function rnd(a){return a[(Math.random()*a.length)|0];}
function newDirQ(){ // 找答案明確的格子
  for(let t=0;t<500;t++){const r=2+((Math.random()*(R-4))|0),c=2+((Math.random()*(C-4))|0),i=r*C+c;
    const o=calcCell((rr,cc)=>Z[rr*C+cc],{R,C},r,c);if(o.best<0||o.best!==DIR[i])continue;
    const s=o.list.map(x=>x.slope).sort((a,b)=>b-a);if(s[0]-s[1]<4/K)continue;return {i,r,c,best:o.best};}
  return null;}
function newWsQ(){const cand=[];for(let i=0;i<N;i++){const r=(i/C)|0,c=i%C;if(r<3*K||c<3*K||r>R-1-3*K||c>C-1-3*K)continue;if(ACC[i]>=250*K*K&&ACC[i]<=900*K*K&&DIR[i]>=0&&ACC[nbr(i,DIR[i])]>ACC[i]*1.4)cand.push(i);}
  for(let t=0;t<300;t++){const o=rnd(cand),m=watershed(o);let edge=false,n=0;
    for(let i=0;i<N;i++)if(m[i]){n++;const r=(i/C)|0,c=i%C;if(r<2*K||c<2*K||r>R-1-2*K||c>C-1-2*K)edge=true;}
    if(!edge&&n>=200*K*K&&n<=900*K*K)return {o,truth:m,paint:new Uint8Array(N),revealed:false,erase:false};}
  const o=rnd(cand);return {o,truth:watershed(o),paint:new Uint8Array(N),revealed:false,erase:false};}
function newAccQ(){const big=[],mid=[],small=[];for(let i=0;i<N;i++){const r=(i/C)|0,c=i%C;if(r<4*K||c<4*K||r>R-1-4*K||c>C-1-4*K)continue;
    if(ACC[i]>=400*K*K)big.push(i);else if(ACC[i]>=40*K*K&&ACC[i]<200*K*K)mid.push(i);else if(ACC[i]<6)small.push(i);}
  for(let t=0;t<200;t++){const pts=[rnd(big),rnd(mid),rnd(small)];let ok=true;
    for(let a=0;a<3;a++)for(let b=a+1;b<3;b++){const d=Math.hypot(pts[a]%C-pts[b]%C,((pts[a]/C)|0)-((pts[b]/C)|0));if(d<16*K)ok=false;}
    if(ok){pts.sort(()=>Math.random()-.5);return {pts,revealed:false,pick:null};}}
  return null;}
function initChallenge(){const ch=S.ch;
  if(!ch.dir)ch.dir={q:newDirQ(),n:1,score:0,ans:null};
  if(!ch.ws)ch.ws=newWsQ();
  if(!ch.acc)ch.acc={q:newAccQ(),n:1,score:0};}
function drawChallenge(){initChallenge();const ch=S.ch;
  if(ch.tab==='dir'&&ch.dir.q){selBox(ch.dir.q.i);if(ch.dir.ans!==null){const {r,c}=ch.dir.q;arrowAt(c+.5,r+.5,ch.dir.q.best,2.6*K,'#111',2.6/cell);}}
  if(ch.tab==='ws'&&ch.ws){const w=ch.ws;
    fillMask(w.paint,'rgba(143,111,176,.55)');
    if(w.revealed){drawRivers(TH0,'#1f5fb4',.9);drawMaskOutline(w.truth,'#111',2.2);}
    else drawRivers(400*K*K,'#1f5fb4',.7);
    ring(w.o,'#111',1.4*K);const [x,y]=cellXY(w.o);label('出水口',x,y+2.6*K,13,'#111');}
  if(ch.tab==='acc'&&ch.acc.q){const q=ch.acc.q;q.pts.forEach((i,k)=>{const [x,y]=cellXY(i);ring(i,'#5b3d7a',1.5*K);
    label('ABC'[k]+(q.revealed?' '+ACC[i].toLocaleString():''),x,y-2.6*K,15,'#3d2556');});}
}
function paint(p){const w=S.ch.ws;const rad=1.6*K,rr0=Math.ceil(rad);
  for(let dr=-rr0;dr<=rr0;dr++)for(let dc=-rr0;dc<=rr0;dc++){if(Math.hypot(dr,dc)>rad)continue;const rr=p.r+dr,cc=p.c+dc;if(rr<0||cc<0||rr>=R||cc>=C)continue;w.paint[rr*C+cc]=w.erase?0:1;}
  req();}
function challengeClick(p){const ch=S.ch;
  if(ch.tab==='acc'&&ch.acc.q&&!ch.acc.q.revealed){let best=-1,bd=4;ch.acc.q.pts.forEach((i,k)=>{const d=Math.hypot(i%C-p.c,((i/C)|0)-p.r);if(d<bd*K){bd=d/K;best=k;}});if(best>=0)pickAcc(best);}
}
function pickAcc(k){const a=S.ch.acc,q=a.q;q.pick=k;q.revealed=true;const vals=q.pts.map(i=>ACC[i]);const right=vals[k]===Math.max(...vals);if(right)a.score++;draw();renderPanel();}
function renderChallenge(){initChallenge();const ch=S.ch;
  let h=`<div class="ctl"><div class="seg" id="chSeg"><button data-t="dir" aria-pressed="${ch.tab==='dir'}">判斷流向</button><button data-t="ws" aria-pressed="${ch.tab==='ws'}">預測集水區</button><button data-t="acc" aria-pressed="${ch.tab==='acc'}">累積量最大處</button></div></div><div class="body">`;
  if(ch.tab==='dir'){const d=ch.dir,q=d.q,get=(rr,cc)=>Z[rr*C+cc];
    h+=`<h2>關卡一：水往哪裡流？</h2><p>地圖上框起來的格子，四周 8 格的高程如下。<b>點你認為水會流去的那一格</b>。</p>
      <div class="score">第 <strong>${Math.min(d.n,5)}</strong> / 5 題　答對 <strong>${d.score}</strong> 題</div>`;
    const o=calcCell(get,{R,C},q.r,q.c);const pos=[[-1,-1],[-1,0],[-1,1],[0,-1],[0,0],[0,1],[1,-1],[1,0],[1,1]];
    h+=`<div class="nine">${pos.map(([dr,dc])=>{if(!dr&&!dc)return `<div class="c"><span class="v">${o.v}</span><span class="d">中心</span></div>`;
      const k=D8.findIndex(x=>x[0]===dr&&x[1]===dc),it=o.list[k];let cls='';
      if(d.ans!==null){if(k===o.best)cls='right';else if(k===d.ans)cls='wrong';}
      return `<button data-k="${k}" class="${cls}" ${d.ans!==null?'disabled':''}><span class="v">${it.w}</span>${d.ans!==null?`<span class="d">坡降 ${it.slope.toFixed(1)}</span>`:''}</button>`;}).join('')}</div>`;
    if(d.ans!==null){const ok=d.ans===o.best;h+=`<div class="hint ${ok?'good':'bad'}"><b>${ok?'答對了！':'差一點。'}</b>正確是往<b>${DNAME[o.best]}</b>。${[1,3,5,7].includes(o.best)||[1,3,5,7].includes(d.ans)?'別忘了斜角的高程差要除以 1.41。':''}</div>
      <div class="btnrow">${d.n<5?'<button class="btn" id="dNext">下一題</button>':`<span class="score">完成！共答對 <strong>${d.score}</strong> / 5</span><button class="btn" id="dAgain">再玩一次</button>`}</div>`;}
    h+=`<p class="note">提示：先找最低的鄰格，再檢查斜角的格子除以 1.41 後會不會輸給上下左右。</p>`;
  }
  if(ch.tab==='ws'){const w=ch.ws;
    h+=`<h2>關卡二：預測集水區</h2><p>地圖上標了一個<b>出水口</b>。用滑鼠（或手指）<b>塗出</b>你認為雨水會流到這個出水口的範圍。</p>
      <p class="note">提示：沿著出水口兩側的稜線（分水嶺）圈起來。勾選「等高線」會比較好判斷。</p>
      <div class="btnrow"><button class="btn ghost" id="wErase" aria-pressed="${w.erase}">${w.erase?'改回塗色':'橡皮擦'}</button><button class="btn ghost" id="wClear">全部清除</button><button class="btn" id="wReveal" ${w.revealed?'disabled':''}>對答案</button></div>`;
    if(w.revealed){let tp=0,pp=0,tt=0;for(let i=0;i<N;i++){if(w.paint[i])pp++;if(w.truth[i])tt++;if(w.paint[i]&&w.truth[i])tp++;}
      const iou=tp/(pp+tt-tp||1);
      h+=`<div class="stat"><div><span>重疊率</span><strong class="${iou>=.6?'good':'bad'}">${Math.round(iou*100)}%</strong></div><div><span>答案面積</span><strong>${tt} 格</strong></div><div><span>你塗的</span><strong>${pp} 格</strong></div></div>
        <div class="hint">黑線是電腦算出的集水區。重疊率 ＝ 兩者重疊的面積 ÷ 兩者合起來的面積。${iou>=.6?'很接近了！':'比較看看：哪一段稜線判斷錯了？'}</div>
        <div class="btnrow"><button class="btn" id="wNext">換一個出水口</button></div>`;}
  }
  if(ch.tab==='acc'){const a=ch.acc,q=a.q;
    h+=`<h2>關卡三：哪一點的累積量最大？</h2><p>地圖上有 A、B、C 三個點。哪一點<b>匯集的上游格數最多</b>？</p>
      <div class="score">第 <strong>${Math.min(a.n,5)}</strong> / 5 題　答對 <strong>${a.score}</strong> 題</div>
      <div class="choice">${['A','B','C'].map((t,k)=>`<button data-pick="${k}" ${q.revealed?'disabled':''}>${t}</button>`).join('')}</div>`;
    if(q.revealed){const vals=q.pts.map(i=>ACC[i]);const mx=vals.indexOf(Math.max(...vals));const ok=q.pick===mx;
      h+=`<div class="hint ${ok?'good':'bad'}"><b>${ok?'答對了！':'答案是 '+'ABC'[mx]+'。'}</b>A ${vals[0].toLocaleString()}、B ${vals[1].toLocaleString()}、C ${vals[2].toLocaleString()} 格。位在主流谷底、離出口愈近的點，上游範圍愈大。</div>
        <div class="btnrow">${a.n<5?'<button class="btn" id="aNext">下一題</button>':`<span class="score">完成！共答對 <strong>${a.score}</strong> / 5</span><button class="btn" id="aAgain">再玩一次</button>`}</div>`;}
    else h+=`<p class="note">提示：看等高線或陰影，判斷每個點是在山脊、山坡還是谷底。</p>`;
    h+=LEG_DTM;
  }
  h+='</div>';panel.innerHTML=h;bindPanel();
}
function bindChallenge(){const ch=S.ch;
  panel.querySelectorAll('#chSeg button').forEach(b=>b.onclick=()=>{ch.tab=b.dataset.t;draw();renderPanel();});
  panel.querySelectorAll('.nine button[data-k]').forEach(b=>b.onclick=()=>{const d=ch.dir;d.ans=+b.dataset.k;
    const o=calcCell((rr,cc)=>Z[rr*C+cc],{R,C},d.q.r,d.q.c);if(d.ans===o.best)d.score++;draw();renderPanel();});
  panel.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pickAcc(+b.dataset.pick));
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f;};
  on('dNext',()=>{ch.dir.q=newDirQ();ch.dir.ans=null;ch.dir.n++;draw();renderPanel();});
  on('dAgain',()=>{ch.dir={q:newDirQ(),n:1,score:0,ans:null};draw();renderPanel();});
  on('wErase',()=>{ch.ws.erase=!ch.ws.erase;renderPanel();});
  on('wClear',()=>{ch.ws.paint.fill(0);draw();});
  on('wReveal',()=>{let pp=0;for(let i=0;i<N;i++)if(ch.ws.paint[i])pp++;if(!pp){toast('先在地圖上塗出你預測的範圍');return;}ch.ws.revealed=true;draw();renderPanel();});
  on('wNext',()=>{ch.ws=newWsQ();draw();renderPanel();});
  on('aNext',()=>{ch.acc.q=newAccQ();ch.acc.n++;draw();renderPanel();});
  on('aAgain',()=>{ch.acc={q:newAccQ(),n:1,score:0};draw();renderPanel();});
}

/* ===================== 其他 ===================== */
let toastT=0;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600);}
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));S.rainRun=false;S.rain=null;S.sRain=null;syncOpts();resize();renderPanel();});
document.querySelectorAll('#resSeg button').forEach(b=>b.onclick=()=>{if(b.dataset.r===RESK)return;
  document.querySelectorAll('#resSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  setRes(b.dataset.r);S.th=TH0;S.outlet=OUT0;S.ws=watershed(OUT0);S.sel=null;S.upMask=null;S.rain=null;S.rainRun=false;
  S.ch={tab:S.ch.tab,dir:null,ws:null,acc:null};
  document.getElementById('gridN').textContent=C+' × '+R;
  if(smallView())S.view='big';syncOpts();resize();renderPanel();
  toast(RESK==='hi'?'高解析度：每格更細，河道與集水區邊界更平順；門檻值約 '+TH0+' 最接近課本':'一般網格：每格較大，方便點格子講解計算');});
document.getElementById('optContour').onchange=e=>{S.contour=e.target.checked;draw();};
document.getElementById('optGrid').onchange=e=>{S.grid=e.target.checked;draw();};
document.getElementById('optShade').onchange=e=>{S.shade=e.target.checked;draw();};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(S.mode!=='explain')return;
  if(e.key==='ArrowRight'&&S.step<4)goStep(S.step+1);else if(e.key==='ArrowLeft'&&S.step>1)goStep(S.step-1);
  else if(/^[1-4]$/.test(e.key))goStep(+e.key);});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(box);
syncOpts();renderPanel();resize();
</script>

</body>
</html>
