<style>
:root{

  --young:#1F9A8A; --work:#4467A8; --old:#D2861F; --birth:#1F9A8A; --death:#B4472F; --accent:#4467A8;
  --hi:#1B2B3A; --ok:#2E8B57; --bad:#C0392B; --chip:#E6ECF2;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1921; --paper:#16232E; --ink:#E4ECF2; --muted:#9DB0C0; --line:#2A3B4A; --grid:#1F2F3C; --axis:#5F7587;
    --young:#4CC6B4; --work:#7C9BDB; --old:#F0A94A; --birth:#4CC6B4; --death:#F07A5C; --accent:#7C9BDB;
    --hi:#FFFFFF; --ok:#5CC98A; --bad:#F07A5C; --chip:#22323F;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1921; --paper:#16232E; --ink:#E4ECF2; --muted:#9DB0C0; --line:#2A3B4A; --grid:#1F2F3C; --axis:#5F7587;
  --young:#4CC6B4; --work:#7C9BDB; --old:#F0A94A; --birth:#4CC6B4; --death:#F07A5C; --accent:#7C9BDB;
  --hi:#FFFFFF; --ok:#5CC98A; --bad:#F07A5C; --chip:#22323F;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px}
.app{height:100%;max-width:1500px;margin:0 auto;padding:12px 18px 10px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:clamp(1.4rem,2.2vw,2rem);margin:0;line-height:1.25}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:5px 14px;cursor:pointer}
.tab kbd{margin-right:4px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] kbd{color:inherit;border-color:currentColor}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.stage{display:flex;flex-direction:column;min-height:0;padding:8px 10px 6px}
.stage-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 4px}
.big{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.95rem;padding:0 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.proj{border-color:var(--old);color:var(--old)}
.pyr{flex:1;min-height:0;display:flex}
.pyr svg{width:100%;height:100%;display:block}
.pyr text{fill:var(--muted);font-family:inherit}
.hint{font-size:1rem;color:var(--muted);padding:0 4px;min-height:1.5em}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:1rem;color:var(--muted);padding:0 4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding:12px 14px}
.side>*{flex-shrink:0}
.side h2{font-size:1.05rem;margin:0 0 4px;color:var(--muted);font-weight:500}
.chips{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.chip{font:inherit;font-size:1rem;color:var(--ink);background:var(--chip);border:2px solid transparent;border-radius:6px;padding:4px 0;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--paper);font-weight:700}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.ctl{flex-wrap:nowrap;gap:6px}
.row.ctl .btn{padding:4px 7px;white-space:nowrap}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);height:28px}
button.btn{font:inherit;font-size:1rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
button.btn:hover{border-color:var(--ink)}
button.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--grid);padding:2px 0}
.stat span{color:var(--muted)}
.stat b{font-size:1.08rem}
.seg{display:flex;height:28px;border-radius:5px;overflow:hidden;font-size:1rem;font-weight:700;color:#fff}
.seg div{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden}
.mini svg{width:100%;height:auto;display:block}
.mini text{fill:var(--muted);font-family:inherit}
.slider-row{display:grid;grid-template-columns:4.2em 1fr 3.6em;align-items:center;gap:8px}
.slider-row label{font-weight:700}
.slider-row output{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.presets .btn{padding:4px 0}
.stagebox{border-left:6px solid var(--accent);padding:6px 10px;background:var(--chip);border-radius:4px}
.stagebox b{display:block;font-size:1.1rem}
.quiz-q{font-size:1.15rem;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--chip);border:2px solid transparent;border-radius:6px;padding:8px 6px;cursor:pointer;text-align:center}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--paper))}
.explain{font-size:1rem;background:var(--chip);border-radius:6px;padding:8px 10px}
.score{color:var(--muted)}
kbd{font-family:inherit;font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.src{font-size:.9rem;color:var(--muted);margin:0}
[hidden]{display:none!important}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  main{grid-template-columns:1fr}
  .stage{height:68vh;min-height:380px}
  .side{overflow:visible}
  .seg{font-size:.85rem}
  .row.ctl{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<body>
<div class="app">
<header>
  <h1>人口金字塔與人口轉型</h1>
  <div class="tabs" role="tablist" aria-label="分頁">
    <button class="tab" role="tab" data-tab="lab" aria-selected="true"><kbd>1</kbd>人口轉型實驗室</button>
    <button class="tab" role="tab" data-tab="real" aria-selected="false"><kbd>2</kbd>真實國家 1950–2100</button>
    <button class="tab" role="tab" data-tab="quiz" aria-selected="false"><kbd>3</kbd>判讀練習</button>
  </div>
</header>
<main>
  <section class="panel stage" aria-label="人口金字塔">
    <div class="stage-head">
      <div id="stTitle" class="big"></div>
      <div id="stSub" class="hint"></div>
    </div>
    <div class="pyr" id="pyr"></div>
    <div class="legend">
      <span><i style="background:var(--young)"></i>幼年 0–14 歲</span>
      <span><i style="background:var(--work)"></i>青壯年 15–64 歲</span>
      <span><i style="background:var(--old)"></i>老年 65 歲以上</span>
      <span id="lgPin" hidden>┄ 釘選的對照</span>
    </div>
    <div class="hint" id="pyrHint"></div>
  </section>

  <!-- 分頁 1：人口轉型實驗室 -->
  <section class="panel side" id="side-lab" aria-label="人口轉型實驗室">
    <div>
      <div class="slider-row"><label for="sB" style="color:var(--birth)">出生率</label><input type="range" id="sB" min="5" max="50" step="1"><output id="oB"></output></div>
      <div class="slider-row"><label for="sD" style="color:var(--death)">死亡率</label><input type="range" id="sD" min="5" max="45" step="1"><output id="oD"></output></div>
    </div>
    <div class="presets" aria-label="各階段範例">
      <button class="btn" data-pre="0">一</button><button class="btn" data-pre="1">二</button><button class="btn" data-pre="2">三</button><button class="btn" data-pre="3">四</button><button class="btn" data-pre="4">五</button>
    </div>
    <div class="stagebox" id="labStage"></div>
    <div class="row ctl">
      <button class="btn" id="bPrev" aria-label="上一步">←</button>
      <button class="btn" id="bNext">下一個 5 年 →</button>
      <button class="btn" id="bPlay">▶ 自動播放</button>
      <button class="btn spd" title="切換播放速度">慢速</button>
      <button class="btn" id="bReset">重來</button>
    </div>
    <div class="stats" id="labStats"></div>
    <div class="seg" id="labSeg"></div>
    <div class="mini" id="labChart"></div>
  </section>

  <!-- 分頁 2：真實國家 -->
  <section class="panel side" id="side-real" aria-label="真實國家" hidden>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn" id="rPlay" aria-label="播放年份">▶</button>
      <button class="btn spd" title="切換播放速度">慢速</button>
      <input type="range" id="rYear" min="1950" max="2100" step="1" aria-label="年份">
    </div>
    <div class="row">
      <button class="btn" id="rUnit">顯示：百分比</button>
      <button class="btn" id="rPin">📌 釘選目前畫面當對照</button>
    </div>
    <div class="seg" id="realSeg"></div>
    <div class="stats" id="realStats"></div>
    <div class="mini" id="realChart"></div>
  </section>

  <!-- 分頁 3：判讀練習 -->
  <section class="panel side" id="side-quiz" aria-label="判讀練習" hidden>
    <div class="row between"><span class="score" id="qScore"></span><button class="btn" id="qNext">下一題 →</button></div>
    <div class="quiz-q" id="qText"></div>
    <div class="seg" id="qSeg" hidden></div>
    <div class="opts" id="qOpts"></div>
    <div class="explain" id="qExplain" hidden></div>
  </section>
</main>
<p class="src">資料：聯合國《世界人口展望 2024》（UN DESA, World Population Prospects 2024，中推估；2023 年以前為估計值，2024 年起為推估）。實驗室分頁為理想化模型：不含遷移、每步 5 年，僅供教學示意。</p>
</div>

function ind(P){ // P：[男 21 組, 女 21 組]，單位百人

}
function stageOf(b,d){
  if(b>=30&&d>=25) return 0;
  if(b>=30&&d<25) return 1;
  if(b>=15&&b<30&&d<15) return 2;
  if(b<15&&b>=d) return 3;
  if(b<d&&b<15) return 4;
  return -1;
}
function agedTag(po){ return po>=20?'超高齡社會':po>=14?'高齡社會':po>=7?'高齡化社會':''; }
function fmtPeople(hundreds){
  const n=hundreds*100;
  if(n>=1e8) return (n/1e8).toFixed(2)+' 億';
  if(n>=1e4) return Math.round(n/1e4).toLocaleString('zh-TW')+' 萬';

const f1=v=>(Math.round(v*10)/10).toFixed(1);

/* ===== 世代人口推估（實驗室用） ===== */
const lg=l=>l>=1?-9:l<=0?9:0.5*Math.log((1-l)/l);
const YH={m:DATA.std.high.m.map(lg),f:DATA.std.high.f.map(lg)};
const YL={m:DATA.std.low.m.map(lg),f:DATA.std.low.f.map(lg)};
function survival(w,s){
  const l=[1]; for(let i=1;i<22;i++) l.push(1/(1+Math.exp(2*((1-w)*YH[s][i]+w*YL[s][i]))));
  const L=[0.3*l[0]+0.7*l[1]+2*(l[1]+l[2])];
  for(let g=1;g<20;g++) L.push(2.5*(l[g+1]+l[g+2]));
  L.push(l[21]*2.2);
  const S=[]; for(let g=0;g<19;g++) S.push(L[g+1]/L[g]);
  S.push(L[20]/(L[19]+L[20]));
  return {S,b:L[0]/5};
}
function project(P,cbr,cdr,w){
  const out=new Array(2*GROUPS).fill(0);
  const sv={m:survival(w,'m'),f:survival(w,'f')};
  ['m','f'].forEach((s,si)=>{const o=si*GROUPS,S=sv[s].S;
    for(let g=0;g<19;g++) out[o+g+1]=P[o+g]*S[g];
    out[o+20]=(P[o+19]+P[o+20])*S[19];});
  let survived=0; for(const v of out) survived+=v;
  let start=0; for(const v of P) start+=v;
  let Pm=start,B=0,nm=0,nf=0;
  for(let k=0;k<3;k++){ B=cbr/1000*5*Pm; nm=B*105/205*sv.m.b; nf=B*100/205*sv.f.b; Pm=(start+survived+nm+nf)/2; }
  out[0]=nm; out[GROUPS]=nf;
  return {P:out,cdr:(start-survived+B-nm-nf)/(5*Pm)*1000};
}
function step(P,cbr,cdr){ // 調整死亡模式，使粗死亡率等於 cdr
  let lo=-3,hi=3;
  for(let i=0;i<50;i++){const m=(lo+hi)/2; if(project(P,cbr,cdr,m).cdr>cdr) lo=m; else hi=m;}
  return project(P,cbr,cdr,(lo+hi)/2);
}

let PW=760,SIDE=0; const PH=430,TOP=22,BOT=34,MID=60,PCTMAX=11;
const svg=document.createElementNS(SVGNS,'svg');

function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||svg).appendChild(e); return e;}
const bandH=(PH-TOP-BOT)/GROUPS;

function drawPyramid(P,o){

  const FS=PW<600?17:14;

  const val=v=>o.mode==='pct'?100*v/T:v*100;
  const max=o.max, sc=SIDE/max, cx=PW/2;
  // 格線與刻度
  const ticks=niceTicks(max);
  for(const t of ticks){ for(const sgn of [-1,1]){ if(t===0&&sgn>0) continue;
    const x=cx+sgn*(MID/2+t*sc);

  }}

  const lf=el('text',{x:cx+MID/2+4,y:TOP-6,'font-size':FS+1,'font-weight':700}); lf.textContent='女 →';
  const unit=el('text',{x:PW-6,y:TOP-6,'text-anchor':'end','font-size':FS}); unit.textContent=o.mode==='pct'?'橫軸：占總人口比例':'橫軸：人數'; if(PW<600) unit.remove();
  for(let i=0;i<GROUPS;i++){
    const y=yOf(i)+1, h=bandH-2;
    const vm=val(P[i]), vf=val(P[i+GROUPS]);
    const tracked=o.track===i;
    const g=el('g',{'data-g':i,style:o.onPick?'cursor:pointer':''});
    const rm=el('rect',{x:cx-MID/2-vm*sc,y,width:Math.max(vm*sc,0),height:h,fill:colorOf(i),opacity:o.track!=null&&!tracked?.45:1},g);
    const rf=el('rect',{x:cx+MID/2,y,width:Math.max(vf*sc,0),height:h,fill:colorOf(i),opacity:(o.track!=null&&!tracked?.45:1)*.78},g);
    if(tracked){ for(const r of [rm,rf]){ r.setAttribute('stroke','var(--hi)'); r.setAttribute('stroke-width',2.5); } }
    const tip=el('title',{},g); tip.textContent=`${AGE(i)} 歲　男 ${fmtV(vm,o.mode)}　女 ${fmtV(vf,o.mode)}`;
    // 透明點擊區（含年齡標籤）
    el('rect',{x:10,y:yOf(i),width:PW-20,height:bandH,fill:'transparent'},g);
    if(o.onPick) g.addEventListener('click',()=>o.onPick(i));
    if(i%2===0||PW>=600){ const a=el('text',{x:cx,y:yOf(i)+bandH/2+5,'text-anchor':'middle','font-size':FS,'font-weight':tracked?700:400},g); a.textContent=AGE(i); if(tracked)a.setAttribute('style','fill:var(--hi)'); }
  }
  if(o.pin){ // 釘選的輪廓
    let Tp=0; for(const v of o.pin.P) Tp+=v;
    const pv=v=>o.mode==='pct'?100*v/Tp:v*100;
    for(const side of [-1,1]){
      let d='';
      for(let i=0;i<GROUPS;i++){const v=pv(o.pin.P[i+(side>0?GROUPS:0)])*sc; const x=cx+side*(MID/2+v);
        d+=(i?'L':'M')+x+','+(yOf(i)+bandH)+'L'+x+','+yOf(i);}
      el('path',{d,fill:'none',stroke:'var(--ink)','stroke-width':2,'stroke-dasharray':'5 4'});
    }

}
function fmtV(v,mode){return mode==='pct'?f1(v)+'%':fmtPeople(v/100);}
function shortNum(n){ if(n>=1e8) return (n/1e8)+'億'; if(n>=1e4) return (n/1e4)+'萬'; return String(n); }
function niceTicks(max){
  const raw=max/4, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p;
  const st=(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; const out=[];
  for(let t=0;t<=max+1e-9;t+=st) out.push(Math.round(t*1000)/1000);
  return out;
}

function drawRates(box,xs,b,d,o){
  const W=380,H=170,L=32,R=22,T=28,B=28;
  const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox',`0 0 ${W} ${H}`); s.setAttribute('role','img');
  s.setAttribute('aria-label','出生率與死亡率變化圖');
  const mk=(tag,a)=>{const e=document.createElementNS(SVGNS,tag); for(const k in a)e.setAttribute(k,a[k]); s.appendChild(e); return e;};
  const x0=o.x0,x1=o.x1,ymax=o.ymax||60;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-v/ymax)*(H-T-B);
  for(let v=0;v<=ymax;v+=20){ mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:'var(--grid)'}); const t=mk('text',{x:L-4,y:Y(v)+5,'text-anchor':'end','font-size':15}); t.textContent=v; }
  for(const xt of o.xticks){ const t=mk('text',{x:X(xt),y:H-6,'text-anchor':'middle','font-size':15}); t.textContent=o.xfmt?o.xfmt(xt):xt; }
  if(xs.length>1){
    let area='M'+X(xs[0])+','+Y(b[0]);
    for(let i=1;i<xs.length;i++) area+='L'+X(xs[i])+','+Y(b[i]);
    for(let i=xs.length-1;i>=0;i--) area+='L'+X(xs[i])+','+Y(d[i]);
    mk('path',{d:area+'Z',fill:'var(--birth)',opacity:.12});
    const line=(arr,col,from,to,dash)=>{let p=''; for(let i=from;i<=to;i++) p+=(p?'L':'M')+X(xs[i])+','+Y(arr[i]); mk('path',{d:p,fill:'none',stroke:col,'stroke-width':2.5,'stroke-dasharray':dash||''});};
    const split=o.split!=null?Math.min(o.split,xs.length-1):xs.length-1;
    line(b,'var(--birth)',0,split); line(d,'var(--death)',0,split);
    if(split<xs.length-1){ line(b,'var(--birth)',split,xs.length-1,'5 4'); line(d,'var(--death)',split,xs.length-1,'5 4'); }
  }
  if(o.cursor!=null){ mk('line',{x1:X(o.cursor),x2:X(o.cursor),y1:T,y2:H-B,stroke:'var(--ink)','stroke-width':1.5}); }
  const lb=mk('text',{x:L,y:16,'font-size':15,'font-weight':700}); lb.textContent='— 出生率';
  const ld=mk('text',{x:L+88,y:16,'font-size':15,'font-weight':700}); ld.textContent='— 死亡率';
  const lu=mk('text',{x:L+176,y:16,'font-size':15}); lu.textContent=o.note||'（‰）';
  lb.setAttribute('style','fill:var(--birth)'); ld.setAttribute('style','fill:var(--death)');
  box.textContent=''; box.appendChild(s);
}

  for(let k=0;k<80;k++){ P=step(P,40,35).P; const t=P.reduce((a,v)=>a+v,0); P=P.map(v=>v*1e4/t); }

}

function setSliders(b,d){ lab.b=b; lab.d=d; $('sB').value=b; $('sD').value=d; $('oB').textContent=b+'‰'; $('oD').textContent=d+'‰'; }
function labNext(){
  const h=lab.hist[lab.hist.length-1]; if(h.t>=300) return;
  if(!lab.custom){ const [b,d]=pathAt(lab.hist.length); setSliders(b,d); } // 跟著典型路徑走一步（和自動播放相同）

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function pctVec(P){const T=P.reduce((a,v)=>a+v,0); return P.map(v=>v/T);}
function dist(P,Q){const a=pctVec(P),b=pctVec(Q); let s=0; for(let i=0;i<a.length;i++) s+=Math.abs(a[i]-b[i]); return s;}
function dataStage(c,i){ // 只取特徵明確的年份
  const b=c.cbr[i],d=c.cdr[i];
  if(b>=36&&d<=22&&b-d>=20) return 1;
  if(b>=17&&b<=28&&d<=10) return 2;
  if(b<=13&&b>=d+0.8) return 3;
  if(b<=d-1.5) return 4;
  return -1;
}
const QTYPES=['stage','country','dep','year'];
function newQuestion(){
  const type=QTYPES[quiz.n%QTYPES.length];
  let q=null;
  for(let tries=0;tries<200&&!q;tries++) q=makeQ(type);
  quiz.cur=q; quiz.answered=false; showQ();
}
function makeQ(type){
  if(type==='stage'){
    const iso=pick(ISO), y=1950+rnd(151), s=dataStage(C[iso],y-1950);
    if(s<0) return null;
    return {type,iso,y,P:C[iso].pop[y-1950],text:'這個金字塔最可能處於人口轉型的哪一個階段？',
      opts:[1,2,3,4].map(k=>({label:STAGES[k].name,ok:k===s,sub:STAGES[k].feat})),
      why:`這是 ${C[iso].name} ${y} 年：出生率 ${f1(C[iso].cbr[y-1950])}‰、死亡率 ${f1(C[iso].cdr[y-1950])}‰，屬於「${STAGES[s].feat}」，${STAGES[s].growth}。`};
  }
  if(type==='country'){
    const y=pick([1960,1980,2000,2024,2050]), iso=pick(ISO), P=C[iso].pop[y-1950];
    const others=shuffle(ISO.filter(k=>k!==iso&&dist(C[k].pop[y-1950],P)>0.35)).slice(0,3);
    if(others.length<3) return null;
    return {type,iso,y,P,text:`${y} 年，下面哪一個國家的人口金字塔是這個形狀？`,
      opts:shuffle([iso,...others]).map(k=>({label:C[k].name,ok:k===iso})),
      why:`答案是 ${C[iso].name}。幼年 ${f1(ind(P).py)}%、老年 ${f1(ind(P).po)}%；${ind(P).py>30?'底部寬，出生率高':ind(P).po>14?'頂部寬、底部窄，少子化與高齡化明顯':'底部收窄中，出生率正在下降'}。`};
  }
  if(type==='dep'){
    const iso=pick(ISO), y=1950+5*rnd(31), P=C[iso].pop[y-1950], I=ind(P);
    const askAging=quiz.n%8===2;
    const r=v=>Math.round(v);
    const ans=askAging?r(I.aging):r(I.dep);
    const cands=askAging?[r(I.po/I.pw*100),r(I.dep),r(I.py/I.po*100)]:[r(I.aging),r(I.po/I.pw*100),r(I.py+I.po)];
    const uniq=[...new Set(cands.filter(v=>v!==ans&&isFinite(v)&&v>0))];
    while(uniq.length<3){ const v=r(ans*(0.6+Math.random()*0.8)); if(v!==ans&&!uniq.includes(v)) uniq.push(v); }
    return {type,iso,y,P,seg:true,
      text:askAging?'依照三段年齡的比例，老化指數大約是多少？':'依照三段年齡的比例，扶養比大約是多少？',
      opts:shuffle([ans,...uniq.slice(0,3)]).map(v=>({label:String(v),ok:v===ans})),
      why:askAging?`老化指數＝老年人口 ÷ 幼年人口 × 100 ＝ ${f1(I.po)} ÷ ${f1(I.py)} × 100 ≈ ${ans}（${C[iso].name} ${y} 年）`
                  :`扶養比＝（幼年＋老年）÷ 青壯年 × 100 ＝（${f1(I.py)}＋${f1(I.po)}）÷ ${f1(I.pw)} × 100 ≈ ${ans}（${C[iso].name} ${y} 年）`};
  }
  if(type==='year'){
    const iso=pick(['TWN','VNM','KOR','CHN','JPN']), years=[1970,2000,2030,2060], y=pick(years);
    return {type,iso,y,P:C[iso].pop[y-1950],text:`這是${C[iso].name}的人口金字塔，最可能是哪一年？`,
      opts:years.map(k=>({label:String(k),ok:k===y})),
      why:`答案是 ${y} 年${y>LASTEST?'（推估）':''}。年份越晚，出生的人越少、老年人越多，金字塔的底部越窄、頂部越寬。`};
  }
}
function showQ(){
  const q=quiz.cur;
  $('stTitle').textContent='這是哪裡？哪一年？';
  $('stSub').textContent='';
  drawPyramid(q.P,{mode:'pct',max:PCTMAX});
  $('lgPin').hidden=true; $('pyrHint').textContent='';
  $('qText').textContent=q.text;
  $('qSeg').hidden=!q.seg; if(q.seg) seg($('qSeg'),ind(q.P));
  const box=$('qOpts'); box.textContent='';
  q.opts.forEach(o=>{const b=document.createElement('button'); b.className='opt'; b.textContent=o.label; if(o.sub)b.title=o.sub;
    b.onclick=()=>answer(o); box.appendChild(b);});
  $('qExplain').hidden=true;
  $('qScore').textContent=quiz.n?`答對 ${quiz.ok} ／ ${quiz.n} 題`:'看金字塔，選出答案';
  if(quiz.answered) markAnswer();
}
function answer(o){
  if(quiz.answered) return; quiz.answered=true; quiz.picked=o; quiz.n++; if(o.ok) quiz.ok++;
  markAnswer();
}
function markAnswer(){
  const q=quiz.cur, o=quiz.picked;
  $('qOpts').querySelectorAll('.opt').forEach((b,i)=>{ if(q.opts[i].ok) b.classList.add('right'); else if(q.opts[i]===o) b.classList.add('wrong'); });
  $('qExplain').hidden=false; $('qExplain').textContent=(o.ok?'答對了！':'再想想：')+q.why;
  $('stTitle').innerHTML=`${C[q.iso].name} ${q.y}${q.y>LASTEST?'<span class="tag proj">推估</span>':''}`;
  $('qScore').textContent=`答對 ${quiz.ok} ／ ${quiz.n} 題`;
}
$('qNext').onclick=newQuestion;

/* ===== 分頁切換與快捷鍵 ===== */
let tab='lab';
function setTab(t){
  tab=t; stopPlay(); stopReal();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  for(const k of ['lab','real','quiz']) $('side-'+k).hidden=k!==t;
  if(t==='lab') renderLab(); else if(t==='real') renderReal(); else { if(!quiz.cur) newQuestion(); else showQ(); }
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tg=e.target; if(tg&&(tg.tagName==='INPUT'&&tg.type!=='range'||tg.tagName==='TEXTAREA')) return;
  if(e.key==='1'||e.key==='2'||e.key==='3'){ setTab(['lab','real','quiz'][+e.key-1]); return; }
  if(e.key==='f'||e.key==='F'){ try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(_){} return; }
  if(e.key==='r'||e.key==='R'){ if(tab==='lab') labReset(); else if(tab==='real'){ stopReal(); real.year=2024; real.track=null; real.pin=null; $('rPin').textContent='📌 釘選目前畫面當對照'; renderReal(); } else { quiz.n=0; quiz.ok=0; newQuestion(); } return; }
  if(tg&&tg.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')) return; // 拉桿自己處理方向鍵
  if(e.key==='ArrowRight'){ e.preventDefault(); if(tab==='lab'){stopPlay();labNext();} else if(tab==='real'){stopReal();real.year=Math.min(2100,real.year+5);renderReal();} else newQuestion(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); if(tab==='lab'){stopPlay();labPrev();} else if(tab==='real'){stopReal();real.year=Math.max(1950,real.year-5);renderReal();} }
  else if(e.key===' '&&!(tg&&tg.tagName==='BUTTON')){ e.preventDefault(); if(tab==='lab') playLab(); else if(tab==='real') playReal(); }
});
labReset();
setTab('lab');
let rz=null; addEventListener('resize',()=>{clearTimeout(rz); rz=setTimeout(()=>{ if(tab==='lab') renderLab(); else if(tab==='real') renderReal(); else if(quiz.cur) showQ(); },120);});
})();
</script>
