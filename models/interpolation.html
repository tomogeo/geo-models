<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空間內插：從測站到等雨量線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1f2a36; --ink2:#566372; --line:#d3dae2;
  --accent:#2f4f8a; --accent-soft:#e3eaf6; --step:#8f6fb0; --step-soft:#efe8f6;
  --warn:#b4412f; --ok:#2e7d55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161b22; --paper:#1f262f; --ink:#e6ebf1; --ink2:#9aa7b5; --line:#34404d;
    --accent:#8fb0ea; --accent-soft:#26344a; --step:#bb9bdc; --step-soft:#342a42;
    --warn:#f08a74; --ok:#6fd39f;
  }
}
:root[data-theme="dark"]{
  --bg:#161b22; --paper:#1f262f; --ink:#e6ebf1; --ink2:#9aa7b5; --line:#34404d;
  --accent:#8fb0ea; --accent-soft:#26344a; --step:#bb9bdc; --step-soft:#342a42;
  --warn:#f08a74; --ok:#6fd39f;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;
  padding:18px clamp(14px,3vw,32px) 12px}
.top h1{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:.02em}
.top p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.switches{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-size:15px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10161d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10161d}}
.seg button:disabled{opacity:.4;cursor:not-allowed}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:0 clamp(14px,3vw,32px) 24px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
.mapcol{min-width:0}
.mapbox{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;justify-content:center;overflow:hidden}
canvas#map{display:block;touch-action:none;border-radius:4px;max-width:100%}
.maptools{position:absolute;left:18px;top:18px;display:flex;gap:6px;flex-wrap:wrap}
.maptools .seg{box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:640px){.mapbox{flex-direction:column;align-items:center}.maptools{position:static;margin-bottom:8px;justify-content:center}.maptools:empty{display:none}}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-top:8px;font-size:14px;color:var(--ink2)}
.mapfoot label{display:inline-flex;align-items:center;gap:6px;margin-right:14px;cursor:pointer}
.pop{position:absolute;z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:14px;min-width:190px}
.pop .row{display:flex;align-items:center;gap:8px}
.pop input{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pop .del{margin-top:8px;border:0;background:none;color:var(--warn);padding:0;font-size:14px}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:6px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.92}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;min-width:0}
.steps{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 4px 7px;
  display:flex;flex-direction:column;align-items:center;gap:0;font-size:13px;color:var(--ink2);line-height:1.3}
.steps b{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--step-soft);color:var(--step);font-size:15px;margin-bottom:3px}
.steps button[aria-current="step"]{border-color:var(--step);color:var(--ink);font-weight:500}
.steps button[aria-current="step"] b{background:var(--step);color:#fff}
.body h2{margin:0 0 4px;font-size:19px}
.body p{margin:0 0 10px;color:var(--ink2);font-size:15px}
.body .lead{color:var(--ink);font-size:16px}
.ctl{margin:12px 0}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink2);margin-bottom:4px}
.ctl .lab strong{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.ctl .seg{width:100%}
.ctl .seg button{flex:1;padding:5px 6px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:9px 16px;font-size:16px;font-weight:500}
:root[data-theme="dark"] .btn{color:#10161d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#10161d}}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{display:flex;gap:10px;margin:10px 0}
.stat div{flex:1;background:var(--bg);border-radius:9px;padding:8px 10px}
.stat span{display:block;font-size:13px;color:var(--ink2)}
.stat strong{font-size:22px;font-variant-numeric:tabular-nums}
.formula{background:var(--step-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.formula .eq{font-size:17px;text-align:center;margin:2px 0 6px;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
.formula small{display:block;color:var(--ink2);font-size:13px;line-height:1.5}
.detail{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.detail h3{margin:0 0 6px;font-size:16px}
table.w{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.w th{font-weight:500;color:var(--ink2);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
table.w th:first-child,table.w td:first-child{text-align:left}
table.w td{text-align:right;padding:3px 4px}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--step);vertical-align:middle;margin-right:4px}
.result{margin-top:8px;font-size:16px}
.result strong{font-size:20px}
.hint{font-size:14px;color:var(--ink2);background:var(--bg);border-radius:9px;padding:8px 10px;margin:10px 0}
.legend{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:13px;color:var(--ink2)}
.legend .t{color:var(--ink);font-size:14px;font-weight:500;margin-bottom:6px}
.legend canvas{width:calc(100% - 24px);margin:0 12px;height:14px;border-radius:3px;display:block}
.ticks{position:relative;height:18px;margin:0 12px;font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);top:2px}
.classes{display:flex;flex-direction:column;gap:3px}
.classes div{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.55);flex:none}
.cline{display:inline-block;width:22px;height:0;border-top:2px solid #283d8f;vertical-align:middle;margin-right:6px}
.score{font-size:15px;margin:10px 0}
.score strong{font-size:26px}
.good{color:var(--ok)} .bad{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top">
  <div>
    <h1>空間內插</h1>
    <p>從測站的點資料，推估出整片連續分布，再拉出等值線（課本圖 2-27）</p>
  </div>
  <div class="switches">

      <button data-m="challenge" aria-pressed="false">挑戰：少少的測站</button>
    </div>
  </div>
</header>

<main class="layout">

      <div class="toast" id="toast" role="status"></div>
    </div>
    <div class="mapfoot">

        <label><input type="checkbox" id="optVal"> 測站數值</label>
      </div>
      <div id="srcNote"></div>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</main>

function palColor(name,t){
  const s=PAL[name]; t=Math.max(0,Math.min(1,t));
  for(let i=1;i<s.length;i++){ if(t<=s[i][0]){ const a=s[i-1],b=s[i],f=(t-a[0])/(b[0]-a[0]||1);
    return [a[1][0]+(b[1][0]-a[1][0])*f,a[1][1]+(b[1][1]-a[1][1])*f,a[1][2]+(b[1][2]-a[1][2])*f]; } }
  return s[s.length-1][1];
}

function inRing(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];
  if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}

/* ---------- 反距離權重 ---------- */
function computeGrid(sts,gkm,p,nn){
  const gu=gkm/KM, cols=Math.ceil(FW/gu), rows=Math.ceil(FH/gu), n=sts.length;
  const vals=new Float32Array(cols*rows), inT=new Uint8Array(cols*rows);
  const d=new Float64Array(n), idx=new Array(n);
  const k=(nn==='all'||nn>=n)?n:nn;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const cx=(i+.5)*gu, cy=(j+.5)*gu; let exact=-1;
    for(let s=0;s<n;s++){const dx=sts[s].x-cx,dy=sts[s].y-cy;d[s]=Math.sqrt(dx*dx+dy*dy)*KM;idx[s]=s;if(d[s]<0.005)exact=s;}
    let v;
    if(n===0)v=NaN;
    else if(exact>=0)v=sts[exact].v;
    else{
      let use=idx; if(k<n){use=idx.slice().sort((a,b)=>d[a]-d[b]).slice(0,k);}
      let sw=0,sv=0; for(const s of use){const w=1/Math.pow(d[s],p);sw+=w;sv+=w*sts[s].v;} v=sv/sw;
    }
    vals[j*cols+i]=v; inT[j*cols+i]=inTaipei(cx,cy)?1:0;
  }
  return {gu,cols,rows,vals,inT,gkm};
}
function idwDetail(x,y,sts,p,nn){
  const n=sts.length; const arr=sts.map((s,i)=>({i,s,d:Math.hypot(s.x-x,s.y-y)*KM})).sort((a,b)=>a.d-b.d);
  const k=(nn==='all'||nn>=n)?n:nn; const use=arr.slice(0,k);
  if(use.length&&use[0].d<0.005){use.forEach(u=>u.w=0);use[0].w=1;return {v:use[0].s.v,use,exact:true};}
  let sw=0,sv=0; use.forEach(u=>{u.w=1/Math.pow(u.d,p);sw+=u.w;sv+=u.w*u.s.v;}); use.forEach(u=>u.w/=sw);
  return {v:sv/sw,use,exact:false};
}
function pointValue(x,y,sts){ // 單點推估（挑戰模式量測用）
  let sw=0,sv=0; for(const s of sts){const d=Math.hypot(s.x-x,s.y-y)*KM; if(d<0.005)return s.v; const w=1/(d*d); sw+=w;sv+=w*s.v;} return sv/sw;
}
function ensureGrid(){

}

/* ---------- 等值線（marching squares） ---------- */
function contourSegments(g,level){
  const {cols,rows,gu,vals}=g, segs=[];
  const P=(i,j)=>[(i+.5)*gu,(j+.5)*gu];
  for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){
    const a=vals[j*cols+i],b=vals[j*cols+i+1],c=vals[(j+1)*cols+i+1],d=vals[(j+1)*cols+i];
    let code=(a>=level?8:0)|(b>=level?4:0)|(c>=level?2:0)|(d>=level?1:0);
    if(code===0||code===15)continue;
    const [x0,y0]=P(i,j),x1=x0+gu,y1=y0+gu;
    const T=[x0+gu*(level-a)/(b-a),y0], R=[x1,y0+gu*(level-b)/(c-b)], B=[x0+gu*(level-d)/(c-d),y1], L=[x0,y0+gu*(level-a)/(d-a)];
    const add=(p,q)=>segs.push([p[0],p[1],q[0],q[1]]);
    const mid=(a+b+c+d)/4;
    switch(code){
      case 1:case 14:add(L,B);break; case 2:case 13:add(B,R);break; case 3:case 12:add(L,R);break;
      case 4:case 11:add(T,R);break; case 6:case 9:add(T,B);break; case 7:case 8:add(L,T);break;
      case 5: if(mid>=level){add(L,T);add(B,R);}else{add(L,B);add(T,R);} break;
      case 10: if(mid>=level){add(L,B);add(T,R);}else{add(L,T);add(B,R);} break;
    }
  }
  return segs;
}
function levelsFor(g,interval){
  let mn=Infinity,mx=-Infinity; for(const v of g.vals){if(v<mn)mn=v;if(v>mx)mx=v;}
  const out=[]; for(let l=Math.ceil(mn/interval)*interval;l<=mx;l+=interval)out.push(+l.toFixed(4)); return out;
}

function buildRaster(g,mode,colorFn){ // mode: cells | smooth | band
  const off=document.createElement('canvas');
  if(mode==='cells'){
    off.width=g.cols;off.height=g.rows; const c=off.getContext('2d'), im=c.createImageData(g.cols,g.rows);
    const total=g.cols*g.rows, lim=Math.floor(total*S.reveal);
    for(let k=0;k<total;k++){ if(k>=lim)continue; const col=colorFn(g.vals[k]); im.data.set([col[0],col[1],col[2],235],k*4); }
    c.putImageData(im,0,0); return {off,w:FW*0+g.cols*g.gu,h:g.rows*g.gu,smooth:false};
  }
  const R=Math.min(2,Math.max(1,scale*0.9)); const W=Math.ceil(FW*R),H=Math.ceil(FH*R);
  off.width=W;off.height=H; const c=off.getContext('2d'), im=c.createImageData(W,H);
  const {cols,rows,gu,vals}=g, iv=S.interval;
  for(let y=0;y<H;y++){ let gy=(y+.5)/R/gu-.5; gy=Math.max(0,Math.min(rows-1,gy)); const j0=Math.min(rows-2,Math.floor(gy))|0, fy=gy-j0;
    for(let x=0;x<W;x++){ let gx=(x+.5)/R/gu-.5; gx=Math.max(0,Math.min(cols-1,gx)); const i0=Math.min(cols-2,Math.floor(gx))|0, fx=gx-i0;
      const a=vals[j0*cols+i0],b=vals[j0*cols+i0+1],cc=vals[(j0+1)*cols+i0+1],d=vals[(j0+1)*cols+i0];
      let v=(a*(1-fx)+b*fx)*(1-fy)+(d*(1-fx)+cc*fx)*fy;
      if(mode==='band'){ v=Math.floor(v/iv)*iv+iv/2; }
      const col=colorFn(v); const o=(y*W+x)*4; im.data[o]=col[0];im.data[o+1]=col[1];im.data[o+2]=col[2];im.data[o+3]=235; } }
  c.putImageData(im,0,0); return {off,w:FW,h:FH,smooth:true};
}

    const gu=G.gu; if(gu*scale>=3){
      ctx.beginPath(); for(let i=0;i<=G.cols;i++){ctx.moveTo(i*gu,0);ctx.lineTo(i*gu,FH);} for(let j=0;j<=G.rows;j++){ctx.moveTo(0,j*gu);ctx.lineTo(FW,j*gu);}
      ctx.strokeStyle=S.step===2?'rgba(47,79,138,.35)':'rgba(255,255,255,.55)'; ctx.lineWidth=px*(S.step===2?1:.8); ctx.stroke(); }
    if(S.step===2){ // 有測站的格子標出來
      ctx.fillStyle='rgba(143,111,176,.5)';
      const seen=new Set(); for(const s of S.stations){const i=Math.floor(s.x/gu),j=Math.floor(s.y/gu),k=j*G.cols+i; if(seen.has(k))continue; seen.add(k); ctx.fillRect(i*gu,j*gu,gu,gu);}
    }
  }
  // 等值線
  if(contours&&gForDraw&&!(S.mode==='challenge'&&S.ch.view==='diff')){
    const iv=S.mode==='challenge'?10:S.interval;
    ctx.save(); if(S.clip&&S.mode==='explain') ctx.clip(P_TPE);
    const lv=levelsFor(gForDraw,iv); const labels=[];
    ctx.strokeStyle='#283d8f'; ctx.lineWidth=px*1.3; ctx.lineCap='round';
    for(const L of lv){ const segs=contourSegments(gForDraw,L); ctx.beginPath(); segs.forEach(s=>{ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);}); ctx.stroke();
      for(let k=Math.floor(segs.length/3);k<segs.length;k+=Math.max(25,Math.floor(segs.length/2))){ const s=segs[k]; const x=(s[0]+s[2])/2,y=(s[1]+s[3])/2;
        if(labels.every(l=>Math.hypot(l.x-x,l.y-y)*scale>70)) labels.push({x,y,t:(iv<1?L.toFixed(1):String(Math.round(L)))}); } }
    ctx.font=`500 ${11*px}px "Noto Sans TC",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    labels.forEach(l=>{ctx.lineWidth=px*3.5;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.strokeText(l.t,l.x,l.y);ctx.fillStyle='#283d8f';ctx.fillText(l.t,l.x,l.y);});
    ctx.restore();
  }
  // 行政區界
  if(S.showDist){ ctx.setLineDash([3*px,3*px]); ctx.strokeStyle='rgba(60,60,60,.55)'; ctx.lineWidth=px*.8; P_DIST.forEach(p=>ctx.stroke(p)); ctx.setLineDash([]);
    ctx.font=`${11*px}px "Noto Sans TC",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    BND.districts.forEach(d=>{ctx.lineWidth=px*3;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.strokeText(d.name,d.lab[0],d.lab[1]);ctx.fillStyle='#444';ctx.fillText(d.name,d.lab[0],d.lab[1]);}); }
  // 縣市界
  ctx.strokeStyle='#1e1e1e'; ctx.lineWidth=px*1.3; ctx.lineJoin='round'; ctx.stroke(P_TPE); ctx.lineWidth=px*1; ctx.stroke(P_KL);
  // 縣市名
  const lab=(t,x,y,sz,vert)=>{ctx.font=`500 ${sz*px}px "Noto Sans TC",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const draw1=(c,xx,yy)=>{ctx.lineWidth=px*4;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.strokeText(c,xx,yy);ctx.fillStyle='#333';ctx.fillText(c,xx,yy);};
    if(vert){[...t].forEach((c,i)=>draw1(c,x,y+i*sz*px*1.15));} else draw1(t.split('').join(' '),x,y);};
  lab('新北市',52,72,15); lab('基隆市',356,104,15,true); if(!S.showDist) lab('臺北市',206,242,15);

  // 挑戰：最大誤差處
  if(S.mode==='challenge'&&S.ch.revealed&&S.ch.maxAt){ const m=S.ch.maxAt; ctx.beginPath(); ctx.arc(m.x,m.y,9*px,0,Math.PI*2); ctx.strokeStyle='#111'; ctx.lineWidth=px*2; ctx.setLineDash([4*px,3*px]); ctx.stroke(); ctx.setLineDash([]); }

  // 選取的格子：連到測站的權重線
  if(S.mode==='explain'&&S.sel&&S.step>=3&&S.computed){
    const {x,y,det}=S.sel; const mx=det.use[0].w;
    det.use.forEach(u=>{ if(u.w<0.004)return; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(u.s.x,u.s.y);
      ctx.strokeStyle=`rgba(125,80,170,${.35+.6*u.w/mx})`; ctx.lineWidth=px*(1+6*u.w/mx); ctx.stroke(); });
    if(S.step===3&&G){const gu=G.gu,i=Math.floor(x/gu),j=Math.floor(y/gu); ctx.strokeStyle='#111'; ctx.lineWidth=px*2; ctx.strokeRect(i*gu,j*gu,gu,gu);}
    ctx.beginPath(); ctx.arc(x,y,4*px,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#111'; ctx.lineWidth=px*2; ctx.stroke();
  }

  // 測站
  if(S.mode==='explain'){
    S.stations.forEach(s=>{ ctx.beginPath();
      if(S.step===1){ ctx.arc(s.x,s.y,4.6*px,0,Math.PI*2); ctx.fillStyle=classColor(classIndex(s.v)); ctx.fill(); ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=px*.9; ctx.stroke(); }
      else { ctx.arc(s.x,s.y,3.2*px,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#111'; ctx.lineWidth=px*1.4; ctx.stroke(); }
    });
    if(S.showVal){ ctx.font=`500 ${10.5*px}px "Noto Sans TC",sans-serif`; ctx.textAlign='left'; ctx.textBaseline='middle';
      S.stations.forEach(s=>{const t=fmt(s.v); ctx.lineWidth=px*3; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.strokeText(t,s.x+5*px,s.y); ctx.fillStyle='#111'; ctx.fillText(t,s.x+5*px,s.y);}); }
  } else {
    if(S.ch.revealed&&S.ch.view!=='mine'){ DATA.rain.forEach(a=>{ctx.beginPath();ctx.arc(a[0],a[1],2.4*px,0,Math.PI*2);ctx.fillStyle='rgba(30,30,30,.55)';ctx.fill();}); }
    S.ch.pts.forEach((s,i)=>{ ctx.beginPath(); ctx.arc(s.x,s.y,7*px,0,Math.PI*2); ctx.fillStyle='#8f6fb0'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=px*2; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font=`700 ${9.5*px}px "Noto Sans TC",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(i+1,s.x,s.y+.3*px);
      const t=Math.round(s.v)+' mm'; ctx.font=`500 ${11*px}px "Noto Sans TC",sans-serif`; ctx.textAlign='left';
      ctx.lineWidth=px*3.5; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.strokeText(t,s.x+9*px,s.y); ctx.fillStyle='#111'; ctx.fillText(t,s.x+9*px,s.y); });
  }

  // 圖框資訊
  const bx=FW-4, by=4; const lines=S.mode==='challenge'?['挑戰模式','降水量','7/6～7/8']:V.box;
  ctx.font=`${11*px}px "Noto Sans TC",sans-serif`; const bw=Math.max(...lines.map(t=>ctx.measureText(t).width))+10*px, bh=lines.length*14*px+8*px;
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fillRect(bx-bw,by,bw,bh); ctx.strokeStyle='#555'; ctx.lineWidth=px*.8; ctx.strokeRect(bx-bw,by,bw,bh);
  ctx.fillStyle='#333'; ctx.textAlign='left'; ctx.textBaseline='top'; lines.forEach((t,i)=>ctx.fillText(t,bx-bw+5*px,by+5*px+i*14*px));
  // 比例尺
  const u2=2/KM, sx=FW-10-u2-26*px, sy=FH-12;
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fillRect(sx-6*px,sy-18*px,u2+40*px,24*px);
  ctx.fillStyle='#222'; ctx.fillRect(sx,sy-3*px,u2/2,4*px); ctx.strokeStyle='#222'; ctx.lineWidth=px; ctx.strokeRect(sx,sy-3*px,u2,4*px);
  ctx.font=`${10*px}px "Noto Sans TC",sans-serif`; ctx.textBaseline='bottom'; ctx.textAlign='center';
  [[0,'0'],[u2/2,'1'],[u2,'2']].forEach(([o,t])=>ctx.fillText(t,sx+o,sy-4*px)); ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('公里',sx+u2+4*px,sy-1*px);
  // 指北
  const nx=FW-16, ny=bh+24*px+by; ctx.beginPath(); ctx.moveTo(nx,ny-10*px); ctx.lineTo(nx+5*px,ny+6*px); ctx.lineTo(nx,ny+2*px); ctx.lineTo(nx-5*px,ny+6*px); ctx.closePath(); ctx.fillStyle='#222'; ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font=`500 ${10*px}px sans-serif`; ctx.fillText('N',nx,ny-11*px);
}

/* ---------- 互動 ---------- */
function toUnits(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
function hitStation(p,list){let best=null,bd=Infinity;list.forEach(s=>{const d=Math.hypot(s.x-p.x,s.y-p.y)*scale;if(d<bd){bd=d;best=s;}});return bd<=11?best:null;}
let drag=null;
cv.addEventListener('pointerdown',e=>{
  const p=toUnits(e); closePop();
  if(S.mode==='challenge'){
    const ch=S.ch; if(ch.revealed){ toast('按「再挑戰一次」重新放置'); return; }
    let h=hitStation(p,ch.pts);
    if(!h){ if(ch.pts.length>=ch.budget){toast(`只有 ${ch.budget} 個測站可以放，拖曳已放的測站來調整`);return;}
      if(!inTaipei(p.x,p.y)){toast('測站要放在臺北市範圍內');return;}
      h={x:p.x,y:p.y,v:pointValue(p.x,p.y,initialStations('rain'))}; ch.pts.push(h); dirty=true; renderPanel(); }
    drag={s:h,moved:false,sx:e.clientX,sy:e.clientY}; cv.setPointerCapture(e.pointerId); req(); return;
  }
  const h=hitStation(p,S.stations);
  if(h){ drag={s:h,moved:false,sx:e.clientX,sy:e.clientY}; cv.setPointerCapture(e.pointerId); return; }
  if(S.step===1&&S.tool==='add'){
    const d=S.stations.length?idwDetail(p.x,p.y,S.stations,S.p,S.nn).v:VARS[S.v].min;
    const s={x:p.x,y:p.y,v:+d.toFixed(VARS[S.v].dec),id:nextId++}; S.stations.push(s); dirty=true; req(); openPop(s); renderPanel(); return;
  }
  if(S.step>=3&&S.computed){ selectCell(p); }
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return; if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>3)drag.moved=true; if(!drag.moved)return;
  const p=toUnits(e); drag.s.x=Math.max(1,Math.min(FW-1,p.x)); drag.s.y=Math.max(1,Math.min(FH-1,p.y));
  if(S.mode==='challenge'){ if(!inTaipei(drag.s.x,drag.s.y)){/* 允許暫時拖出，放開時檢查 */} drag.s.v=pointValue(drag.s.x,drag.s.y,initialStations('rain')); }
  dirty=true; if(S.sel)refreshSel(); req();
});
cv.addEventListener('pointerup',e=>{
  if(!drag)return; const d=drag; drag=null;
  if(S.mode==='challenge'){ if(!inTaipei(d.s.x,d.s.y)){ S.ch.pts.splice(S.ch.pts.indexOf(d.s),1); toast('放到臺北市外，已移除'); dirty=true; } renderPanel(); req(); return; }
  if(!d.moved){ if(S.step===1) openPop(d.s); else if(S.step>=3&&S.computed) selectCell({x:d.s.x,y:d.s.y}); }
  else renderPanel();
});
function selectCell(p){
  const gu=G.gu, i=Math.floor(p.x/gu), j=Math.floor(p.y/gu); const x=(i+.5)*gu, y=(j+.5)*gu;
  S.sel={x,y,det:idwDetail(x,y,S.stations,S.p,S.nn)}; renderPanel(); req();
}
function refreshSel(){ if(S.sel) S.sel.det=idwDetail(S.sel.x,S.sel.y,S.stations,S.p,S.nn); }

const pop=document.getElementById('pop');
function openPop(s){
  const V=VARS[S.v]; const r=cv.getBoundingClientRect(), br=box.getBoundingClientRect();
  pop.innerHTML=`<div class="row"><label for="popv">${V.word}</label><input id="popv" type="number" step="${V.dec?0.1:1}" value="${fmt(s.v)}"><span>${V.unit}</span></div><button class="del" id="popdel">刪除這個測站</button>`;
  pop.hidden=false;
  let left=r.left-br.left+s.x*scale+12, top=r.top-br.top+s.y*scale-20;
  left=Math.min(left,br.width-pop.offsetWidth-8); if(left<8)left=8; top=Math.max(8,Math.min(top,br.height-pop.offsetHeight-8));
  pop.style.left=left+'px'; pop.style.top=top+'px';
  const inp=document.getElementById('popv'); inp.focus(); inp.select();
  inp.addEventListener('input',()=>{const v=parseFloat(inp.value); if(!isNaN(v)){s.v=v;dirty=true;req();}});
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key==='Escape')closePop();});
  document.getElementById('popdel').onclick=()=>{S.stations.splice(S.stations.indexOf(s),1);dirty=true;closePop();req();renderPanel();};
}
function closePop(){pop.hidden=true;}
document.addEventListener('pointerdown',e=>{if(!pop.hidden&&!pop.contains(e.target)&&e.target!==cv)closePop();});

let tt=0; function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200);}

/* ---------- 推估動畫 ---------- */
function runReveal(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  S.computed=true; if(reduce){S.reveal=1;rasterCache=null;draw();renderPanel();return;}
  const t0=performance.now(), dur=1600;
  const tick=now=>{ S.reveal=Math.min(1,(now-t0)/dur); rasterCache=null; draw(); if(S.reveal<1)requestAnimationFrame(tick); else renderPanel(); };
  S.reveal=0; requestAnimationFrame(tick);
}

/* ---------- 面板 ---------- */
const panel=document.getElementById('panel');
const STEPS=['點資料','切網格','推估','等值線'];
function segHTML(name,opts,cur){return `<div class="seg" data-name="${name}">`+opts.map(([v,t])=>`<button data-val="${v}" aria-pressed="${String(v)===String(cur)}">${t}</button>`).join('')+`</div>`;}
function renderPanel(){
  const V=VARS[S.v];
  if(S.mode==='challenge'){ renderChallenge(); return; }
  let h=`<ol class="steps">`+STEPS.map((t,i)=>`<li><button data-step="${i+1}" ${S.step===i+1?'aria-current="step"':''}><b>${i+1}</b>${t}</button></li>`).join('')+`</ol><div class="body">`;
  if(S.step===1){
    h+=`<h2>測站只有「點」</h2><p class="lead">每個測站記錄了位置（空間資料）和${V.word}（屬性資料）。</p>
    <p>可是測站之間沒有資料。例如兩個測站中間的學校，${V.word}是多少？</p>
    <div class="hint">拖曳測站可移動位置，點一下測站可改數值。切換左上角「新增測站」可在地圖上加點。</div>
    <div class="stat"><div><span>測站數</span><strong>${S.stations.length}</strong></div><div><span>臺北市內</span><strong>${S.stations.filter(s=>inTaipei(s.x,s.y)).length}</strong></div></div>`;
  }
  if(S.step===2){
    ensureGrid(); const total=G.cols*G.rows; const withS=new Set(S.stations.map(s=>Math.floor(s.y/G.gu)*G.cols+Math.floor(s.x/G.gu))).size;
    h+=`<h2>把地圖切成網格</h2><p class="lead">電腦要算出「每一格」的值，才能畫出連續的分布。</p>
    <div class="ctl"><div class="lab">網格大小<strong>${S.grid} 公里</strong></div>${segHTML('grid',[[0.25,'0.25'],[0.5,'0.5'],[1,'1'],[2,'2']],S.grid)}</div>
    <div class="stat"><div><span>全部格子</span><strong>${total.toLocaleString()}</strong></div><div><span>有測站的格子</span><strong>${withS}</strong></div></div>
    <p>紫色格子裡有測站，其他 ${ (total-withS).toLocaleString()} 格都沒有資料，要用數學「推估」出來。</p>
    <div class="hint">網格越小，地圖越細緻，但要算的格子也越多。</div>`;
  }
  if(S.step===3){
    h+=`<h2>用附近測站推估每一格</h2><p class="lead">越近的測站，影響力越大。這個方法叫反距離權重法（IDW）。</p>
    <div class="formula"><div class="eq">推估值 = Σ( 權重 × 測站值 ) ÷ Σ權重</div><div class="eq" style="font-size:15px">權重 = 1 ÷ 距離<sup>p</sup></div>
    ${weightChart()}<small>p = ${S.p}：距離變 2 倍，影響力剩 1/${Math.pow(2,S.p)}</small></div>
    <div class="ctl"><div class="lab">距離的影響力 p<strong>${S.p}</strong></div>${segHTML('p',[[1,'1'],[2,'2'],[3,'3'],[4,'4']],S.p)}</div>
    <div class="ctl"><div class="lab">每格參考的測站數<strong>${S.nn==='all'?'全部':S.nn+' 站'}</strong></div>${segHTML('nn',[[4,'4'],[8,'8'],[12,'12'],['all','全部']],S.nn)}</div>
    <div class="btnrow"><button class="btn" id="goReveal">${S.computed?'重新推估一次':'開始推估'}</button></div>
    ${S.computed?`<div class="hint">點地圖上任一格，看它是怎麼算出來的。拖曳測站，顏色會跟著變。</div>`:''}
    ${detailHTML()}`;
  }
  if(S.step===4){
    h+=`<h2>把相同數值連成線</h2><p class="lead">從推估好的網格，找出數值相同的位置連起來，就是${V.line}。</p>
    <div class="ctl"><div class="lab">等值線間距<strong>${S.interval} ${V.unit}</strong></div>${segHTML('interval',V.intervals.map(v=>[v,String(v)]),S.interval)}</div>
    <div class="ctl"><div class="lab">底色</div>${segHTML('base',[['cells','網格'],['smooth','漸層'],['band','分層設色'],['none','不上色']],S.base)}</div>
    <label style="display:flex;gap:8px;align-items:center;font-size:15px;margin:10px 0"><input type="checkbox" id="optClip" ${S.clip?'checked':''}> 只顯示臺北市範圍</label>
    <div class="hint">線越密，代表${V.word}變化越劇烈。試著回到步驟 2 把網格調粗，再回來看等值線有什麼變化。</div>
    ${detailHTML()}`;
  }
  h+=`</div>`+legendHTML();
  panel.innerHTML=h; bindPanel(); drawLegend();
}
function weightChart(){
  const W=280,H=86,pad=24; const pts=p=>{let s='';for(let i=0;i<=60;i++){const d=0.5+i*(4.5/60);const w=Math.pow(0.5/d,p);s+=`${i?'L':'M'}${(pad+(d-0.5)/4.5*(W-pad-6)).toFixed(1)},${(8+(1-w)*(H-30)).toFixed(1)}`;}return s;};
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="影響力隨距離變小的曲線">`;
  [1,2,3,4].forEach(p=>{ if(p!==S.p) g+=`<path d="${pts(p)}" fill="none" stroke="#b9aecb" stroke-width="1"/>`; });
  g+=`<path d="${pts(S.p)}" fill="none" stroke="#8f6fb0" stroke-width="2.6"/>`;
  g+=`<line x1="${pad}" y1="${H-22}" x2="${W-4}" y2="${H-22}" stroke="currentColor" stroke-opacity=".4"/><line x1="${pad}" y1="6" x2="${pad}" y2="${H-22}" stroke="currentColor" stroke-opacity=".4"/>`;
  g+=`<text x="${pad-4}" y="14" font-size="10" text-anchor="end" fill="currentColor">大</text><text x="${pad-4}" y="${H-24}" font-size="10" text-anchor="end" fill="currentColor">小</text>`;
  g+=`<text x="${pad}" y="${H-8}" font-size="10" fill="currentColor">近</text><text x="${W-6}" y="${H-8}" font-size="10" text-anchor="end" fill="currentColor">遠（距離）</text>`;
  g+=`<text x="8" y="${(H-22)/2+6}" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 8 ${(H-22)/2+6})">影響力</text></svg>`;
  return g;
}
function detailHTML(){
  if(!S.sel||!S.computed)return '';
  const V=VARS[S.v], det=S.sel.det, where=districtAt(S.sel.x,S.sel.y);
  const top=det.use.slice(0,5), rest=det.use.slice(5), restW=rest.reduce((a,u)=>a+u.w,0);
  let h=`<div class="detail"><h3>這一格怎麼算？${where?`<span style="font-weight:400;color:var(--ink2);font-size:14px">（${where}）</span>`:''}</h3>`;
  if(det.exact){ h+=`<p>這一格就在測站上，直接用測站的值。</p>`; }
  h+=`<table class="w"><thead><tr><th>測站</th><th>距離</th><th>${V.word}</th><th>權重</th></tr></thead><tbody>`;
  top.forEach((u,i)=>{h+=`<tr><td>第 ${i+1} 近</td><td>${u.d.toFixed(2)} km</td><td>${fmt(u.s.v)}</td><td><span class="bar" style="width:${Math.max(2,u.w*60)}px"></span>${(u.w*100).toFixed(0)}%</td></tr>`;});
  if(rest.length) h+=`<tr><td>其他 ${rest.length} 站</td><td>較遠</td><td>—</td><td><span class="bar" style="width:${Math.max(2,restW*60)}px;opacity:.5"></span>${(restW*100).toFixed(0)}%</td></tr>`;
  h+=`</tbody></table><div class="result">推估${V.word}＝<strong>${fmt(det.v,V.dec?1:1)}</strong> ${V.unit}</div></div>`;
  return h;
}
function legendHTML(){
  const V=VARS[S.v];
  if(S.mode==='explain'&&S.step<=2){
    const b=[...V.breaks]; const labels=[`＜${b[0]}`]; for(let i=0;i<b.length-1;i++)labels.push(`${b[i]}～＜${b[i+1]}`); labels.push(`≧${b[b.length-1]}`);
    return `<div class="legend"><div class="t">${V.name}（${V.unit}）</div><div class="classes">`+labels.map((t,i)=>`<div><span class="dot" style="background:${classColor(i)}"></span>${t}</div>`).reverse().join('')+`</div></div>`;
  }
  return `<div class="legend"><div class="t">${V.name}（${V.unit}）</div><canvas id="lg" width="300" height="14"></canvas><div class="ticks" id="lgt"></div>${S.step===4?`<div style="margin-top:4px"><span class="cline"></span>${V.line}（間距 ${S.interval} ${V.unit}）</div>`:''}</div>`;
}
function drawLegend(diff){
  const c=document.getElementById('lg'); if(!c)return; const g=c.getContext('2d'); const V=VARS[S.v];
  for(let x=0;x<300;x++){ g.fillStyle=rgb(diff?palColor('diff',x/299):palColor(V.pal,x/299)); g.fillRect(x,0,1,14); }
  const t=document.getElementById('lgt'); const ticks=diff?[-30,-15,0,15,30]:V.ticks, mn=diff?-30:V.min, mx=diff?30:V.max;
  t.innerHTML=ticks.map(v=>`<span style="left:${(v-mn)/(mx-mn)*100}%">${diff&&v>0?'+'+v:v}</span>`).join('');
}
function bindPanel(){
  panel.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setStep(+b.dataset.step));
  panel.querySelectorAll('.seg[data-name]').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const n=sg.dataset.name, raw=b.dataset.val, v=(raw==='all'||isNaN(+raw))?raw:+raw;
    if(n==='grid'){S.grid=v;dirty=true;S.sel=null;}
    if(n==='p'){S.p=v;dirty=true;refreshSel();}
    if(n==='nn'){S.nn=v;dirty=true;refreshSel();}
    if(n==='interval'){S.interval=v;rasterCache=null;}
    if(n==='base'){S.base=v;rasterCache=null;}
    if(n==='budget'){S.ch.budget=v;S.ch.pts=S.ch.pts.slice(0,v);dirty=true;}
    if(n==='view'){S.ch.view=v;rasterCache=null;}
    renderPanel(); req();
  }));
  const gr=document.getElementById('goReveal'); if(gr)gr.onclick=()=>{S.sel=null;runReveal();};
  const oc=document.getElementById('optClip'); if(oc)oc.onchange=()=>{S.clip=oc.checked;req();};
  const cr=document.getElementById('chReveal'); if(cr)cr.onclick=revealChallenge;
  const ca=document.getElementById('chAgain'); if(ca)ca.onclick=()=>{S.ch.pts=[];S.ch.revealed=false;S.ch.view='mine';S.ch.maxAt=null;dirty=true;renderPanel();req();};
}
function setStep(n){
  S.step=n; closePop(); if(n===3&&!S.computed)S.reveal=0; if(n===4&&!S.computed){S.computed=true;S.reveal=1;}
  if(n<3||n===4)S.sel=null; rasterCache=null; renderPanel(); renderTools(); req();
}

/* ---------- 挑戰模式 ---------- */
function renderChallenge(){
  const ch=S.ch; let h=`<div class="body">`;
  if(!ch.revealed){
    h+=`<h2>預算只夠設 ${ch.budget} 個雨量站</h2><p class="lead">課本的 85 個測站先藏起來。你要把 ${ch.budget} 個測站放在哪裡，推估出來的降雨分布才會最接近真實？</p>
    <div class="ctl"><div class="lab">測站數量</div>${segHTML('budget',[[5,'5 站'],[8,'8 站']],ch.budget)}</div>
    <div class="stat"><div><span>已放置</span><strong>${ch.pts.length} / ${ch.budget}</strong></div></div>
    <div class="hint">在臺北市範圍內點一下放測站，測站會顯示量到的雨量；拖曳可以調整位置。地圖顯示的是用你的測站推估的結果。</div>
    <div class="btnrow"><button class="btn" id="chReveal" ${ch.pts.length<ch.budget?'disabled':''}>對答案</button><button class="btn ghost" id="chAgain">全部清除</button></div>`;
  } else {
    const r=ch.result; const gd=ch.budget===5?5.5:5, okk=ch.budget===5?7:6.2, avg=ch.budget===5?7.4:6.4; const cls=r.mae<gd?'good':r.mae<okk?'':'bad';
    h+=`<h2>對答案</h2><div class="score">平均誤差 <strong class="${cls}">${r.mae.toFixed(1)}</strong> mm</div>
    <p>${r.mae<gd?'很接近！你的測站抓到了主要的降雨中心。':r.mae<okk?'大致的分布有出來，但有些地方差比較多。':'差距比較大，可能漏掉了降雨最多的地方。'}</p><p style="font-size:14px">參考：隨機亂放 ${ch.budget} 個測站，平均誤差大約 ${avg} mm。</p>
    <div class="stat"><div><span>最多低估</span><strong>${r.under.toFixed(0)}</strong></div><div><span>最多高估</span><strong>+${r.over.toFixed(0)}</strong></div></div>
    <div class="ctl"><div class="lab">地圖顯示</div>${segHTML('view',[['mine','我的推估'],['truth','標準答案'],['diff','誤差']],ch.view)}</div>
    <p style="font-size:14px">標準答案：用全部 85 個測站推估的結果。虛線圈是誤差最大的地方。</p>
    <div class="hint">想一想：誤差最大的地方在哪裡？為什麼那裡容易估錯？如果多給你 1 個測站，你會放在哪？</div>
    <div class="btnrow"><button class="btn" id="chAgain">再挑戰一次</button></div>`;
  }
  h+=`</div>`;
  const diff=ch.revealed&&ch.view==='diff';
  h+=diff?`<div class="legend"><div class="t">誤差（我的推估 − 標準答案，mm）</div><canvas id="lg" width="300" height="14"></canvas><div class="ticks" id="lgt"></div><div>藍色：估太少　紅色：估太多</div></div>`
    :`<div class="legend"><div class="t">降水量（mm）</div><canvas id="lg" width="300" height="14"></canvas><div class="ticks" id="lgt"></div><div style="margin-top:4px"><span class="cline"></span>等雨量線（間距 10 mm）</div></div>`;
  panel.innerHTML=h; bindPanel(); drawLegend(diff);
}
function revealChallenge(){
  const ch=S.ch; ensureGrid();
  if(!ch.truth) ch.truth=computeGrid(initialStations('rain'),0.5,2,'all');
  const t=ch.truth, m=G; const diff=new Float32Array(t.vals.length);
  let sum=0,n=0,under=0,over=0,maxAbs=-1,maxAt=null;
  for(let k=0;k<t.vals.length;k++){ const e=m.vals[k]-t.vals[k]; diff[k]=e; if(!t.inT[k])continue; sum+=Math.abs(e); n++;
    if(e<under)under=e; if(e>over)over=e; if(Math.abs(e)>maxAbs){maxAbs=Math.abs(e);const i=k%t.cols,j=Math.floor(k/t.cols);maxAt={x:(i+.5)*t.gu,y:(j+.5)*t.gu};} }
  ch.diff={...t,vals:diff}; ch.result={mae:sum/n,under,over}; ch.maxAt=maxAt; ch.revealed=true; ch.view='diff'; rasterCache=null;
  renderPanel(); req();
}

/* ---------- 地圖工具列、切換 ---------- */
const tools=document.getElementById('maptools');
function renderTools(){
  if(S.mode==='explain'&&S.step===1){
    tools.innerHTML=`<div class="seg" id="toolSeg"><button data-t="move" aria-pressed="${S.tool==='move'}">拖曳・編輯</button><button data-t="add" aria-pressed="${S.tool==='add'}">新增測站</button></div><button class="chip" id="resetSt">還原課本資料</button>`;
    tools.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tool=b.dataset.t;renderTools();cv.style.cursor=S.tool==='add'?'crosshair':'';});
    document.getElementById('resetSt').onclick=()=>{S.stations=initialStations(S.v);dirty=true;S.sel=null;closePop();renderPanel();req();};
    cv.style.cursor=S.tool==='add'?'crosshair':'';
  } else { tools.innerHTML=''; cv.style.cursor=S.mode==='challenge'?'crosshair':''; }
}
document.querySelectorAll('#varSeg button').forEach(b=>b.onclick=()=>{
  if(S.mode==='challenge')return;
  S.v=b.dataset.v; S.stations=initialStations(S.v); S.interval=VARS[S.v].interval; S.sel=null; dirty=true; closePop();
  document.querySelectorAll('#varSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.getElementById('srcNote').textContent=VARS[S.v].src; renderPanel(); req();
});
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.m; closePop(); document.querySelectorAll('#modeSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(S.mode==='challenge'){ S.v='rain'; document.querySelectorAll('#varSeg button').forEach(x=>{x.setAttribute('aria-pressed',x.dataset.v==='rain');x.disabled=true;});
    S.stations=initialStations('rain'); document.getElementById('srcNote').textContent='標準答案：課本圖 2-27 的 85 個測站'; }
  else { document.querySelectorAll('#varSeg button').forEach(x=>x.disabled=false); document.getElementById('srcNote').textContent=VARS[S.v].src; S.interval=VARS[S.v].interval; }
  dirty=true; rasterCache=null; renderPanel(); renderTools(); req();
});
document.getElementById('optDist').onchange=e=>{S.showDist=e.target.checked;req();};
document.getElementById('optVal').onchange=e=>{S.showVal=e.target.checked;req();};

document.getElementById('srcNote').textContent=VARS.rain.src;
new ResizeObserver(()=>resize()).observe(box);
window.addEventListener('resize',resize);
renderPanel(); renderTools(); resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw());
</script>
</body>
