<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>都市內部空間結構</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面與中地理論模型一致：左邊大圖（投影看得清楚）＋右側說明欄；講解模式底部有步驟列。
   分區顏色：1 中心商業區紅、2 批發與輕工業（過渡帶）紫、3 低級住宅橘、4 中級住宅黃、5 高級住宅綠、
   6 重工業灰、7 外圍商業粉紅、8 郊區住宅淺綠、9 郊區工業灰藍、0 農地米色。每一區都另標數字，不只靠顏色分辨。 */
:root{
  --bg:#EDEFF3; --panel:#FFFFFF; --ink:#1A2130; --muted:#586274; --line:#CBD1DB; --soft:#E3E6ED;
  --accent:#6B4E8C; --accent-fg:#FFFFFF;
  --z1:#D2443A; --z2:#8E6CB8; --z3:#EE9440; --z4:#F3D35E; --z5:#5FA64E; --z6:#5F6B7A; --z7:#E46FA3; --z8:#B4D99A; --z9:#8DA6C4; --z0:#ECE6D2;
  --zt:#1A2130; --z0ink:#A08F5C;
  --sea:#C3DCEA; --water:#A9CDE3; --land:#FAF9F5; --land-out:#E4E3DC; --border:#8E97A8; --road:#7B8494;
  --ok:#1E7F45; --bad:#C3283F;
  --t1:#D23B33; --t2:#2B68BF; --t3:#2C9149; --t4:#D97512; --t5:#C2408A; --t6:#7A5230;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","PMingLiU","Songti TC",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121620; --panel:#1B2130; --ink:#E6EAF2; --muted:#9DA7BA; --line:#323B4E; --soft:#252D3E;
  --accent:#B399D6; --accent-fg:#16101F;
  --z1:#E0645A; --z2:#A88BD0; --z3:#F0A55E; --z4:#E8CE6A; --z5:#78BE66; --z6:#8794A5; --z7:#EE8DB8; --z8:#9CC882; --z9:#90AACB; --z0:#3A3628;
  --zt:#121620; --z0ink:#B3A57A;
  --sea:#142838; --water:#1F4560; --land:#262C38; --land-out:#1C2029; --border:#6B7487; --road:#9AA3B3;
  --ok:#57C987; --bad:#F06478;
  --t1:#F0675F; --t2:#5F9BEB; --t3:#58C47A; --t4:#F09A3E; --t5:#EE7BBE; --t6:#C9976A;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121620; --panel:#1B2130; --ink:#E6EAF2; --muted:#9DA7BA; --line:#323B4E; --soft:#252D3E;
  --accent:#B399D6; --accent-fg:#16101F;
  --z1:#E0645A; --z2:#A88BD0; --z3:#F0A55E; --z4:#E8CE6A; --z5:#78BE66; --z6:#8794A5; --z7:#EE8DB8; --z8:#9CC882; --z9:#90AACB; --z0:#3A3628;
  --zt:#121620; --z0ink:#B3A57A;
  --sea:#142838; --water:#1F4560; --land:#262C38; --land-out:#1C2029; --border:#6B7487; --road:#9AA3B3;
  --ok:#57C987; --bad:#F06478;
  --t1:#F0675F; --t2:#5F9BEB; --t3:#58C47A; --t4:#F09A3E; --t5:#EE7BBE; --t6:#C9976A;
  color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,p{margin:0}
kbd{font-family:inherit;font-size:13px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-inline:clamp(12px,2vw,32px);padding-block:12px;max-width:1700px;margin-inline:auto}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,2.6vw,40px);letter-spacing:.06em;line-height:1.1}
.brand .sub{color:var(--muted);font-size:15px}
.modes{display:inline-flex;border:2px solid var(--accent);border-radius:10px;overflow:hidden}
.modes button{border:0;background:transparent;padding:7px 18px;font-weight:700;font-size:16px}
.modes button+button{border-left:2px solid var(--accent)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:clamp(12px,1.6vw,24px);min-height:0}
.viz{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.vizin{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.vizin>svg,.vizin>canvas{display:block;max-width:100%;max-height:100%}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--muted);justify-content:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--c);color:#1A2130;font-size:12px;font-weight:900;border:1px solid rgb(0 0 0 / .15)}
.side>*{flex-shrink:0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.side h2{font-family:var(--serif);font-weight:700;font-size:clamp(23px,2vw,30px);line-height:1.3;text-wrap:balance}
.side h3{font-size:18px;font-weight:700}
.side p{max-width:34em}
b.hl{color:var(--accent)}
.def{display:grid;gap:8px}
.def>div{border-left:4px solid var(--c,var(--accent));padding:2px 0 2px 12px}
.ctrl{display:grid;gap:10px}
.lab{font-size:14px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:transparent;padding:6px 13px;font-weight:500;font-size:15px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700}
.tg{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--soft);font-weight:700;text-align:left;width:100%}
.tg .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;flex:none;font-size:15px}
.tg[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.tg[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tg small{display:block;font-weight:500;color:var(--muted);font-size:14px}
.readout{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;align-items:center}
.readout .r{display:contents}
.readout .r>*{padding:1px 0;font-size:15px}
.readout .r.win>*{font-weight:900}
.readout .bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.readout .bar i{display:block;height:100%;background:var(--c)}
.verdict{border-radius:10px;padding:10px 14px;font-weight:700;font-size:18px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.verdict small{display:block;font-weight:500;font-size:15px;color:var(--ink)}
.note{font-size:14px;color:var(--muted)}
.btn{border:2px solid var(--ink);background:transparent;border-radius:8px;padding:6px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
table.tb{border-collapse:collapse;width:100%;font-size:15px}
.tb th,.tb td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb thead th{font-size:13px;color:var(--muted);font-weight:700}
.zinfo{border:2px solid var(--c);border-radius:10px;padding:10px 14px;background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.zinfo b{display:flex;align-items:center;gap:8px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--panel);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel);font-weight:700}

/* 模式圖 */
svg.model .rg{stroke:var(--panel);stroke-width:1.2;cursor:pointer;transition:filter .15s}
svg.model .rg:hover{filter:brightness(1.08)}
svg.model .rg.dim{opacity:.28}
svg.model .rg.blank{fill:var(--soft)!important;stroke:var(--line)}
svg.model .rg.hot{stroke:var(--ink);stroke-width:1.3}
svg.model .rg.flash{animation:flash .5s 2}
@keyframes flash{50%{filter:brightness(1.35)}}
svg.model .num circle{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
svg.model .num text{font-weight:900;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-family:var(--sans)}
svg.model .cap{font-family:var(--serif);font-weight:700;fill:var(--ink);text-anchor:middle}
svg.model .frame{fill:none;stroke:var(--border);stroke-width:1}
svg text{font-family:var(--sans)}

/* 地圖 */
.mapwrap{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;background:var(--sea);touch-action:none}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mapwrap.grab{cursor:grab}.mapwrap.grabbing{cursor:grabbing}
.mapctl{position:absolute;left:8px;top:8px;z-index:2;display:flex;flex-direction:column;gap:6px}
.mapctl button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;min-width:40px;height:38px;padding:0 10px;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgb(0 0 0 / .08)}
.citytabs{position:absolute;right:8px;top:8px;z-index:2}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.45;box-shadow:0 4px 14px rgb(0 0 0 / .15);max-width:280px;z-index:3}
.mk{cursor:pointer}
.mk circle.dot{stroke:var(--zt)}
.mk text{font-weight:900;text-anchor:middle;dominant-baseline:central;fill:#1A2130;pointer-events:none}
.mk .lbl{font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-linejoin:round;text-anchor:start;dominant-baseline:central}
.mk.on circle.dot{stroke:var(--ink)}

/* steps footer */
.foot{display:flex;align-items:center;gap:12px}
.foot .dots{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.foot .dots button{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 14px;font-size:14px}
.foot .dots button[aria-current="step"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.foot .hint{font-size:13px;color:var(--muted)}

/* 拖拉卡片 */
.tray{display:flex;flex-wrap:wrap;gap:8px}
.card{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:700;font-size:16px;cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:6px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.card.used{opacity:.35;cursor:default;text-decoration:line-through}
.card.drag{position:fixed;z-index:20;pointer-events:none;box-shadow:0 8px 24px rgb(0 0 0 / .25)}

/* game */
.levels{display:flex;gap:6px;flex-wrap:wrap}
.levels button{border:1.5px solid var(--line);background:var(--soft);border-radius:8px;padding:4px 12px;font-weight:700;font-size:15px}
.levels button[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.levels button.done::after{content:" ✓";color:var(--ok)}
.levels button.done[aria-current="true"]::after{color:inherit}
.goal{border:2px dashed var(--accent);border-radius:10px;padding:10px 14px;font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;text-align:left;font-weight:700;font-size:17px;display:flex;gap:10px;align-items:flex-start}
.opt .k{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:var(--soft);font-weight:900;flex:none}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.opt:disabled{cursor:default}
.qtext{font-size:clamp(20px,1.8vw,26px);font-weight:700;line-height:1.5}
.banner{border-radius:12px;padding:12px 16px;background:color-mix(in srgb,var(--ok) 15%,transparent);border:2px solid var(--ok)}
.banner b{color:var(--ok);font-size:20px}
.turn{border-radius:12px;padding:12px 16px;color:#fff;background:color-mix(in srgb,var(--c) 80%,#000);display:grid;gap:2px}
.turn .big{font-size:clamp(22px,2vw,30px);font-weight:900;line-height:1.25}
.turn .meta{display:flex;justify-content:space-between;gap:10px;font-weight:700;opacity:.95}
.score{display:grid;gap:6px}
.score.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.score .t{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--soft);font-variant-numeric:tabular-nums}
.score .t.now{outline:3px solid var(--c)}
.score .t .pts{font-size:22px;font-weight:900}
.tdot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:999px;padding:6px 18px;font-weight:700;z-index:4;pointer-events:none}
.qstage{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:8px;overflow:auto}
.qstage .qd{flex:1;min-height:220px;display:flex;align-items:center;justify-content:center}
ol.qs{margin:0;padding-left:1.3em;display:grid;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.tool{border:2px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}

@media (max-width:900px){
  .app{height:auto;grid-template-rows:auto auto auto}
  .stage{grid-template-columns:minmax(0,1fr)}
  .viz{height:min(80vh,calc(100vw + 40px));min-height:360px}
  .viz.auto{height:auto}
  .viz.auto .vizin{display:block}
  .foot .hint{display:none}
  .foot .dots .t{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>都市內部空間結構</h1>
      <span class="sub">同心圓、扇形、多核心｜地價與土地利用</span>
    </div>
    <div class="modes" role="group" aria-label="模式">
      <button type="button" id="mLearn" aria-pressed="true">講解</button>
      <button type="button" id="mSolo" aria-pressed="false">個人挑戰</button>
      <button type="button" id="mTeam" aria-pressed="false">分組對戰</button>
    </div>
  </header>
  <main class="stage">
    <section class="viz" id="viz">
      <div class="vizin" id="vizin"></div>
      <div class="legend" id="legend"></div>
      <div class="toast" id="toast" hidden></div>
    </section>
    <aside class="side" id="side" aria-live="polite"></aside>
  </main>
  <nav class="foot" id="foot">
    <button class="btn" id="prev" type="button">上一步</button>
    <div class="dots" id="dots"></div>
    <span class="hint">← → 切換步驟</span>
    <button class="btn primary" id="next" type="button">下一步</button>
  </nav>
</div>

/* ===== 規劃者模擬：競租決定每一格的土地利用 ===== */
const SIM=(function(){
  const N=41, C=20, U=10/20;           // 41×41 格，市中心在 (20,20)，每格 = 0.5 個距離單位
  const idx=(x,y)=>y*N+x, xy=i=>[i%N,(i/N)|0];
  // 地租曲線：b = a − s·u（u：到中心的距離）
  const BID={1:[108.7,40],2:[84.7,20],3:[62.7,10],4:[48.3,6],5:[34.8,3.5],0:[12,0.5],7:[72,40]};
  function dijkstra(srcs,rail){
    const d=new Float64Array(N*N).fill(Infinity), done=new Uint8Array(N*N);
    srcs.forEach(s=>d[s]=0);
    // 簡單的二元堆
    const h=[]; const push=(v,i)=>{h.push([v,i]);let k=h.length-1;while(k){const p=(k-1)>>1;if(h[p][0]<=h[k][0])break;[h[p],h[k]]=[h[k],h[p]];k=p;}};
    const pop=()=>{const t=h[0],l=h.pop();if(h.length){h[0]=l;let k=0;for(;;){const a=2*k+1,b=a+1;let m=k;if(a<h.length&&h[a][0]<h[m][0])m=a;if(b<h.length&&h[b][0]<h[m][0])m=b;if(m===k)break;[h[m],h[k]]=[h[k],h[m]];k=m;}}return t;};
    srcs.forEach(s=>push(0,s));
    while(h.length){const [v,i]=pop(); if(done[i])continue; done[i]=1; const [x,y]=xy(i);
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy)continue; const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=N||ny>=N)continue;
        const j=idx(nx,ny); const step=(dx&&dy)?1.414:1; const onRail=rail.has(i)&&rail.has(j); const c=v+step*(onRail?0.3:1);
        if(c<d[j]){d[j]=c;push(c,j);} } }
    return d;
  }
  function near(set,r){ // 每格到集合的最近距離（格）
    const out=new Float64Array(N*N).fill(99); if(!set.size)return out; const pts=[...set].map(xy);
    for(let i=0;i<N*N;i++){const [x,y]=xy(i);let m=99;for(const [a,b] of pts){const q=Math.hypot(x-a,y-b);if(q<m)m=q;}out[i]=m;}
    return out;
  }
  function run(st){
    const rail=new Set(st.rail||[]), subs=st.subs||[], heavy=new Set();
    (st.heavy||[]).forEach(h=>{const [hx,hy]=xy(h);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=hx+dx,y=hy+dy;if(x>=0&&y>=0&&x<N&&y<N)heavy.add(idx(x,y));}});
    const main=idx(C,C);
    const dm=dijkstra([main],rail), ds=subs.length?dijkstra(subs,rail):null;
    const nRail=near(rail), nHeavy=near(heavy);
    const use=new Uint8Array(N*N);
    for(let i=0;i<N*N;i++){
      if(heavy.has(i)){use[i]=6;continue;}
      const [x,y]=xy(i); const ue=Math.hypot(x-C,y-C)*U, un=dm[i]*U;
      const us=ds?Math.hypot(...(()=>{let best=[99,99];let bd=1e9;for(const s of subs){const [a,b]=xy(s);const q=Math.hypot(x-a,y-b);if(q<bd){bd=q;best=[x-a,y-b];}}return best;})())*U:99;
      const usn=ds?ds[i]*U:99;
      const ur=Math.min(0.5*(ue+un), usn+1.5);           // 住宅：看到最近中心的通勤距離
      const b={};
      b[1]=BID[1][0]-BID[1][1]*ue;
      b[7]=ds?BID[7][0]-BID[7][1]*us:-1e9;
      b[2]=BID[2][0]-BID[2][1]*un+(nRail[i]<=1.5?10:0);
      b[3]=BID[3][0]-BID[3][1]*ur+(nRail[i]<=3?5:0)+(nHeavy[i]<=4?15:0);
      b[4]=BID[4][0]-BID[4][1]*ur-(nHeavy[i]<=3?4:0);
      b[5]=BID[5][0]-BID[5][1]*ur-(nRail[i]<=3?8:0)-(nHeavy[i]<=6?14:0);
      b[0]=BID[0][0]-BID[0][1]*ue;
      let w=0,bv=-1e9; for(const k of [1,7,2,3,4,5,0]){ if(b[k]>bv){bv=b[k];w=k;} }
      use[i]=w;
    }
    rail.forEach(i=>{});
    return use;
  }
  function stats(use){
    const n={};for(const u of use)n[u]=(n[u]||0)+1;
    // 商業核心（1 或 7）的連通塊數
    const seen=new Uint8Array(N*N);let clusters=0;
    for(let i=0;i<N*N;i++){ if(seen[i]||(use[i]!==1&&use[i]!==7))continue; clusters++; const q=[i];seen[i]=1;
      while(q.length){const k=q.pop();const [x,y]=xy(k);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;if(a<0||b<0||a>=N||b>=N)continue;const j=idx(a,b);if(!seen[j]&&(use[j]===1||use[j]===7)){seen[j]=1;q.push(j);}}}}
    let reach2=0; for(let i=0;i<N*N;i++)if(use[i]===2){const [x,y]=xy(i);reach2=Math.max(reach2,Math.hypot(x-C,y-C)*U);}
    const res=(n[3]||0)+(n[4]||0)+(n[5]||0);
    return {n,clusters,reach2,highShare:res?(n[5]||0)/res:0};
  }
  return {N,C,U,idx,xy,run,stats};
})();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(msg,ms=1600){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);}

function arcPath(cx,cy,r0,r1,a0,a1){ // 角度：0 = 北，順時針（度）
  const p=(r,a)=>{const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)];};
  if(a1-a0>=359){ if(r0<=0) return `M${cx+r1} ${cy}A${r1} ${r1} 0 1 1 ${cx-r1} ${cy}A${r1} ${r1} 0 1 1 ${cx+r1} ${cy}Z`;
    return `M${cx+r1} ${cy}A${r1} ${r1} 0 1 1 ${cx-r1} ${cy}A${r1} ${r1} 0 1 1 ${cx+r1} ${cy}ZM${cx+r0} ${cy}A${r0} ${r0} 0 1 0 ${cx-r0} ${cy}A${r0} ${r0} 0 1 0 ${cx+r0} ${cy}Z`; }
  const large=(a1-a0)>180?1:0;
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  if(r0<=0) return `M${cx} ${cy}L${x0} ${y0}A${r1} ${r1} 0 ${large} 1 ${x1} ${y1}Z`;
  return `M${x0} ${y0}A${r1} ${r1} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${large} 0 ${x3} ${y3}Z`;
}
const RINGS=[9,17,27,38,48];
const HOYT=[[-20,20,2],[20,65,3],[65,125,4],[125,165,5],[165,205,4],[205,250,3],[250,295,4],[295,340,3]];
const MULTI=[ // 先畫的在下面

function modelRegions(m){
  if(m==='concentric'){
    const out=[];for(let i=RINGS.length-1;i>=0;i--){out.push({z:i+1,d:arcPath(50,50,0,RINGS[i],0,359.99),l:i===0?[50,50]:[50+Math.cos(-Math.PI/4)*(RINGS[i]+RINGS[i-1])/2,50+Math.sin(-Math.PI/4)*(RINGS[i]+RINGS[i-1])/2]});}
    return out;
  }
  if(m==='sector'){
    const out=HOYT.map(([a0,a1,z])=>{const am=(a0+a1)/2,t=(am-90)*Math.PI/180;return {z,d:arcPath(50,50,9,48,a0,a1),l:[50+Math.cos(t)*31,50+Math.sin(t)*31]};});
    out.push({z:1,d:arcPath(50,50,0,9,0,359.99),l:[50,50]});
    return out;
  }
  return MULTI;
}
/* 畫模式圖：opts {blank:Set|true, dim:z, hot:z, onPick(z,el), numbers:true, size} */
function drawModel(svg,m,opts={}){
  svg.innerHTML=''; svg.setAttribute('viewBox','-2 -2 104 104'); svg.classList.add('model');
  const regs=modelRegions(m), seen=new Set();
  const g=el('g',{},svg);
  regs.forEach((r,i)=>{
    const blank=opts.blank===true||(opts.blank&&opts.blank.has&&opts.blank.has(r.z));
    const p=el('path',{d:r.d,class:'rg'+(blank?' blank':'')+(opts.dim!=null&&opts.dim!==r.z?' dim':'')+(opts.hot===r.z?' hot':''),'data-z':r.z,fill:`var(${Z[r.z].c})`},g);
    if(opts.onPick)p.addEventListener('click',e=>opts.onPick(r.z,p,e));
  });
  if(m==='multi') el('rect',{x:2,y:2,width:96,height:96,class:'frame'},svg);
  if(opts.numbers!==false){
    const ng=el('g',{class:'num','pointer-events':'none'},svg);
    regs.forEach(r=>{
      const blank=opts.blank===true||(opts.blank&&opts.blank.has&&opts.blank.has(r.z));
      if(m==='multi'&&r.z===4&&seen.has(4))return; seen.add(r.z);
      const k=el('g',{transform:`translate(${r.l[0]} ${r.l[1]})`},ng);
      el('circle',{r:3.7},k); el('text',{'font-size':4.8},k).textContent=blank?'?':r.z;
    });
  }
  return svg;
}

const BIDNAME={1:'商業',2:'批發與輕工業',3:'低級住宅',4:'中級住宅',5:'高級住宅',0:'農業'};
const BIDAS={1:[108.7,40],2:[84.7,20],3:[62.7,10],4:[48.3,6],5:[34.8,3.5],0:[12,0.5]};
function bid(z,u,trans){const [a,s]=BIDAS[z];return a-s*(trans?0.7:1)*u;}
function winAt(u,trans){let w=0,bv=-1e9;for(const z of BIDZ){const b=bid(z,u,trans);if(b>bv){bv=b;w=z;}}return w;}
function bounds(trans){const out=[];let prev=winAt(0,trans),from=0;for(let u=0.01;u<=14;u+=0.01){const w=winAt(u,trans);if(w!==prev){out.push({z:prev,a:from,b:u});prev=w;from=u;}}out.push({z:prev,a:from,b:14});return out;}

function drawRingMap(){
  const cv=$('ringc'); const box=cv.parentElement.getBoundingClientRect(); const S=Math.max(120,Math.floor(Math.min(box.width,box.height||box.width)));
  const dpr=Math.min(2,devicePixelRatio||1); cv.width=S*dpr; cv.height=S*dpr; const c=cv.getContext('2d');
  const cols={}; BIDZ.forEach(z=>cols[z]=cssv(Z[z].c));
  const img=c.createImageData(cv.width,cv.height), R=cv.width/2, k=12/R;
  const rgb=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
  const C={}; BIDZ.forEach(z=>C[z]=rgb(cols[z]));
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){
    const dx=(x-R)*k, dy=(y-R)*k; let u=Math.hypot(dx,dy);
    if(L1.road&&dx>0) u=Math.min(u,Math.abs(dy)*1.0+dx*0.5);
    const z=winAt(u,L1.trans), p=(y*cv.width+x)*4, cc=C[z];
    img.data[p]=cc[0];img.data[p+1]=cc[1];img.data[p+2]=cc[2];img.data[p+3]=255;

function cityFit(){const m=MAPS[L5.city];const [x,y,w,h]=m.view;
  const init={chicago:[-9,-13,28,30],taipei:[-10,-7,17,16],kaohsiung:[-6,-7,12,18],hcmc:[30,36,17,15]}[L5.city]||[x,y,w,h];

function applyView(){
  const svg=$('map'), wrap=$('mapwrap'); if(!svg)return; const r=wrap.getBoundingClientRect(); const V=VIEW[L5.city];
  // 依容器比例調整，保持中心不變
  const ar=r.width/Math.max(1,r.height); let w=V.w,h=V.h; if(w/h<ar)w=h*ar; else h=w/ar;
  const cx=V.x+V.w/2, cy=V.y+V.h/2; V.x=cx-w/2; V.y=cy-h/2; V.w=w; V.h=h;

  svg.querySelectorAll('[data-sw]').forEach(e=>e.setAttribute('stroke-width',(+e.dataset.sw)*k));

function buildMap(){
  const svg=$('map'), M=MAPS[L5.city]; svg.innerHTML='';

  let center;

  }else if(L5.city==='hcmc'){
    bg.setAttribute('fill','var(--land-out)');
    M.dists.forEach(d=>el('path',{d:d.d,fill:'var(--land)',stroke:'var(--border)','data-sw':1},land));
  }else{
    M.neigh.forEach(d=>el('path',{d:d.d,fill:'var(--land-out)',stroke:'var(--border)','data-sw':.6},land));
    M.dists.forEach(d=>el('path',{d:d.d,fill:'var(--land)',stroke:'var(--border)','data-sw':1.2},land));
    const cp=el('clipPath',{id:'landclip'},defs); M.neigh.concat(M.dists).forEach(d=>el('path',{d:d.d},cp));
  }
  const main=MARKERS[L5.city].find(m=>m.z===1); center=[main.x,main.y];
  if(L5.rings){
    const rg=el('g',{'clip-path':(L5.city==='taipei'||L5.city==='kaohsiung')?'url(#landclip)':null},svg);
    const R=CITY[L5.city].ring;
    for(let i=4;i>=0;i--) el('circle',{cx:center[0],cy:center[1],r:R[i],fill:`var(${Z[i+1].c})`,'fill-opacity':.32,stroke:`var(${Z[i+1].c})`,'data-sw':2},rg);
    for(let i=0;i<5;i++){const rm=i===0?0:(R[i]+R[i-1])/2;el('text',{x:center[0]-rm*0.707,y:center[1]+rm*0.707,class:'rnum','text-anchor':'middle','dominant-baseline':'central','font-weight':900,fill:'var(--ink)','paint-order':'stroke',stroke:'var(--panel)','data-sw':3},rg).textContent=i+1;}
  }
  if(L5.city==='chicago') el('path',{d:M.lake,fill:'var(--water)',stroke:'var(--border)','data-sw':.8},svg);
  if(L5.city==='hcmc'){

    el('path',{d:M.canals,fill:'none',stroke:'var(--water)','data-sw':1.5},svg);
  }
  // 行政區名
  const lg=el('g',{'pointer-events':'none'},svg);
  if(M.dists) M.dists.forEach(d=>{const t=el('text',{x:d.lx,y:d.ly,class:'dlab','text-anchor':'middle',fill:'var(--muted)','font-weight':500},lg);t.textContent=d.short||d.name;});
  if(L5.city==='chicago'){const t=el('text',{x:16,y:-2,class:'dlab','text-anchor':'middle',fill:'var(--muted)','font-weight':700},lg);t.textContent='密西根湖';}
  // 地點
  const mg=el('g',{},svg);
  MARKERS[L5.city].forEach((m,i)=>{
    const g=el('g',{class:'mk'+(L5.sel===i?' on':''),'data-x':m.x,tabindex:0,role:'button','aria-label':m.name},mg);
    el('circle',{class:'dot',cx:m.x,cy:m.y,fill:m.z==='T'?'var(--panel)':`var(${Z[m.z].c})`},g);
    el('text',{class:'n',x:m.x,y:m.y},g).textContent=m.z==='T'?'🚉':m.z;
    el('text',{class:'lbl',x:m.x,y:m.y},g).textContent=m.name.replace(/（.*?）/,'');
    const pick=()=>{L5.sel=L5.sel===i?null:i;buildMap();applyView();sideL5();};
    g.addEventListener('click',pick); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
  });
  applyView();
}
function bindMapGestures(){
  const wrap=$('mapwrap'), svg=$('map'); wrap.classList.add('grab');
  const toMap=(cx,cy)=>{const r=wrap.getBoundingClientRect();const V=VIEW[L5.city];return [V.x+(cx-r.left)/r.width*V.w, V.y+(cy-r.top)/r.height*V.h];};
  const zoomAt=(f,cx,cy)=>{const V=VIEW[L5.city];const [mx,my]=toMap(cx,cy);const nw=clamp(V.w*f,2,80);const k=nw/V.w;V.x=mx-(mx-V.x)*k;V.y=my-(my-V.y)*k;V.w=nw;V.h*=k;applyView();};
  wrap.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*0.0015),e.clientX,e.clientY);},{passive:false});
  const P=new Map(); let last=null, pinch=null, moved=0;
  wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.mapctl'))return;P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
    if(P.size===1){last=[e.clientX,e.clientY];wrap.classList.add('grabbing');}
    if(P.size===2){const [a,b]=[...P.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),c:[(a[0]+b[0])/2,(a[1]+b[1])/2]};}});
  wrap.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===2&&pinch){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d>0){zoomAt(pinch.d/d,pinch.c[0],pinch.c[1]);pinch.d=d;}return;}
    if(P.size===1&&last){const r=wrap.getBoundingClientRect();const V=VIEW[L5.city];const dx=e.clientX-last[0],dy=e.clientY-last[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>6&&!wrap.hasPointerCapture(e.pointerId)){try{wrap.setPointerCapture(e.pointerId);}catch(_){}}V.x-=dx/r.width*V.w;V.y-=dy/r.height*V.h;last=[e.clientX,e.clientY];applyView();}});
  const end=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;if(!P.size){last=null;wrap.classList.remove('grabbing');}};
  wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
  wrap.addEventListener('click',e=>{if(moved>6){e.stopPropagation();e.preventDefault();}},true);
  $('zin').onclick=()=>{const r=wrap.getBoundingClientRect();zoomAt(1/1.4,r.left+r.width/2,r.top+r.height/2);};
  $('zout').onclick=()=>{const r=wrap.getBoundingClientRect();zoomAt(1.4,r.left+r.width/2,r.top+r.height/2);};
  $('zreset').onclick=()=>{VIEW[L5.city]=cityFit();applyView();};
}

function bindDrag(card){
  card.addEventListener('pointerdown',e=>{
    e.preventDefault(); const z=+card.dataset.z; const sx=e.clientX,sy=e.clientY; let ghost=null;
    const move=ev=>{ if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=card.cloneNode(true);ghost.classList.add('drag');document.body.appendChild(ghost);}
      if(ghost){ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+'px';} };
    const up=ev=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);
      if(ghost){ghost.remove(); const t=document.elementFromPoint(ev.clientX,ev.clientY); const p=t&&t.closest&&t.closest('#g1svg .rg'); if(p) tryPlace(z,+p.dataset.z,p);}

    addEventListener('pointermove',move); addEventListener('pointerup',up);
  });
}

function renderG3(use,preview){

  }
  if(T.phase==='end'){
    const rank=T.score.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
    $('vizin').innerHTML=`<div class="qstage"><div class="qtext" style="text-align:center">最終排名</div><div class="score" style="max-width:640px;width:100%;margin:0 auto">${rank.map((r,k)=>`<div class="t" style="--c:var(${TEAMS[r.i].c})"><span style="font-weight:900;font-size:22px">${k+1}</span><span><span class="tdot"></span> ${TEAMS[r.i].n}</span><span class="pts">${r.s}</span></div>`).join('')}</div></div>`;
    side(`<div class="eyebrow">分組對戰</div><h2>結束！</h2><h3>討論</h3><ol class="qs"><li>你住的城市（或胡志明市）比較像哪一種模式？為什麼？</li><li>捷運通車後，沿線的土地利用會有什麼改變？</li><li>為什麼大都市很少只有一個中心？</li></ol><button class="btn primary" id="tre">再玩一次</button>`);
    $('tre').onclick=()=>{T.phase='setup';drawTeam();}; return;
  }
  const q=T.cur, team=TEAMS[T.turn], dbl=T.round===ROUNDS-1;
  if(q.type==='mc'){
    $('vizin').innerHTML=`<div class="qstage"><div class="qtext">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button type="button" class="opt${T.ans!=null?(o.r?' right':(k===T.ans?' wrong':'')):''}" data-k="${k}" ${T.ans!=null?'disabled':''}><span class="k">${'ABCD'[k]}</span>${esc(o.t)}</button>`).join('')}</div></div>`;
    $('vizin').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    $('legend').innerHTML='';
  }else{
    $('vizin').innerHTML=`<div class="qstage"><div class="qtext">${esc(q.q)}</div><div class="qd"><svg id="tq" style="width:100%;height:100%;max-height:60vh"></svg></div></div>`;
    drawModel($('tq'),q.m,{numbers:T.ans!=null,hot:T.ans!=null?q.z:null,dim:T.ans!=null?q.z:null,onPick:z=>{if(T.ans==null)answer(z);}});
    $('legend').innerHTML=T.ans!=null?legendHTML(MODELS[q.m].zones,q.m):'';
  }
  const right=T.ans!=null&&(q.type==='mc'?q.o[T.ans]&&q.o[T.ans].r:T.ans===q.z);
  side(`<div class="eyebrow">分組對戰　第 ${T.round+1}／${ROUNDS} 回合${dbl?'（分數加倍）':''}</div>
   <div class="turn" style="--c:var(${team.c})"><span class="big">${team.n} 作答</span><span class="meta"><span>答對 +${dbl?20:10} 分</span><span class="timer" id="tmr">${T.ans==null?T.left+' 秒':''}</span></span></div>
   ${T.ans!=null?`<div class="verdict ${right?'ok':'bad'}">${T.ans===-1?'時間到':right?'答對了！':'答錯了'}<small>${q.type==='pick'&&!right?`正確位置在圖上框起來的「${esc(zname(q.m,q.z))}」。`:''}${esc(q.w||'')}</small></div>
     <div class="row"><button class="btn primary" id="tnext">${T.round===ROUNDS-1&&T.turn===T.n-1?'看結果':'下一組'}</button><button class="btn" id="tundo">復原這題</button></div>`:''}
   <div class="score${T.n>3?' two':''}">${T.score.map((s,i)=>`<div class="t${i===T.turn?' now':''}" style="--c:var(${TEAMS[i].c})"><span class="tdot"></span><span>${TEAMS[i].n}</span><span class="pts">${s}</span></div>`).join('')}</div>
   <button class="btn" id="tstop" style="align-self:flex-start">結束對戰</button>`);
  if($('tnext'))$('tnext').onclick=nextTurn;
  if($('tundo'))$('tundo').onclick=()=>{const h=T.hist.pop();if(h){T.score[h.team]-=h.pts;}T.ans=null;T.left=T.sec;drawTeam();startTimer();};
  $('tstop').onclick=()=>{if(confirm('確定要結束這次對戰嗎？'))T.phase='end',drawTeam();};
}
function startTimer(){clearInterval(T.timer);T.timer=setInterval(()=>{if(st.mode!=='team'||T.phase!=='q'||T.ans!=null){clearInterval(T.timer);return;}T.left--;const e=$('tmr');if(e)e.textContent=T.left+' 秒';if(T.left<=0){clearInterval(T.timer);answer(-1);}},1000);}
function answer(k){
  if(T.ans!=null)return; const q=T.cur; T.ans=k; clearInterval(T.timer);
  const right=k!==-1&&(q.type==='mc'?q.o[k].r:k===q.z); const pts=right?(T.round===ROUNDS-1?20:10):0;
  T.score[T.turn]+=pts; T.hist.push({team:T.turn,pts}); drawTeam();
}
function nextTurn(){
  T.turn++; if(T.turn>=T.n){T.turn=0;T.round++;}
  if(T.round>=ROUNDS){T.phase='end';drawTeam();return;}
  T.cur=T.deck[T.round*T.n+T.turn]; T.ans=null; T.left=T.sec; drawTeam(); startTimer();
}

/* ===================== 主程式 ===================== */
const st={mode:'learn',step:0};
function side(html){$('side').innerHTML=html;}
function render(){
  $('viz').classList.remove('auto');
  $('foot').hidden=st.mode!=='learn';
  ['mLearn','mSolo','mTeam'].forEach((id,i)=>$(id).setAttribute('aria-pressed',String(['learn','solo','team'][i]===st.mode)));
  if(st.mode==='learn'){
    if(st.step!==2)stopPlay();
    [drawL1,drawL2,drawL3,drawL4,drawL5][st.step]();
    $('dots').innerHTML=STEPS.map((s,i)=>`<button type="button" data-s="${i}" aria-current="${i===st.step?'step':'false'}">${i+1}<span class="t"> ${s}</span></button>`).join('');
    $('dots').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.step=+b.dataset.s;render();});
    $('prev').disabled=st.step===0; $('next').disabled=st.step===STEPS.length-1;
  }else{ stopPlay(); if(st.mode==='solo')drawSolo(); else drawTeam(); }
}
$('mLearn').onclick=()=>{st.mode='learn';render();};
$('mSolo').onclick=()=>{st.mode='solo';render();};
$('mTeam').onclick=()=>{st.mode='team';render();};
$('prev').onclick=()=>{if(st.step>0){st.step--;render();}};
$('next').onclick=()=>{if(st.step<STEPS.length-1){st.step++;render();}};
document.addEventListener('keydown',e=>{
  if(st.mode!=='learn'||e.target.closest('input,textarea,select'))return;
  if(e.key==='ArrowRight'&&st.step<STEPS.length-1){st.step++;render();}
  else if(e.key==='ArrowLeft'&&st.step>0){st.step--;render();}
  else if(/^[1-5]$/.test(e.key)){st.step=+e.key-1;render();}
});
let rsz; addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{
  if(st.mode==='learn'&&st.step===0)drawL1();
  else if(st.mode==='learn'&&st.step===4)applyView();
  else if(st.mode==='solo'&&SOLO.lv===2)drawG3();
},150);});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>render());
render();

</script>
</body>
</html>
