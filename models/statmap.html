<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; frame-src 'self' about:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>統計地圖工作室</title>
<link rel="stylesheet" href="../vendor/fonts.css">
<style>
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1f2a36; --ink2:#566372; --line:#d3dae2;
  --accent:#2f4f8a; --accent-soft:#e3eaf6; --warn:#a8402c; --warn-soft:#fbeee9; --ok:#2e7d55; --ok-soft:#e6f3ec;
  --mapbg:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161b22; --paper:#1f262f; --ink:#e6ebf1; --ink2:#9aa7b5; --line:#34404d;
    --accent:#8fb0ea; --accent-soft:#26344a; --warn:#f08a74; --warn-soft:#3a2622; --ok:#6fd39f; --ok-soft:#1d3329;
    --mapbg:#f4f5f2;
  }
}
:root[data-theme="dark"]{
  --bg:#161b22; --paper:#1f262f; --ink:#e6ebf1; --ink2:#9aa7b5; --line:#34404d;
  --accent:#8fb0ea; --accent-soft:#26344a; --warn:#f08a74; --warn-soft:#3a2622; --ok:#6fd39f; --ok-soft:#1d3329;
  --mapbg:#f4f5f2;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
kbd{font-family:inherit;font-size:.85em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 16px 8px;flex:0 0 auto}
.top h1{margin:0 2px 0 0;font-size:21px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-size:16px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10161d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10161d}}
.seg button .k{font-size:12px;opacity:.65;margin-left:3px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-size:16px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#10161d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#10161d}}
.btn.sm{padding:2px 9px;font-size:15px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:14px;padding:0 16px 12px;flex:1;min-height:0}
.mapcol{min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.mapbox{position:relative;flex:1;min-height:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;justify-content:center;align-items:center;overflow:hidden}
#map{height:100%;width:100%;display:block;touch-action:manipulation}
#map .rg{cursor:pointer}
#map .rg:hover{stroke:#1f2a36;stroke-width:1.6}
.alert{border-radius:10px;padding:8px 12px;font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.alert.info{background:var(--accent-soft);border-color:var(--line)}
.alert b{color:var(--warn)}
.alert.info b{color:var(--accent)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alerts:empty{display:none}
.maptools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.maptools .seg{border:1px solid var(--line);padding:3px}
.maptools .mt-l{font-size:15px;color:var(--ink2);white-space:nowrap}
.maptools .seg button{font-size:15px;padding:3px 9px}
.norths{display:flex;flex-wrap:wrap;gap:6px}
.norths button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:2px;width:62px;height:70px}
.norths button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.norths svg{width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;max-width:280px;z-index:4}
.tip b{display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw}
.toast.on{opacity:.95}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:9px 6px;font-size:16px;color:var(--ink2);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pbody{flex:1;overflow:auto;padding:12px 14px 16px;min-height:0}
.pbody h3{font-size:16px;margin:14px 0 6px;color:var(--ink2);font-weight:600}
.pbody h3:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.hint{color:var(--ink2);font-size:15px;margin:4px 0 8px}
.colcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
.colcard input[type=text]{width:100%;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.colcard .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.colcard .meta input{width:110px}
.colcard .src{grid-column:1/-1;font-size:14px;color:var(--ink2)}
.kind{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.kind button{border:0;background:none;padding:2px 9px;font-size:15px;color:var(--ink2)}
.kind button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.x{border:0;background:none;color:var(--warn);font-size:18px;padding:0 4px;line-height:1}
table.dt{border-collapse:collapse;width:100%;font-size:15px}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;white-space:nowrap}
table.dt th{position:sticky;top:-12px;background:var(--paper);z-index:1;font-weight:600}
table.dt td.nm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.dt td.nm small{display:block;color:var(--ink2);font-size:13px;line-height:1.2}
table.dt input{width:96px;padding:2px 5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
table.dt tr.hl td{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}
label.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:12px}
select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);max-width:100%}
input[type=range]{width:160px;vertical-align:middle}
input.num{width:110px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input.wide{width:100%;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pals{display:grid;grid-template-columns:1fr;gap:5px}
.pal{display:flex;align-items:center;gap:8px;border:2px solid transparent;border-radius:8px;padding:3px 6px;background:none;text-align:left;width:100%}
.pal[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pal .sw{display:flex;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
.pal .sw i{display:block;width:20px;height:18px}
.pal .pn{font-size:15px;flex:1}
.badge{font-size:12px;border-radius:5px;padding:0 5px;background:var(--ok-soft);color:var(--ok);border:1px solid currentColor;white-space:nowrap}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.foot{font-size:14px;color:var(--ink2);margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--paper);border-radius:12px;padding:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.modal textarea{width:100%;height:220px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);font-family:ui-monospace,Consolas,monospace;font-size:15px}
.modal h2{margin:0 0 6px;font-size:19px}
.loadfail{display:none}

@media (max-width:980px){
  body{display:block;height:auto}
  .layout{grid-template-columns:minmax(0,1fr);height:auto}
  .mapbox{height:auto;aspect-ratio:760/800;max-height:90vh}
  .panel{max-height:none}
  .pbody{overflow:visible}
  .top h1{font-size:19px;width:100%}
}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff;padding:0}
  .top,.panel,.alerts,.tip,.toast,.modal{display:none!important}
  .layout{display:block;height:auto;padding:0}
  .mapbox{border:0;padding:0;height:auto}
  #map{width:100%;height:auto;max-height:270mm}
}
</style>
</head>
<body>
<header class="top">
  <h1>統計地圖工作室</h1>
  <div class="seg" id="mapSeg" role="group" aria-label="底圖"></div>
  <div class="seg" id="typeSeg" role="group" aria-label="地圖種類"></div>
  <span class="spacer"></span>
  <button class="btn" id="pngBtn" title="下載 PNG 圖片">下載圖片</button>
  <button class="btn" id="printBtn" title="列印或另存 PDF">列印／PDF</button>
  <button class="btn" id="fsBtn" title="全螢幕（F）">全螢幕</button>
</header>
<main class="layout">
  <section class="mapcol">
    <div class="maptools" id="maptools"></div>
    <div class="alerts" id="alerts"></div>
    <div class="mapbox" id="mapbox">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="統計地圖"></svg>
      <div class="tip" id="tip"></div>
    </div>
  </section>
  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="data">① 資料</button>
      <button role="tab" data-tab="style">② 地圖設定</button>
      <button role="tab" data-tab="text">③ 圖面與說明</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </aside>
</main>
<div class="modal" id="pasteModal" role="dialog" aria-modal="true" aria-labelledby="pasteTitle">
  <div class="box">
    <h2 id="pasteTitle">貼上資料</h2>
    <p class="hint">在 Excel 或 Google 試算表選取整個表格（<b>第一列是標題</b>，其中一欄是縣市或省名），複製後貼在下面。名稱寫法不同也認得，例如「台北」「臺北市」、「Hồ Chí Minh」「Ho Chi Minh」「胡志明」。</p>
    <textarea id="pasteArea" placeholder="縣市&#9;人口數&#9;老年人口比例&#10;臺北市&#9;2440964&#9;24.18&#10;新北市&#9;4045301&#9;20.1"></textarea>
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button class="btn" id="pasteCancel">取消</button>
      <button class="btn pri" id="pasteOk">匯入</button>
    </div>
  </div>
</div>
<input type="file" id="fileIn" accept=".csv,.txt,.tsv,.xlsx" hidden>
<div class="toast" id="toast"></div>

function num(s){
  if(s==null)return null;
  if(typeof s==='number')return isFinite(s)?s:null;
  s=String(s).trim().replace(/[０-９．－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，\s%％]/g,'');
  if(s===''||s==='-'||s==='—'||s==='－')return null;
  const v=Number(s);return isFinite(v)?v:null;
}
function decOf(v){if(v==null||Number.isInteger(v))return 0;const s=String(v);const i=s.indexOf('.');return i<0?0:Math.min(3,s.length-i-1);}
function fmt(v,d){if(v==null||!isFinite(v))return '—';return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function niceNum(x){if(x<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(x)));const f=x/e;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e;}
function niceRound(x){if(x<=0)return 0;const e=Math.pow(10,Math.floor(Math.log10(x)));return Math.round(x/e*2)/2*e;}
function strip(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

}

/* ---------- 分級 ---------- */
function classifyV(v,col){
  const vs=valuesIn(v.map,col).slice().sort((a,b)=>a-b);
  const n=vs.length;if(!n)return null;
  const min=vs[0],max=vs[n-1];let k=v.choro.k,br=[];
  const m=v.choro.method;
  if(m==='quantile'){
    for(let i=1;i<k;i++){br.push(vs[Math.min(n-1,Math.max(0,Math.ceil(i*n/k)-1))]);}
  }else if(m==='equal'){
    for(let i=1;i<k;i++)br.push(min+(max-min)*i/k);
  }else if(m==='jenks'){
    br=jenks(vs,k);
  }else{
    br=(v.choro.custom||[]).filter(x=>x>min&&x<max).sort((a,b)=>a-b);
  }
  br=br.filter((x,i)=>i===0||x>br[i-1]);
  br=br.filter(x=>x<max);
  const K=br.length+1;
  const d=colDecIn(v.map,col);
  const step=(max-min)/K;
  const bd=(m==='quantile'||m==='jenks')?d:Math.max(d,step<1?2:step<10?1:0);
  const cls=x=>{if(x==null||!isFinite(x))return -1;for(let i=0;i<br.length;i++)if(x<=br[i])return i;return K-1;};
  const counts=new Array(K).fill(0);vs.forEach(x=>counts[cls(x)]++);
  // GVF：分得好不好（組內差異小、組間差異大）
  const mean=vs.reduce((a,b)=>a+b,0)/n;const sdam=vs.reduce((a,b)=>a+(b-mean)**2,0);
  const groups=Array.from({length:K},()=>[]);vs.forEach(x=>groups[cls(x)].push(x));
  let sdcm=0;for(const g of groups){if(!g.length)continue;const mm=g.reduce((a,b)=>a+b,0)/g.length;sdcm+=g.reduce((a,b)=>a+(b-mm)**2,0);}

}

// Fisher-Jenks 自然斷點（動態規劃，資料量小可求最佳解）
function jenks(data,k){
  const n=data.length;if(k>=n)return data.slice(0,-1);
  const mat1=[],mat2=[];
  for(let i=0;i<=n;i++){mat1.push(new Array(k+1).fill(0));mat2.push(new Array(k+1).fill(0));}
  for(let j=1;j<=k;j++){mat1[1][j]=1;mat2[1][j]=0;for(let i=2;i<=n;i++)mat2[i][j]=Infinity;}
  for(let l=2;l<=n;l++){
    let s1=0,s2=0,w=0,v=0;
    for(let m=1;m<=l;m++){
      const i3=l-m+1,val=data[i3-1];
      s2+=val*val;s1+=val;w++;v=s2-s1*s1/w;
      const i4=i3-1;
      if(i4!==0)for(let j=2;j<=k;j++){if(mat2[l][j]>=v+mat2[i4][j-1]){mat1[l][j]=i3;mat2[l][j]=v+mat2[i4][j-1];}}
    }
    mat1[l][1]=1;mat2[l][1]=v;
  }
  const br=[];let kk=n;
  for(let j=k;j>=2;j--){const id=mat1[kk][j]-2;br.unshift(data[id]);kk=mat1[kk][j]-1;}
  return br;
}
function palColorsV(v,K){

  if(K<3){arr=K===1?[arr[1]]:[arr[0],arr[2]];}
  return arr;
}

function pathBBox(mid,r){

function propSymbols(v,col,R,pfx){

  let total=0;for(const r of R){const x=col.vals[r.id];if(x>0)total+=Math.round(x/unit);}
  const cap=25000;

  R.forEach((r,ri)=>{
    const x=col.vals[r.id];if(!(x>0))return;
    let n=Math.round(x/unit*ratio);if(!n)return;
    const [x0,y0,x1,y1]=pathBBox(v.map,r);const p=new Path2D(r.d);
    const rnd=mulberry(1000+ri*7919+(v.map.length*31));
    let tries=0;
    while(n>0&&tries<n*60+400){tries++;const px=x0+(x1-x0)*rnd(),py=y0+(y1-y0)*rnd();if(inPath(p,px,py)){pts.push(px.toFixed(1),py.toFixed(1));n--;}}
    if(n>0&&r.c){for(let i=0;i<n;i++)pts.push((r.c[0]+(rnd()-.5)*4).toFixed(1),(r.c[1]+(rnd()-.5)*4).toFixed(1));}
  });
  const rr=v.dot.size,color=S.style==='bw'?'#000000':v.dot.color;
  let dpath='';for(let i=0;i<pts.length;i+=2)dpath+=`M${pts[i]},${pts[i+1]}m-${rr},0a${rr},${rr} 0 1,0 ${2*rr},0a${rr},${rr} 0 1,0 -${2*rr},0`;
  const s=`<path d="${dpath}" fill="${color}" fill-opacity="0.85" pointer-events="none"/>`;
  v.dot.capped=ratio<1;v.dot.total=total;
  const [x,y]=MAPS[v.map].legend;
  const top=y+(col.unit?30:12);
  const l=`<g>${legendBox(x,y,190,(top-y)+44)}${legendHead(x,y,col.name,col.unit)}<circle cx="${x+8}" cy="${top+10}" r="${Math.max(rr,2.8)}" fill="${color}"/>${txt(x+20,top+15,`1 點 = ${fmt(unit,decOf(unit))} ${col.unit||''}`,{size:14})}${txt(x,top+38,'點的位置在區域內隨機分布',{size:12,fill:'#4a5563'})}</g>`;
  return {s,l};
}
function qualColorsV(v,n){const a=CB.qual[v.chart.pal]||CB.qual.Set2;return Array.from({length:n},(_,i)=>S.style==='bw'?['#000000','#555555','#999999','#cccccc','#ffffff','#777777'][i%6]:a[i%a.length]);}
function chartSymbols(v,cs,R,pfx){
  const cols=qualColorsV(v,cs.length);let s='';
  const totals=R.map(r=>cs.reduce((a,c)=>a+(c.vals[r.id]>0?c.vals[r.id]:0),0));
  const tmax=Math.max(0,...totals);
  const allMax=Math.max(0,...cs.flatMap(c=>valuesIn(v.map,c)));
  const small=v.map==='vn63';
  R.forEach((r,ri)=>{
    if(!r.c)return;const [cx,cy]=r.c;
    const vs=cs.map(c=>c.vals[r.id]);if(vs.every(x=>x==null))return;
    if(v.chart.kind==='pie'){
      const tot=totals[ri];if(!(tot>0))return;
      const rad=v.chart.sized?7+19*Math.sqrt(tot/tmax):(small?9:13);
      let a0=-Math.PI/2;let g='';
      vs.forEach((x,i)=>{if(!(x>0))return;const a1=a0+2*Math.PI*x/tot;
        if(x/tot>0.9999){g+=`<circle cx="${cx}" cy="${cy}" r="${rad.toFixed(1)}" fill="${cols[i]}"/>`;}
        else{const lg=a1-a0>Math.PI?1:0;g+=`<path d="M${cx},${cy}L${(cx+rad*Math.cos(a0)).toFixed(1)},${(cy+rad*Math.sin(a0)).toFixed(1)}A${rad.toFixed(1)},${rad.toFixed(1)} 0 ${lg},1 ${(cx+rad*Math.cos(a1)).toFixed(1)},${(cy+rad*Math.sin(a1)).toFixed(1)}Z" fill="${cols[i]}" stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round"/>`;}
        a0=a1;});
      s+=`<g filter="url(#${pfx}ss)">${g}<circle cx="${cx}" cy="${cy}" r="${rad.toFixed(1)}" fill="none" stroke="#3f4a55" stroke-width="0.8"/></g>`+(S.style==='bw'?'':`<circle cx="${cx}" cy="${cy}" r="${rad.toFixed(1)}" fill="url(#${pfx}gl)" opacity="0.7" pointer-events="none"/>`);
    }else{
      const bw=small?4:6,Hh=small?28:44;const w=cs.length*bw;const x0=cx-w/2,base=cy+Hh/2;
      let g='';
      vs.forEach((x,i)=>{if(!(x>0)||!(allMax>0))return;const h=Hh*x/allMax;g+=`<rect x="${x0+i*bw}" y="${(base-h).toFixed(1)}" width="${bw-0.8}" height="${h.toFixed(1)}" fill="${cols[i]}" stroke="#3f4a55" stroke-width="0.5"/>`;});
      s+=`<g filter="url(#${pfx}ss)">${g}<line x1="${x0-2}" y1="${base}" x2="${x0+w+2}" y2="${base}" stroke="#3f4a55" stroke-width="1"/></g>`;
    }
  });
  const [x,y]=MAPS[v.map].legend;
  let g='';cs.forEach((c,i)=>{g+=`<rect x="${x}" y="${y+12+i*24}" width="20" height="17" fill="${cols[i]}" stroke="#3f4a55" stroke-width="0.6"/>`+txt(x+28,y+26+i*24,`${c.name}${unitText(c)}`,{size:14});});
  let extra='',h=cs.length*24+8;
  const Hh=small?28:44;
  if(v.chart.kind==='bar'&&allMax>0){extra=txt(x,y+h+14,`長條最高 ${Hh} 像素 = ${fmt(allMax,0)}`,{size:12,fill:'#4a5563'});h+=20;}
  if(v.chart.kind==='pie'){extra=txt(x,y+h+14,v.chart.sized?'圓的大小依各欄合計':'扇形大小＝各欄占合計的比例',{size:12,fill:'#4a5563'});h+=20;}
  const w=Math.max(170,...cs.map(c=>(c.name+unitText(c)).length*14+30));
  const l=`<g>${legendBox(x,y,w,h)}${txt(x,y,'圖例',{size:15,bold:true})}${g}${extra}</g>`;
  return {s,l};
}

  }else{
    const cs=chartCols();
    if(d.cols.length<2)A.push(`<div class="alert info"><span>圓餅圖、長條圖需要 <b>2 欄以上</b>的資料，例如一級、二級、三級產業人口。請先在「① 資料」新增欄位或貼上資料。</span></div>`);
    else{
      const units=new Set(cs.map(c=>c.unit));

    if(c){const miss=regions().filter(r=>c.vals[r.id]==null).length;if(miss&&miss<regions().length)A.push(`<div class="alert info"><span>有 ${miss} 個區域沒有「${esc(c.name)}」的資料${S.type==='choro'?'，以灰色表示':''}。</span></div>`);}
  }
  $('#alerts').innerHTML=A.join('');
}

  h+=`<p class="hint">好的統計地圖要有：圖名、圖例、指北針、比例尺、資料來源。本模型會自動加上，圖名、副標題和來源可以自己改。</p>`;
  h+=`<h3>地圖標籤</h3><p class="hint">在地圖上方切換「名稱、數值、名稱＋數值、隱藏」，或按 <kbd>N</kbd> 一鍵顯示／隱藏。</p>`;
  if(M.lang)h+=`<div class="row">名稱用 <div class="seg" role="group">${[['zh','中文'],['vi','越南文'],['both','中＋越']].map(([k,n])=>`<button data-act="lang" data-k="${k}" aria-pressed="${S.lang===k}">${n}</button>`).join('')}</div></div>`;

  h+=footHtml();

function footHtml(){
  return `<div class="foot">快捷鍵：<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 換底圖　<kbd>4</kbd>～<kbd>7</kbd> 換地圖種類　<kbd>N</kbd> 標籤　<kbd>R</kbd> 設定重來　<kbd>F</kbd> 全螢幕<br>`+
  `邊界：臺灣依內政部（taiwan-atlas）、越南依 Nguyễn Duy Liêm（2025）資料，經簡化；越南南海群島依越南官方行政區劃繪製。配色：ColorBrewer（Cynthia Brewer, Penn State）。理想化模型，僅供教學示意。</div>`;
}

function loadSamples(){
  const d=D();const ss=samples(S.map);
  const have=new Set(d.cols.map(c=>c.name));
  let n=0;for(const c of ss)if(!have.has(c.name)){d.cols.push(c);n++;}
  S.tab=S.tab==='data'?'data':S.tab;
  renderAll();toast(n?`已載入 ${n} 欄範例資料`:'範例資料已經在表裡了');
}
function makeDensity(col){
  const R=regions();const unit=col.unit?`${col.unit}/平方公里`:'每平方公里';
  const vals={};for(const r of R){const v=col.vals[r.id];vals[r.id]=v==null?null:Math.round(v/r.area*100)/100;}
  const name=/人口/.test(col.name)?col.name.replace(/(規模|數|總數)?$/,'')+'密度':col.name+'密度';
  const c=newCol({name,unit,kind:'ratio',src:(col.src?col.src+'；':'')+'面積：'+(S.map==='tw'?'內政部':S.map==='vn34'?VN_SRC:'由邊界計算'),vals});
  D().cols.push(c);return c;
}
function merge63(){
  const src=S.data.vn63.cols;
  if(!src.length){toast('63 省這邊還沒有資料');return;}
  const tot=src.filter(c=>c.kind==='total'),rat=src.filter(c=>c.kind==='ratio');
  if(!tot.length){alert('目前的欄位都是「比率／密度」，不能直接相加。\n\n請準備「總量」資料（例如人口數、面積），分別合併後再相除，才能得到 34 省的比率。');return;}
  const R34=GEO.vn34.regions,R63=GEO.vn63.regions;const incomplete=[];
  for(const c of tot){
    const vals={};
    for(const r of R34){
      const parts=R63.filter(x=>x.to===r.id);
      const vs=parts.map(x=>c.vals[x.id]);
      if(vs.some(v=>v==null)){vals[r.id]=null;if(vs.some(v=>v!=null))incomplete.push(r.zh);}
      else vals[r.id]=Math.round(vs.reduce((a,b)=>a+b,0)*1000)/1000;
    }
    S.data.vn34.cols.push(newCol({name:c.name+'（由 63 省合併）',unit:c.unit,kind:'total',src:(c.src?c.src+'；':'')+'依 2025 年行政區合併相加',vals}));
  }
  S.map='vn34';S.tab='data';renderAll();
  let msg=`已把 ${tot.length} 欄總量資料合併成 34 省。`;
  if(rat.length)msg+=`\n\n「${rat.map(c=>c.name).join('、')}」是比率／密度，不能直接相加，所以沒有合併。\n要得到 34 省的比率，請把分子和分母（例如人口數與面積）各自合併後再相除。`;
  if(incomplete.length)msg+=`\n\n${[...new Set(incomplete)].join('、')} 有部分舊省缺資料，合併後留白。`;
  setTimeout(()=>alert(msg),50);
}

function openPaste(){$('#pasteModal').classList.add('on');$('#pasteArea').value='';setTimeout(()=>$('#pasteArea').focus(),30);}
function closePaste(){$('#pasteModal').classList.remove('on');}
$('#pasteCancel').addEventListener('click',closePaste);

$('#pasteModal').addEventListener('click',e=>{if(e.target.id==='pasteModal')closePaste();});
function parseText(t){
  t=t.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const lines=t.split('\n').filter(l=>l.trim()!=='');
  if(!lines.length)return [];
  const delim=lines[0].includes('\t')?'\t':(lines[0].split(';').length>lines[0].split(',').length?';':',');
  return lines.map(l=>parseLine(l,delim));
}
function parseLine(l,d){
  if(d==='\t')return l.split('\t').map(s=>s.trim());
  const out=[];let cur='',q=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===d){out.push(cur.trim());cur='';}else cur+=ch;}
  out.push(cur.trim());return out;
}
function bestNameCol(rows,mid){
  const w=Math.max(...rows.map(r=>r.length));let best=-1,bi=0;
  for(let j=0;j<w;j++){let n=0;for(const r of rows.slice(1))if(matchName(mid,r[j]))n++;if(n>best){best=n;bi=j;}}
  return {col:bi,hits:best};
}
function importRows(rows,how){
  if(rows.length<2){toast('沒有讀到資料：至少要有標題列和一列數值');return;}
  // which map fits best?
  const fits=Object.keys(GEO).map(m=>({m,...bestNameCol(rows,m)}));
  let target=fits.find(f=>f.m===S.map);
  const best=fits.slice().sort((a,b)=>b.hits-a.hits)[0];
  if(best.m!==S.map&&best.hits>target.hits*1.5&&best.hits>=3){
    target=best;
    toast(`這份資料看起來是「${MAPS[best.m].label}」，已切換過去`,3500);
    S.map=best.m;
  }
  if(target.hits===0){alert('找不到可以對應的縣市或省名。\n請確認有一欄是名稱，例如「臺北市」「Hà Nội」「河內」。');return;}
  const mid=S.map,head=rows[0],nc=target.col;
  const matched=[],unmatched=[];
  const rowRid=rows.slice(1).map(r=>{const id=matchName(mid,r[nc]);if(id)matched.push(id);else if(r[nc])unmatched.push(r[nc]);return id;});
  const newCols=[];
  for(let j=0;j<head.length;j++){
    if(j===nc)continue;
    const vals={};let cnt=0;
    rows.slice(1).forEach((r,i)=>{const id=rowRid[i];if(!id)return;const v=num(r[j]);if(v!=null){vals[id]=v;cnt++;}});
    if(!cnt)continue;
    const name=(head[j]||`資料${j+1}`).trim();
    const m=name.match(/[（(]([^）)]+)[）)]\s*$/);
    const unit=m?m[1]:(/%|％|率|比例/.test(name)?'%':'');
    const kind=/率|比|%|％|密度|平均|每|指數|人均/.test(name)?'ratio':'total';
    newCols.push(newCol({name:m?name.replace(m[0],'').trim():name,unit,kind,src:'',vals}));
  }
  if(!newCols.length){alert('有對到名稱，但沒有讀到數字欄位。');return;}
  S.data[mid].cols.push(...newCols);
  S.tab='data';renderAll();
  const total=GEO[mid].regions.length;
  let msg=`${how}完成：新增 ${newCols.length} 欄（${newCols.map(c=>c.name+'＝'+(c.kind==='total'?'總量':'比率')).join('、')}），對到 ${new Set(matched).size}／${total} 個區域。`;
  if(unmatched.length)msg+=`\n\n這些名稱對不到，已略過：${unmatched.slice(0,12).join('、')}${unmatched.length>12?'…':''}`;
  msg+=`\n\n請檢查每欄是「總量」還是「比率／密度」，不對可以在欄位卡片上改。`;
  setTimeout(()=>alert(msg),50);
}
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    if(/\.xlsx$/i.test(f.name))importRows(await readXlsx(f),'上傳');
    else if(/\.xls$/i.test(f.name))alert('這是舊版 Excel（.xls）。請在 Excel 選「另存新檔」→ .xlsx 或 CSV 再上傳。');
    else{const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(_){t=new TextDecoder('big5').decode(buf);}importRows(parseText(t),'上傳');}
  }catch(err){alert('讀不到這個檔案：'+(err&&err.message||err)+'\n可以改用「貼上 Excel 資料」，或另存成 CSV 再上傳。');}
});
async function readXlsx(file){
  if(typeof DecompressionStream==='undefined')throw new Error('這個瀏覽器不支援讀取 Excel 檔');
  const buf=new Uint8Array(await file.arrayBuffer());const dv=new DataView(buf.buffer);
  let eocd=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('不是 Excel 檔');
  const cnt=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);
  const files={};const dec=new TextDecoder();
  for(let i=0;i<cnt;i++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=dec.decode(buf.subarray(p+46,p+46+nl));files[name]={method,csize,off};p+=46+nl+el+cl;
  }
  async function read(name){
    const f=files[name];if(!f)return null;
    const ln=dv.getUint16(f.off+26,true),le=dv.getUint16(f.off+28,true);const start=f.off+30+ln+le;
    const data=buf.subarray(start,start+f.csize);
    if(f.method===0)return dec.decode(data);
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(ds).text();
  }
  const X=s=>new DOMParser().parseFromString(s,'application/xml');
  let sheet='xl/worksheets/sheet1.xml';
  const wb=await read('xl/workbook.xml'),rels=await read('xl/_rels/workbook.xml.rels');
  if(wb&&rels){const s1=X(wb).getElementsByTagName('sheet')[0];const rid=s1&&(s1.getAttribute('r:id')||s1.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    for(const r of X(rels).getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid){let t=r.getAttribute('Target');t=t.replace(/^\/?xl\//,'').replace(/^\//,'');sheet='xl/'+t;}}
  const ssx=await read('xl/sharedStrings.xml');const ss=[];
  if(ssx)for(const si of X(ssx).getElementsByTagName('si')){let s='';for(const t of si.getElementsByTagName('t'))s+=t.textContent;ss.push(s);}
  const sx=await read(sheet);if(!sx)throw new Error('找不到工作表');
  const rows=[];
  for(const row of X(sx).getElementsByTagName('row')){
    const arr=[];
    for(const c of row.getElementsByTagName('c')){
      const ref=c.getAttribute('r')||'';const letters=ref.replace(/\d+/g,'');let ci=0;for(const ch of letters)ci=ci*26+(ch.charCodeAt(0)-64);ci-=1;
      const t=c.getAttribute('t');const v=c.getElementsByTagName('v')[0];let val='';
      if(t==='s')val=ss[+(v&&v.textContent)]??'';else if(t==='inlineStr'){val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');}else val=v?v.textContent:'';
      arr[ci<0?arr.length:ci]=val;
    }
    if(arr.some(x=>x!==undefined&&String(x).trim()!==''))rows.push(Array.from(arr,x=>x??''));
  }
  return rows;
}

/* ---------- 輸出 ---------- */
function exportPNG(){
  const svg=$('#map').cloneNode(true);
  const g=GEO[S.map];
  svg.setAttribute('width',g.W);svg.setAttribute('height',g.H);
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const s=new XMLSerializer().serializeToString(svg);
  const url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    const k=2,c=document.createElement('canvas');c.width=g.W*k;c.height=g.H*k;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>{
      if(!b){toast('圖片產生失敗');return;}
      const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download=(svg.getAttribute('aria-label')||'統計地圖').replace(/[\\/:*?"<>|]/g,'')+'.png';
      document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
      toast('已下載 PNG 圖片');
    },'image/png');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('圖片產生失敗，請改用「列印／PDF」');};
  img.src=url;
}

$('#maptools').addEventListener('click',e=>{const b=e.target.closest('[data-lm]');if(b)setLabelMode(b.dataset.lm);});
function resetSettings(){
  Object.assign(S.choro,{k:5,method:'quantile',custom:null,pal:'seq:YlOrRd'});
  Object.assign(S.prop,{rmax:34,color:SINGLE[0]});
  Object.assign(S.dot,{unitFor:null,size:2.2,color:SINGLE[2]});
  Object.assign(S.chart,{kind:'pie',sized:false,pal:'Set2'});
  S.style='color';S.north='half';
  S.hl=null;D().title='';D().sub='';D().src='';
  renderAll();toast('地圖設定已重來（資料保留）');
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if($('#pasteModal').classList.contains('on'))return;
  const k=e.key;
  if(k==='f'||k==='F'){toggleFS();e.preventDefault();}
  else if(k==='r'||k==='R'){resetSettings();}
  else if(k==='n'||k==='N'){toggleLabels();}
  else if(k==='1')setMap('tw');else if(k==='2')setMap('vn34');else if(k==='3')setMap('vn63');
  else{const t=Object.entries(TYPES).find(([,v])=>v.key===k);if(t)setType(t[0]);}
});

function renderAll(){renderTop();const st=pb.scrollTop;renderPanel();pb.scrollTop=S.tab===renderAll.lastTab?st:0;renderAll.lastTab=S.tab;drawMap();}
try{
  S.data.tw.cols=samples('tw');
  renderAll();
}catch(err){
  document.body.insertAdjacentHTML('afterbegin','<p style="padding:12px;background:#fbeee9">地圖載入失敗，請重新整理頁面。（'+esc(err&&err.message)+'）</p>');
  console.error(err);
}
</script>
</body>
</html>
